<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A2E25">
<title>نظام الإحصاء والتقارير — مكتب التواصل والعلاقات العامة</title>
<style>
/* =========================================================
   نظام التصميم — نظام الإحصاء والتقارير
   الهوية: أخضر عميق رسمي + لمسة برونزية/ذهبية للتمييز
   ========================================================= */
:root{
  --green-950:#0A2E25;
  --green-800:#0E4B3D;
  --green-700:#146B54;
  --green-100:#E4EFEA;
  --gold-600:#B8902F;
  --gold-100:#F4E9CE;
  --bg:#F5F6F4;
  --surface:#FFFFFF;
  --surface-2:#EFF1EE;
  --text:#14201B;
  --text-muted:#5B6B63;
  --border:#DFE4E0;
  --success:#1E8A5F;
  --warning:#C98A1D;
  --danger:#B23A3A;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,32,27,.06), 0 4px 16px rgba(20,32,27,.06);
  --font-ui: "Segoe UI", Tahoma, "Arial", sans-serif;
  --font-num: "Consolas", "Segoe UI", Tahoma, monospace;
}
[data-theme="dark"]{
  --bg:#0D1512;
  --surface:#152019;
  --surface-2:#1B2820;
  --text:#EAF1EC;
  --text-muted:#93A69B;
  --border:#25342B;
  --green-100:#173226;
  --gold-100:#2A2213;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  font-size:15px;
  line-height:1.55;
}
.hidden{display:none !important;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;appearance:none;-webkit-appearance:none;background:none;border:none;padding:0;margin:0;color:inherit;}
input,select,textarea{font-family:inherit;}

.saved-badge{font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:8px;}

/* شارة المزامنة السحابية: أيقونة نقطة دائرية مضغوطة */
.sync-badge{
  background:rgba(0,0,0,.06);border:1px solid var(--border);border-radius:50%;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;flex-shrink:0;transition:.2s;
}
.sync-badge:hover{background:rgba(0,0,0,.12);}
.sync-dot{width:11px;height:11px;border-radius:50%;display:block;transition:background .3s;}
.sync-dot-green{background:#3ddc84;box-shadow:0 0 6px #3ddc84;}
.sync-dot-yellow{background:#f0b429;box-shadow:0 0 6px #f0b429;animation:syncPulse 1.2s infinite;}
.sync-dot-red{background:#e05a4e;box-shadow:0 0 6px #e05a4e;}
.sync-dot-gray{background:#9aa8a4;}
@keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.diag-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.diag-row:last-child{border-bottom:none;}
.diag-row .dk{color:var(--text-muted);flex-shrink:0;}
.diag-row .dv{text-align:left;direction:ltr;word-break:break-all;}
.diag-ok{color:#3ddc84;}
.diag-fail{color:#e05a4e;}
.diag-pending{color:#f0b429;}

/* ---------- شاشة اختيار المكتب ---------- */
.landing-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%, var(--green-100), transparent), var(--bg);
  padding:24px;
}
.landing-inner{text-align:center;max-width:640px;width:100%;}
.landing-title-badge{
  width:72px;height:72px;border-radius:16px;background:#fff;color:var(--gold-600);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;
  margin:0 auto 30px;overflow:hidden;flex:none;box-shadow:var(--shadow);
}
.landing-title-badge img{width:100%;height:100%;object-fit:cover;display:block;}
.landing-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.landing-card{
  background:var(--green-950);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  border:none;border-radius:16px;
  padding:52px 20px;box-shadow:var(--shadow);text-align:center;transition:.15s;
  min-height:120px;display:flex;align-items:center;justify-content:center;
}
.landing-card:hover{transform:translateY(-2px);filter:brightness(1.05);}
.landing-card-name{font-size:19px;font-weight:700;color:var(--gold-600);text-shadow:0 1px 3px rgba(0,0,0,.4);}
@media (max-width:520px){.landing-cards{grid-template-columns:1fr;}}
.landing-footer{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--border);
}
.landing-footer-org{font-size:14px;font-weight:700;color:var(--green-800);margin-bottom:3px;}
.landing-footer-system{font-size:12px;color:var(--text-muted);}

/* ---------- تخطيط عام ---------- */
.app{
  display:grid;
  grid-template-columns:236px 1fr;
  grid-template-rows:62px 1fr;
  grid-template-areas:"sidebar topbar" "sidebar content";
  min-height:100vh;
}
.sidebar{
  grid-area:sidebar;
  width:236px;
  background:var(--green-950);
  color:#EAF1EC;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:22px 18px 16px;}
.brand-badge{
  width:38px;height:38px;border-radius:10px;background:#fff;
  color:var(--gold-600);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;flex:none;overflow:hidden;
}
.brand-badge img{width:100%;height:100%;object-fit:cover;}
.brand-title{font-size:14px;font-weight:600;}
.brand-sub{font-size:11px;color:#9FB6AC;}
.nav{display:flex;flex-direction:column;padding:8px 12px;gap:2px;flex:1;}
.nav-link{
  padding:11px 14px;border-radius:8px;font-size:13.5px;color:#C9D8D0;
  border-right:3px solid transparent;
}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-link.active{background:rgba(184,144,47,.16);color:#fff;border-right-color:var(--gold-600);}
.nav-icon{display:inline-block;width:18px;text-align:center;margin-left:4px;}
.sidebar-footer{padding:14px;}
/* الشريط الجانبي داكن ثابت دائمًا (بصرف النظر عن وضع التطبيق العام)، لكن أزرار
   أسفله كانت تستخدم لون النص المرتبط بوضع التطبيق (var(--text)) — في الوضع العادي
   يكون هذا اللون داكنًا، فيظهر نصًا داكنًا فوق خلفية داكنة (شبه غير مقروء). لون ثابت
   فاتح هنا يطابق لون نص الشريط الجانبي نفسه، بصرف النظر عن الوضع العام للتطبيق. */
.sidebar-footer .btn-ghost{color:#EAF1EC;border-color:rgba(234,241,236,.25);}
.sidebar-footer .btn-ghost:hover{background:rgba(255,255,255,.08);}

.topbar{
  grid-area:topbar;
  height:62px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.topbar-title{font-size:16px;font-weight:700;color:var(--green-800);}
.topbar-actions{display:flex;align-items:center;gap:12px;}
.year-select{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);}

.content{grid-area:content;padding:24px;max-width:1400px;width:100%;margin:0 auto;min-width:0;}

/* ---------- أزرار ---------- */
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;transition:.15s;}
.btn-primary{background:var(--green-800);color:#fff;}
.btn-primary:hover{background:var(--green-700);}
.btn-gold{background:var(--gold-600);color:#241A05;}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-small{padding:6px 12px;font-size:12.5px;}
.btn-block{width:100%;margin-top:18px;}

/* ---------- بطاقات المؤشرات — تصميم موحّد بارتفاع ثابت (Executive Dashboard) ----------
   كل بطاقة: صف علوي ثابت الارتفاع (أيقونة + عنوان، حتى سطرين)، صف القيمة (يملأ
   المساحة المتبقية ويتمركز رأسيًا)، صف تغيّر ثابت الارتفاع (محجوز دائمًا حتى لو
   كانت البطاقة بلا نسبة تغيّر) — بحيث لا يتغيّر ارتفاع أي بطاقة بصرف النظر عن طول
   العنوان أو وجود/غياب نسبة التغيّر، ولا تتحرك الشبكة عند تغيّر البيانات أو الفترة. */
.section-title{font-size:15px;font-weight:700;margin:28px 0 14px;color:var(--green-800);}
.section-title:first-child{margin-top:0;}

/* Flexbox بدل CSS Grid عمدًا: بعض المتصفحات القديمة (خصوصًا Edge غير المبني على
   Chromium) تملك دعمًا ناقصًا/معطوبًا لـ CSS Grid مع repeat()+1fr، ما يجعل البطاقات
   تتقلّص لحجم محتواها بدل ملء العرض المتاح. Flexbox مدعوم بثبات أكبر بكثير. */
.cards-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;width:100%;box-sizing:border-box;}
.cards-grid > .stat-card{flex:1 1 calc(25% - 12px);min-width:0;box-sizing:border-box;}
@media (max-width:900px){ .cards-grid > .stat-card{flex-basis:calc(50% - 8px);} }
@media (max-width:480px){ .cards-grid > .stat-card{flex-basis:100%;} }

.stat-card{
  display:flex;flex-direction:column;height:150px;padding:18px 20px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stat-card:after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg, transparent 55%, var(--card-accent-soft, transparent) 200%);
}
.stat-card .stat-top{display:flex;align-items:flex-start;gap:10px;height:38px;flex:none;}
.stat-card .stat-icon{
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex:none;background:var(--card-accent-soft, var(--green-100));color:var(--card-accent, var(--green-800));
}
.stat-card .label{
  font-size:12px;font-weight:600;color:var(--text-muted);line-height:1.35;padding-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.stat-card .value{
  flex:1;display:flex;align-items:center;
  font-family:var(--font-num);font-size:25px;font-weight:800;color:var(--green-800);
  line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.stat-card .change{
  height:18px;flex:none;font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.change.up{color:var(--success);}
.change.down{color:var(--danger);}
.change.flat{color:var(--text-muted);}
.change:before{font-size:10px;}
.change.up:before{content:'▲';}
.change.down:before{content:'▼';}
.change.flat:before{content:'—';}

.cards-grid .stat-card:nth-child(6n+1){--card-accent:#0E4B3D;--card-accent-soft:#0E4B3D1a;}
.cards-grid .stat-card:nth-child(6n+2){--card-accent:#B8902F;--card-accent-soft:#B8902F1a;}
.cards-grid .stat-card:nth-child(6n+3){--card-accent:#1E6FA8;--card-accent-soft:#1E6FA81a;}
.cards-grid .stat-card:nth-child(6n+4){--card-accent:#1E8A5F;--card-accent-soft:#1E8A5F1a;}
.cards-grid .stat-card:nth-child(6n+5){--card-accent:#146B7A;--card-accent-soft:#146B7A1a;}
.cards-grid .stat-card:nth-child(6n+6){--card-accent:#8A6D1E;--card-accent-soft:#8A6D1E1a;}

.kpi-item .kpi-icon{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:14px;margin-bottom:8px;background:var(--card-accent-soft, var(--gold-100));
  color:var(--card-accent, var(--gold-600));
}
.kpi-grid .kpi-item:nth-child(6n+1){--card-accent:#0E4B3D;--card-accent-soft:#0E4B3D1a;}
.kpi-grid .kpi-item:nth-child(6n+2){--card-accent:#B8902F;--card-accent-soft:#B8902F1a;}
.kpi-grid .kpi-item:nth-child(6n+3){--card-accent:#1E6FA8;--card-accent-soft:#1E6FA81a;}
.kpi-grid .kpi-item:nth-child(6n+4){--card-accent:#1E8A5F;--card-accent-soft:#1E8A5F1a;}
.kpi-grid .kpi-item:nth-child(6n+5){--card-accent:#146B7A;--card-accent-soft:#146B7A1a;}
.kpi-grid .kpi-item:nth-child(6n+6){--card-accent:#8A6D1E;--card-accent-soft:#8A6D1E1a;}

/* ---------- شريط "لمحة سريعة" — نفس لغة بطاقات المؤشرات الرئيسية تمامًا (الحواف
   ١٤px، نفس الظل)، لكن كشريط أفقي مضغوط بلا أيقونات. Mobile-first: عمود واحد
   بالجوال، عمودان باللوحي، أربعة بسطح المكتب — نفس أعمدة بطاقات المؤشرات تمامًا،
   حتى تبدو الصفحة كتلة واحدة متناسقة لا قسمين بمنطقين مختلفين. */
.quick-glance-bar{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:8px;width:100%;box-sizing:border-box;}
.quick-glance-bar > .quick-glance-item{flex:1 1 100%;box-sizing:border-box;}
@media (min-width:481px){ .quick-glance-bar > .quick-glance-item{flex-basis:calc(50% - 8px);} }
@media (min-width:901px){ .quick-glance-bar > .quick-glance-item{flex-basis:calc(25% - 12px);} }
.quick-glance-item{
  display:flex;flex-direction:column;justify-content:center;gap:6px;
  height:84px;padding:14px 18px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
}
.qg-label{
  font-size:11.5px;font-weight:600;color:var(--text-muted);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.qg-value{
  font-family:var(--font-num);font-size:17px;font-weight:800;color:var(--green-800);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.hero-badge{
  display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,var(--green-800),var(--green-950));
  color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:22px;
}
.hero-ring{
  width:88px;height:88px;border-radius:50%;flex:none;
  background: conic-gradient(var(--gold-600) calc(var(--pct,0)*1%), rgba(255,255,255,.15) 0);
  display:flex;align-items:center;justify-content:center;
}
.hero-ring-inner{
  width:66px;height:66px;border-radius:50%;background:var(--green-950);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-num);
  font-weight:700;font-size:16px;
}
.hero-text h2{margin:0 0 4px;font-size:16px;}
.hero-text p{margin:0;font-size:12.5px;color:#C9D8D0;}

.charts-grid{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px;width:100%;box-sizing:border-box;}
.chart-card{
  display:flex;flex-direction:column;height:230px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);border-top:3px solid var(--gold-600);
  flex:1 1 calc(50% - 8px);min-width:0;box-sizing:border-box;
}
.chart-card h3{margin:0 0 10px;font-size:13.5px;color:var(--text-muted);font-weight:600;flex:none;}
.chart-card canvas{flex:1;min-height:0;}
.chart-card.full{flex-basis:100%;}

.kpi-grid{display:flex;flex-wrap:wrap;gap:12px;width:100%;box-sizing:border-box;}
.kpi-grid > .kpi-item{flex:1 1 calc(25% - 9px);min-width:0;box-sizing:border-box;}
@media (min-width:481px) and (max-width:900px){ .kpi-grid > .kpi-item{flex-basis:calc(50% - 6px);} }
@media (max-width:480px){ .kpi-grid > .kpi-item{flex-basis:calc(50% - 6px);} }
.kpi-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;height:84px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);}
.kpi-item .kv{font-family:var(--font-num);font-size:19px;font-weight:700;color:var(--gold-600);}

/* ---------- قائمة "الأعلى" أفقية مرتبة ---------- */
.top-list-card{display:flex;flex-direction:column;gap:10px;height:auto !important;}
.top-list-row{display:flex;align-items:center;gap:10px;}
.top-list-rank{
  width:24px;height:24px;border-radius:50%;flex:none;background:var(--green-100);color:var(--green-800);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.top-list-row:nth-child(1) .top-list-rank{background:var(--gold-600);color:#fff;}
.top-list-info{flex:1;min-width:0;}
.top-list-name{font-size:12.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-list-bar-track{height:7px;background:var(--surface-2);border-radius:8px;overflow:hidden;}
.top-list-bar-fill{height:100%;background:linear-gradient(90deg,var(--green-800),var(--gold-600));border-radius:8px;}
.top-list-value{font-family:var(--font-num);font-size:13.5px;font-weight:700;color:var(--green-800);flex:none;min-width:44px;text-align:left;}
.kpi-item .kl{font-size:12px;color:var(--text-muted);margin-top:4px;}

/* ---------- نماذج الإدخال ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-muted);}
.tab-btn.active{background:var(--green-800);color:#fff;border-color:var(--green-800);}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13.5px;font-family:inherit;
}
.field textarea{resize:vertical;}
.indicator-check{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;}
.indicator-check input{margin-top:3px;flex:none;}
.indicator-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;width:100%;box-sizing:border-box;}
.indicator-grid > *{flex:1 1 calc(50% - 4px);min-width:0;box-sizing:border-box;}
.indicator-group-title{font-size:13px;font-weight:700;color:var(--green-800);margin:14px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--gold-600);}
.indicator-group-title:first-child{margin-top:0;}
.indicator-grid-3{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;width:100%;box-sizing:border-box;}
.indicator-grid-3 > *{flex:1 1 calc(33.333% - 6px);min-width:0;box-sizing:border-box;}
@media (max-width:480px){
  .indicator-grid > *{flex-basis:calc(50% - 4px);}
  .indicator-grid-3 > *{flex-basis:calc(50% - 4px);}
}
.rte-toolbar{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;}
.rte-toolbar button{padding:5px 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12.5px;color:var(--text);}
.rte-toolbar button:hover{background:var(--surface-2);}
.rte-box{
  min-height:70px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.7;
}
.rte-box:empty:before{content:attr(data-placeholder);color:var(--text-muted);}
.rte-box ul,.rte-box ol{padding-inline-start:22px;margin:6px 0;}

table{width:100%;border-collapse:collapse;font-size:13px;}
tfoot td{border-top:2px solid var(--green-800);background:var(--green-100);}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--border);}
th{color:var(--text-muted);font-weight:600;font-size:12.5px;background:var(--surface-2);}
tr:hover td{background:var(--surface-2);}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);}
.table-actions{display:flex;gap:6px;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--green-950);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
  box-shadow:var(--shadow);z-index:50;opacity:0;transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;bottom:30px;}
.toast.error{background:var(--danger);}

.badge{padding:2px 9px;border-radius:20px;font-size:11px;}
.badge.on{background:rgba(30,138,95,.12);color:var(--success);}
.badge.off{background:var(--surface-2);color:var(--text-muted);}

.report-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:20px;}
.report-output{margin-top:18px;}
.exec-summary{background:var(--green-100);border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:13.5px;line-height:1.9;}
.exec-summary strong{display:block;margin-bottom:4px;}
.compare-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.report-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--green-800);}
.report-header img{height:66px;width:66px;object-fit:contain;border-radius:8px;flex:none;}
.report-header-branch{font-size:15px;font-weight:700;color:var(--green-800);}
.report-header-org{font-size:12px;color:var(--text-muted);}
.report-header h2{margin:2px 0 0;color:var(--green-800);}

.mobile-menu-btn{
  display:none;flex:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:17px;align-items:center;justify-content:center;
}

@media (max-width: 880px){
  .app{display:block;}
  .mobile-menu-btn{display:flex;}
  .sidebar{
    position:static;width:100%;height:auto;display:none;
    max-height:70vh;overflow-y:auto;
  }
  .sidebar.mobile-open{display:flex;}
  .topbar{padding:0 12px;gap:10px;}
  .topbar-title{font-size:14px;}
  .content{padding:14px;}
  .charts-grid > .chart-card{flex-basis:100%;}
  .compare-cols{grid-template-columns:1fr;}
  .hero-badge{flex-direction:column;text-align:center;gap:12px;}
  .report-toolbar{flex-direction:column;align-items:stretch;}
  .report-toolbar .field{width:100%;}
  .chart-card{height:200px;}
}

/* هاتف صغير — عمود واحد للبطاقات الأساسية (كما هو محدَّد)، وبطاقتان لعناصر KPI
   الأصغر (لمحة سريعة)، مع حشوة وخط أصغر تناسبيًا. */
@media (max-width: 480px){
  .content{padding:10px;}
  .kpi-item{padding:9px;}
  .kpi-item .kv{font-size:15px;}
  .kpi-item .kl{font-size:10.5px;}
  .chart-card{padding:10px;height:180px;}
  .chart-card h3{font-size:12px;}
  .section-title{font-size:13.5px;margin:18px 0 10px;}
  .presentation-overlay{padding:10px;}
  .presentation-title{font-size:18px;}
}

#printBgImg{display:none;}
.cover-page{display:none;}
@media print{
  #printBgImg{
    display:block;position:fixed;top:0;left:0;width:100%;height:100%;
    object-fit:fill;z-index:-1;
  }
  .cover-page{display:block;position:relative;width:100%;}
  .cover-page.cover-front{break-after:page;page-break-after:always;}
  .cover-page.cover-back{break-before:page;page-break-before:always;}
  /* تبسيط جذري بعد أكثر من محاولة إصلاح جزئي: بدل محاولة إجبار الصورة والحاوية على
     ارتفاع محسوب (بالنسبة المئوية أولًا، ثم بالمليمتر المطابق للصفحة) — نعتمد الآن
     على القياس الطبيعي البسيط (height:auto حسب أبعاد الصورة نفسها)، تمامًا كما كان
     يعمل بشكل موثوق قبل إضافة النص الحي فوق الغلاف. الصورة الافتراضية المدمجة بأبعاد
     A4 تقريبًا أصلًا، فتملأ الصفحة طبيعيًا بلا أي حساب إضافي أو نسب مئوية قد تنكسر. */
  .cover-page img{width:100%;height:auto;display:block;object-fit:cover;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .cover-page.cover-generated{width:100%;}
  /* النص فوق الغلاف: تموضع بالمليمتر (قيمة مطلقة) بدل النسبة المئوية — لا يعتمد على
     ارتفاع أي عنصر أب محسوب إطلاقًا، فلا يمكن أن "ينهار" مهما كانت ظروف الأصل. */
  .cover-overlay-text{
    position:absolute;bottom:158mm;right:0;left:0;text-align:center;padding:0 12mm;z-index:1;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .cover-overlay-title{font-family:var(--font-ui);font-size:64px;font-weight:900;color:#0E4B3D;margin-bottom:8px;letter-spacing:0.3px;}
  .cover-overlay-period{font-family:var(--font-ui);font-size:15px;font-weight:700;color:#3a3a3a;}
  .sidebar,.topbar,.no-print,.btn{display:none !important;}
  .content{padding:0;max-width:none;}
  body{background:#fff;color:#000;}
  .card{box-shadow:none;border:none;}
  /* القالب (الترويسة الرسمية) عنصر <img> ثابت الموضع يمتد حتى حواف الصفحة الفعلية
     بصرف النظر عن هامش @page (الذي يبقى صغيرًا: 4مم، مضبوط من ReportsPage.printToPdf).
     النزول بالكتابة عن حواف القالب يتم بحشوة على #printArea نفسها: أفقيًا (11مم) تعمل
     بشكل موثوق دائمًا لأنها تتكرر تلقائيًا في كل صفحة مطبوعة. رأسيًا (10مم ≈ سطر إلى
     سطرين) تعتمد على box-decoration-break: clone، وهي خاصية مصمَّمة خصيصًا لتكرار حشوة
     عنصر عند انقسامه بين عدة صفحات. */
  #printArea,#infoPrintArea{
    box-sizing:border-box;padding:10mm 11mm;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative;z-index:1;
  }
  /* شبكات CSS Grid لها دعم ترقيم صفحات ضعيف/غير متسق عبر المتصفحات عند الطباعة —
     أحيانًا تُجبَر الشبكة كاملة على القفز لصفحة جديدة إن لم يتسع عنصر واحد بداخلها،
     تاركة فراغًا كبيرًا في نهاية الصفحة السابقة. نحوّلها لتدفّق عادي (block) أثناء
     الطباعة فقط، بحيث يتدفّق كل عنصر بحرية ويُطبع الفراغ المتبقي بدل تركه فارغًا. */
  #printArea .charts-grid,#printArea .cards-grid,#printArea .kpi-grid,
  #infoPrintArea .charts-grid,#infoPrintArea .cards-grid,#infoPrintArea .kpi-grid{
    display:block !important;
  }
  #printArea .chart-card,#printArea .stat-card,#printArea .kpi-item,
  #infoPrintArea .chart-card,#infoPrintArea .stat-card,#infoPrintArea .kpi-item{
    margin-bottom:10px;
  }
  /* منع انقسام كل عنصر "ذري" صغير (بطاقة، صف جدول، رأس تقرير) بين صفحتين. لا نطبّق
     هذا على الحاويات الكبيرة (الجدول كاملًا، شبكة البطاقات كاملة) لأن إجبار عنصر أطول
     من صفحة كاملة على البقاء متماسكًا يُنتج فراغات بيضاء كبيرة أو يُتجاهَل تمامًا؛
     الأصح ترك الحاوية تتدفّق بحرية بينما تبقى كل وحدة صغيرة بداخلها متماسكة. */
  #printArea tr,#printArea thead,#printArea .exec-summary,#printArea .kpi-item,
  #printArea .stat-card,#printArea .chart-card,#printArea .report-header,
  #printArea p,#printArea li,
  #infoPrintArea tr,#infoPrintArea thead,#infoPrintArea .kpi-item,
  #infoPrintArea .stat-card,#infoPrintArea .chart-card{
    break-inside:avoid;page-break-inside:avoid;
  }
  /* كانت هناك قاعدة break-after:avoid على h3 (لمنع بقاء عنوان وحيدًا أسفل صفحة) —
     أزلناها لأنها بدت تتفاعل مع قواعد "منع الانقسام" على البطاقات فتدفع القسم كاملًا
     لصفحة جديدة حتى مع وجود مساحة كافية، منتجة صفحات إضافية وفراغات كبيرة غير
     ضرورية. المخاطرة المقبولة الآن: قد يبقى عنوان وحيدًا نادرًا في أسفل صفحة، وهذا
     أهون بكثير من تضخّم عدد الصفحات لتقرير شبه فارغ كما لوحظ فعليًا. */
  /* شفافية شاملة لكل عنصر داخل منطقة الطباعة (بدل تعداد كل صنف على حدة، وهي طريقة
     هشة أثبتت أنها تفوّت عناصر مثل .chart-card وصفوف الإجمالي) — يضمن ظهور القالب
     خلف كل المحتوى دون استثناء. */
  #printArea *,#infoPrintArea *{background:transparent !important;}
}

/* ===== العرض التقديمي (وضع ملء الشاشة) ===== */
.presentation-overlay{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;padding:20px;box-sizing:border-box;
}
.presentation-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex:none;
}
.presentation-title{font-size:26px;font-weight:700;color:var(--green-800);}
.presentation-body{
  flex:1;overflow-y:auto;padding:0 4px;
}
.presentation-body .section-title{font-size:16px;margin:12px 0 8px;}
.presentation-body .section-title:first-child{margin-top:0;}
/* بطاقات المؤشرات وشريط لمحة سريعة داخل العرض التقديمي تحديدًا أصغر من نظيرتها في
   الصفحة الرئيسية — الشريحة الواحدة تتنافس فيها عدة أقسام معًا (بطاقات + لمحة سريعة
   + رسوم) على مساحة رأسية محدودة، فالحجم الكامل (150px) يجعل "الصف الأول" يستحوذ على
   مساحة أكبر من اللازم بينما تُدفَع بقية الأقسام للأسفل أو خارج حدود الشاشة. */
.presentation-body .stat-card{height:108px;padding:12px 14px;}
.presentation-body .stat-card .stat-top{height:30px;}
.presentation-body .stat-card .stat-icon{width:26px;height:26px;font-size:12px;}
.presentation-body .stat-card .label{font-size:11px;}
.presentation-body .stat-card .value{font-size:20px;}
.presentation-body .quick-glance-item{height:64px;padding:10px 14px;}
.presentation-body .qg-label{font-size:10.5px;}
.presentation-body .qg-value{font-size:15px;}
.presentation-body .chart-card{padding:12px;height:190px;}
.presentation-body .chart-card h3{font-size:13.5px;}
.presentation-body .chart-card{border-top:3px solid var(--gold-600);}
/* شريحة "الرسوم البيانية" وحدها (بعد فصل قائمة الأعلى إلى شريحة المؤشرات) أصبحت أخفّ
   محتوى من غيرها — رسمان بيانيان فقط بلا شيء آخر — فارتفاع أكبر هنا تحديدًا يملأ
   المساحة الرأسية المتاحة بشكل أفضل، دون التأثير على شرائح أخرى أكثر اكتظاظًا. */
.presentation-body .charts-grid-tall .chart-card{height:340px;}

/* تكبير حقيقي للبطاقات على الشاشات الكبيرة (١٧ إنش فأكبر تقريبًا، أو أي عرض نافذة
   واسع) — الأحجام أعلاه ثابتة بالبكسل ولا تكبر تلقائيًا مع اتساع الشاشة، فتبدو
   صغيرة نسبيًا على شاشة كبيرة رغم أنها بنفس الحجم الفعلي. نستخدم عتبة عرض بدل
   الاعتماد على "حجم الشاشة بالإنش" (لا يمكن قياسها مباشرة عبر CSS، فقط عرض
   النافذة الفعلي بالبكسل هو ما يمكن قياسه بدقة وموثوقية). */
@media (min-width:1400px){
  .presentation-body .stat-card{height:150px;padding:18px 20px;}
  .presentation-body .stat-card .stat-top{height:38px;}
  .presentation-body .stat-card .stat-icon{width:32px;height:32px;font-size:15px;}
  .presentation-body .stat-card .label{font-size:13.5px;}
  .presentation-body .stat-card .value{font-size:27px;}
  .presentation-body .quick-glance-item{height:84px;padding:14px 18px;}
  .presentation-body .qg-label{font-size:12.5px;}
  .presentation-body .qg-value{font-size:19px;}
  .presentation-body .chart-card{padding:16px;height:260px;}
  .presentation-body .chart-card h3{font-size:15px;}
  .presentation-body .charts-grid-tall .chart-card{height:420px;}
  .presentation-title{font-size:30px;}
  .presentation-overlay{padding:28px;}
}

@keyframes presSlideIn{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}
.presentation-body.slide-in, #dashCategoryBody.slide-in{animation:presSlideIn .45s ease;}



.presentation-footer{

.pres-dot{

@media (max-width:640px){

  .presentation-footer{gap:8px;}
}

<script>


/* ===== utils.js ===== */
/**
 * ===== دوال مساعدة عامة =====
 */
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/** تكبير الأرقام تدريجيًا من صفر إلى قيمتها الفعلية داخل أي حاوية — يمنح إحساسًا حيًّا
 *  بلا أي حاجة للمس أو تدخّل يدوي. يتجاهل أي نص غير رقمي بالكامل (مثل اسم جهة إحالة
 *  أو اسم شهر) لأنه لا معنى لعدّه تصاعديًا. مشتركة بين الصفحة الرئيسية والعرض التقديمي. */
function animateCountUp(containerSelector) {
  const targets = document.querySelectorAll(`${containerSelector} .stat-card .value, ${containerSelector} .kpi-item .kv`);
  targets.forEach(el => {
    const raw = el.textContent.trim();
    const match = raw.match(/^(-?[\d,]+(?:\.\d+)?)(%?)$/);
    if (!match) return; // نص غير رقمي بالكامل — يُعرض كما هو دون أي حركة
    const finalValue = parseFloat(match[1].replace(/,/g, ''));
    const suffix = match[2];
    const isDecimal = match[1].includes('.');
    if (isNaN(finalValue)) return;
    const duration = 700, start = performance.now();
    const step = (now) => {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3); // ease-out تدريجي، أكثر حيوية من الخطي
      const current = finalValue * eased;
      el.textContent = (isDecimal ? current.toFixed(1) : Math.round(current).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',')) + suffix;
      if (progress < 1) requestAnimationFrame(step);
      else el.textContent = raw; // ضمان القيمة النهائية مطابقة تمامًا للنص الأصلي المُنسَّق
    };
    requestAnimationFrame(step);
  });
}

const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

/** تحويل تاريخ ميلادي إلى هجري بخوارزمية الجدول الهجري التقريبية المعيارية (نفس
 *  الأساس المستخدم في أغلب المكتبات مفتوحة المصدر) — تقريب فلكي وليس تقويم أم القرى
 *  الرسمي (الذي يخضع لتعديل إداري وليس حسابًا فلكيًا بحتًا)، فقد يختلف يومًا أو
 *  يومين أحيانًا، خصوصًا قرب حدود الشهر. */
function gregorianToHijri(gy, gm, gd) {
  const jd = Math.floor((1461 * (gy + 4800 + Math.floor((gm - 14) / 12))) / 4) +
             Math.floor((367 * (gm - 2 - 12 * Math.floor((gm - 14) / 12))) / 12) -
             Math.floor((3 * Math.floor((gy + 4900 + Math.floor((gm - 14) / 12)) / 100)) / 4) +
             gd - 32075;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) + Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  const hm = Math.floor((24 * l) / 709);
  const hd = l - Math.floor((709 * hm) / 24);
  const hy = 30 * n + j - 30;
  return { year: hy, month: hm, day: hd };
}

/** تسمية هجرية تقريبية (الشهر والسنة) لشهر/سنة ميلاديين، باستخدام اليوم ١٥ كيوم
 *  مُمثِّل لمنتصف الشهر — نظامنا يتتبع دقة شهرية فقط لا يومية، والشهر الميلادي الواحد
 *  قد يتداخل مع شهرين هجريين، فهذا تقريب معقول للعرض وليس تطابقًا حصريًا. */
function hijriLabel(gy, gm) {
  const h = gregorianToHijri(gy, gm, 15);
  return `${HIJRI_MONTHS[h.month - 1]} ${h.year}هـ`;
}

function toast(msg, isError = false) {
  let el = document.getElementById('toastEl');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function fmtNum(n) { return new Intl.NumberFormat('ar-EG-u-nu-latn').format(n || 0); }
function fmtPct(n) { const v = n || 0; return (v > 0 ? '+' : '') + v + '%'; }
function fmtDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ar-EG-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' });
}

/** يبني قائمة سنوات بين حدين (شاملة)، تُستخدم في كل قوائم اختيار السنة بالنظام */
function yearRange(from, to) {
  const arr = [];
  for (let y = from; y <= to; y++) arr.push(y);
  return arr;
}

  tableButton: { cmd: 'insert-table', label: 'جدول', title: 'إدراج جدول' },
  lineSpacingPresets: ['1.5', '1.9', '2.3'],

  /** opts.table: true لإضافة زر "إدراج جدول" — يُستخدم فقط لحقول تحتاجه فعليًا
   *  (مثل حقل "المحتوى" في دليل الإجراءات)، وليس كل حقول النظام. */
  toolbarHtml(targetId, opts = {}) {
    const btns = opts.table ? [...this.buttons, this.tableButton] : this.buttons;
    return `<div class="rte-toolbar" data-target="${targetId}">
      ${btns.map(b => `<button type="button" data-cmd="${b.cmd}" title="${b.title}">${b.label}</button>`).join('')}
      <button type="button" data-dir-toggle title="تبديل اتجاه الفقرة (عربي/إنجليزي)">اتجاه</button>
    </div>`;
  },
  /** يربط شريط الأدوات بمربع النص، ويستدعي onChange(html) عند أي تعديل. */
  wire(targetId, onChange) {
    const box = document.getElementById(targetId);
    const toolbar = document.querySelector(`.rte-toolbar[data-target="${targetId}"]`);
    toolbar.querySelectorAll('button[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => {
        box.focus();
        const cmd = btn.dataset.cmd;
        if (cmd === 'line-spacing') {
          // المشكلة الأصلية: كان التباعد يُطبَّق على صندوق التحرير نفسه (style.lineHeight)
          // لا على المحتوى المحفوظ فعليًا — فيظهر أثناء الكتابة في الإعدادات فقط، ويختفي
          // تمامًا عند عرض نفس النص في أي صفحة أخرى لأن onChange كان يحفظ box.innerHTML
          // فقط (محتوى الصندوق)، وليس خاصية style الخاصة بالصندوق ذاته. الحل: نُغلِّف
          // المحتوى بعنصر يحمل التباعد كخاصية inline حقيقية، فيُحفَظ كجزء من النص نفسه
          // ويظهر أينما عُرض هذا النص لاحقًا، لا فقط أثناء التحرير.
          let wrapper = box.querySelector(':scope > [data-line-spacing]');
          if (!wrapper) {
            wrapper = document.createElement('div');
            wrapper.setAttribute('data-line-spacing', '');
            while (box.firstChild) wrapper.appendChild(box.firstChild);
            box.appendChild(wrapper);
          }
          const current = wrapper.style.lineHeight || this.lineSpacingPresets[0];
          const idx = this.lineSpacingPresets.indexOf(current);
          wrapper.style.lineHeight = this.lineSpacingPresets[(idx + 1) % this.lineSpacingPresets.length];
          onChange(box.innerHTML);
          return;
        }
        if (cmd === 'insert-table') {
          const rows = Math.max(1, parseInt(prompt('عدد الصفوف؟', '3'), 10) || 3);
          const cols = Math.max(1, parseInt(prompt('عدد الأعمدة؟', '3'), 10) || 3);
          let html = '<table style="width:100%;border-collapse:collapse;margin:8px 0" border="1"><tbody>';
          for (let r = 0; r < rows; r++) {
            html += '<tr>';
            for (let c = 0; c < cols; c++) html += '<td style="padding:6px;border:1px solid #ccc">&nbsp;</td>';
            html += '</tr>';
          }
          html += '</tbody></table><p><br></p>';
          document.execCommand('insertHTML', false, html);
          onChange(box.innerHTML);
          return;
        }
        document.execCommand(cmd, false, null);
        onChange(box.innerHTML);
      });
    });
    const dirBtn = toolbar.querySelector('[data-dir-toggle]');
    dirBtn.addEventListener('mousedown', (e) => e.preventDefault());
    dirBtn.addEventListener('click', () => { box.dir = box.dir === 'ltr' ? 'rtl' : 'ltr'; box.focus(); });
    box.addEventListener('input', () => onChange(box.innerHTML));
  }
};

/**
 * ===== طبقة التخزين الخام (Storage Engine) =====
 * الطبقة الوحيدة في كامل النظام التي تتعامل مباشرة مع localStorage.
 * لا تعرف شيئًا عن معنى البيانات — فقط تقرأ وتكتب وتمسح كائن JSON واحد.
 *
 * يدعم تعدد "المكاتب" (Workspaces): كل مكتب له مفتاح localStorage مستقل تمامًا،
 * بحيث تكون بياناته (إدارات، طلبات، إعدادات، كل شيء) منفصلة 100% عن أي مكتب آخر.
 * DataLayer لا يعرف شيئًا عن هذا التعدد — فقط يقرأ/يكتب عبر هذا الملف، وهذا الملف
 * يوجّه القراءة/الكتابة تلقائيًا إلى مفتاح المكتب الحالي المُختار.
 */
const StorageEngine = {
  PREFIX: 'officeStatsData_v2',
  LEGACY_KEY: 'officeStatsData_v2', // المفتاح القديم قبل دعم تعدد المكاتب (نسخة مستخدم واحد)
  currentWorkspace: null,

  setWorkspace(key) {
    this.currentWorkspace = key;
  },
  keyFor(workspaceKey) {
    return `${this.PREFIX}__${workspaceKey}`;
  },
  _key() {
    if (!this.currentWorkspace) throw new Error('لم يتم اختيار مكتب بعد');
    return this.keyFor(this.currentWorkspace);
  },

  read() {
    const raw = localStorage.getItem(this._key());
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (e) {
      console.error('تعذرت قراءة البيانات المحفوظة:', e);
      return null;
    }
  },

  write(obj) {
    localStorage.setItem(this._key(), JSON.stringify(obj));
  },

  clear() {
    localStorage.removeItem(this._key());
  },

  // تقدير حجم البيانات المخزّنة (تقريبي، بالكيلوبايت) لعرضه في صفحة سلامة البيانات
  estimateSizeKB() {
    const raw = localStorage.getItem(this._key()) || '';
    return Math.round((raw.length * 2) / 1024 * 10) / 10; // UTF-16 تقريبًا
  },

  /** هل يوجد بيانات محفوظة مسبقًا لمكتب معيّن؟ (تُستخدم لمعرفة إن كان المكتب جديدًا) */
  hasData(workspaceKey) {
    return !!localStorage.getItem(this.keyFor(workspaceKey));
  },

  /** ترحيل تلقائي لمرة واحدة: لو كانت هناك بيانات من الإصدار السابق (قبل ميزة تعدد
   *  المكاتب) ولم يُنشأ "المكتب الأول" بعد، نقلها إليه بلا فقدان لأي شيء. */
  migrateLegacyIfNeeded() {
    const legacyRaw = localStorage.getItem(this.LEGACY_KEY);
    const office1Key = this.keyFor('office1');
    if (legacyRaw && !localStorage.getItem(office1Key)) {
      localStorage.setItem(office1Key, legacyRaw);
    }
  },

  // ---------- إعدادات مشتركة على مستوى الجهة الرئيسية (وليست خاصة بمكتب واحد) ----------
  // اسم الجهة وشعارها مشتركان بين كل المكاتب (الفروع)، لذلك يُخزَّنان في مفتاح واحد
  // مستقل تمامًا عن مفاتيح المكاتب، ولا يمر عبر DataLayer إطلاقًا.
  GLOBAL_KEY: 'officeStatsGlobalSettings_v1',

  readGlobal() {
    const raw = localStorage.getItem(this.GLOBAL_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (e) { return null; }
  },

  writeGlobal(obj) {
    localStorage.setItem(this.GLOBAL_KEY, JSON.stringify(obj));
  },

  /** يُنشئ الإعدادات المشتركة لأول مرة فقط، ويحاول استعارة الاسم/الشعار الحاليين
   *  من "المكتب الأول" إن كانا موجودين مسبقًا (من نسخة سابقة للنظام)، حتى لا يُطلب
   *  من المستخدم إعادة إدخالهما من الصفر. */
  ensureGlobalSettings() {
    const existing = this.readGlobal();
    if (existing) {
      // تركيبات قديمة (قبل إضافة الغلاف/الشعار/خلفية البطاقات المدمجة) قد لا تملك
      // هذه الحقول إطلاقًا — نُضيفها لها مرة واحدة دون المساس بأي إعداد موجود فعلًا.
      const patch = {};
      if (!existing.coverBackground) patch.coverBackground = DEFAULT_COVER_BACKGROUND;
      if (!existing.organizationLogo) patch.organizationLogo = DEFAULT_ORGANIZATION_LOGO;
      if (!existing.landingCardBackground) patch.landingCardBackground = DEFAULT_LANDING_CARD_BACKGROUND;
      if (Object.keys(patch).length) this.writeGlobal({ ...existing, ...patch });
      return;
    }
    let organizationName = 'مكتب التواصل والعلاقات العامة';
    let organizationLogo = DEFAULT_ORGANIZATION_LOGO;
    const office1Raw = localStorage.getItem(this.keyFor('office1'));
    if (office1Raw) {
      try {
        const parsed = JSON.parse(office1Raw);
        if (parsed.settings && parsed.settings.officeName) organizationName = parsed.settings.officeName;
        if (parsed.settings && parsed.settings.logoDataUrl) organizationLogo = parsed.settings.logoDataUrl;
      } catch (e) { /* تجاهل، استخدم القيم الافتراضية */ }
    }
    // خلفية غلاف، وشعار جهة، وخلفية بطاقات مدمجة افتراضيًا في النظام نفسه — لا حاجة
    // لرفعها يدويًا؛ يمكن استبدالها من الإعدادات ← عام في أي وقت إن رغب المستخدم بتصميم آخر.
    this.writeGlobal({ organizationName, organizationLogo, coverBackground: DEFAULT_COVER_BACKGROUND, landingCardBackground: DEFAULT_LANDING_CARD_BACKGROUND });
  }
};


/* ===== dataLayer.js ===== */
/**
 * ===== طبقة البيانات (Data Layer) =====
 * الطبقة الوحيدة التي تعرف "معنى" البيانات (إدارات، سجلات شهرية، إعدادات...).
 * كل الصفحات (Dashboard، Entry، Reports...) تتعامل مع البيانات عبر هذه الطبقة فقط،
 * ولا تلمس StorageEngine أو localStorage مباشرة أبدًا.
 *
 * مسؤوليات هذه الطبقة:
 *  - الاحتفاظ بالحالة الكاملة في الذاكرة ومزامنتها مع StorageEngine بعد كل تعديل.
 *  - توفير CRUD موحّد لكل الجداول الشهرية عبر إعداد وصفي واحد (tableConfig) — DRY.
 *  - تسجيل كل عملية تغيير في سجل النشاط (Activity Log) تلقائيًا.
 *  - توفير التصدير/الاستيراد للنسخة الاحتياطية والتحقق من صحتها.
 */
const DataLayer = (() => {

  // ---------- إعداد وصفي للمحاور الأساسية الثابتة بنيويًا (لا يمكن حذفها، فقط إعادة تسميتها) ----------
  // "الطلبات" مرتبطة بالإدارات ونسبة الإنجاز وأبرز مؤشرات لوحة التحكم والتقارير، لذلك تبقى
  // هي والمحاور الخمسة الأخرى ثابتة بنيويًا. يمكن للمستخدم تغيير مسمياتها من الإعدادات
  // (categoryOverrides)، أو إضافة محاور جديدة كليًا (customCategories) تُدار ديناميكيًا.
  const CORE_TABLE_CONFIG = {
    requests: {
      title: 'اللقاءات اليومية', hasDept: false, structured: true, keyFields: ['month', 'year', 'requestType'],
      valueFields: [], icon: '📥',
      labels: {
        requestType: 'نوع الطلب', totalCount: 'العدد الإجمالي',
        followUpMechanism: 'آلية المتابعة', completedCount: 'الطلبات المكتملة',
        referralCount: 'عدد الطلبات المحالة', referralDestination: 'جهة الإحالة',
        inProgressCount: 'تحت الإجراء', inProgressAction: 'الإجراء الحالي للطلبات'
      }
    },
    activities: {
      title: 'الأنشطة والزيارات', hasDept: false, keyFields: ['month', 'year'],
      valueFields: ['visits_count', 'visitors_count', 'official_meetings_count', 'celebrations_count'], icon: '🚶',
      labels: {
        visits_count: 'عدد الزيارات', visitors_count: 'عدد الزوار',
        official_meetings_count: 'عدد اللقاءات الرسمية المنعقدة',
        celebrations_count: 'عدد رعاية الاتفاقيات والاحتفالات'
      }
    },
    communication: {
      title: 'التواصل', hasDept: false, keyFields: ['month', 'year'],
      valueFields: ['occasion_type', 'method'], icon: '🤝',
      labels: { occasion_type: 'نوع المناسبة', method: 'الطريقة' },
      fieldTypes: { occasion_type: 'text', method: 'text' }
    },
    weekly_sessions: {
      title: 'الجلسات الأسبوعية', hasDept: false, keyFields: ['month', 'year'],
      valueFields: ['session_topic', 'sessions_count', 'attendees_count'], icon: '🍽️',
      labels: { session_topic: 'موضوع الجلسة', sessions_count: 'عدد المآدب المقامة', attendees_count: 'إجمالي عدد الحضور' },
      // نوع "text" تجميعي بدل "label" مفرد — الموضوع يُكتب مرة كل أسبوع (قد تكون عدة
      // مواضيع مختلفة ضمن الشهر الواحد)، فيحتاج نفس آلية التجميع التكراري المستخدمة
      // في محور التواصل (إضافة سريعة لكل أسبوع على حدة)، لا حقلًا واحدًا يُستبدل في كل مرة.
      fieldTypes: { session_topic: 'text' }
    }
  };
  const CORE_TABLES = Object.keys(CORE_TABLE_CONFIG);
  const SCHEMA_VERSION = 3;
  const MAX_LOG_ENTRIES = 500;
  const DEFAULT_CUSTOM_ICON = '⭐';

  function defaultState() {
    const now = new Date().toISOString();
    const year = new Date().getFullYear();
    const state = {
      schemaVersion: SCHEMA_VERSION,
      settings: {
        branchName: '', // تسمية هذا الفرع/المكتب تحديدًا (اسم الجهة الرئيسية أصبح مشتركًا وليس هنا)
        foundingYear: year,
        reportYearFrom: year - 1,
        reportYearTo: year + 1,
        lastBackupAt: null
        // ملاحظة: محتوى "عن المكتب" و"دليل الإجراءات" أصبح مشتركًا بين المكتبين (مخزَّن
        // في الإعدادات العامة عبر StorageEngine.readGlobal/writeGlobal مباشرة)، وليس هنا.
      },
      departments: [],
      customCategories: [], // محاور مخصّصة يضيفها المستخدم بالكامل من الإعدادات
      categoryOverrides: {}, // تخصيص أسماء المحاور الأساسية الستة وحقولها
      activityLog: [],
      seq: { departments: 0, activityLog: 0, customCategorySeq: 0 },
      meta: { createdAt: now, lastModifiedAt: now }
    };
    CORE_TABLES.forEach(t => { state[t] = []; state.seq[t] = 0; });
    return state;
  }

  function seedDefaults(state) {
    ['إدارة التواصل الحكومي', 'إدارة العلاقات العامة', 'إدارة الإعلام', 'إدارة المناسبات'].forEach(name => {
      state.seq.departments += 1;
      state.departments.push({ id: state.seq.departments, name, active: 1 });
    });
    return state;
  }

  let state = null;

  function persist() {
    const prevRaw = localStorage.getItem(StorageEngine._key());
    let prevState = null;
    try { prevState = prevRaw ? JSON.parse(prevRaw) : null; } catch (e) {}

    state.meta.lastModifiedAt = new Date().toISOString();
    StorageEngine.write(state);
    const badge = document.getElementById('lastSavedBadge');
    if (badge) badge.textContent = 'آخر حفظ: ' + new Date().toLocaleTimeString('ar-EG-u-nu-latn');

    // نقطة ربط مركزية واحدة: أي تغيير على بيانات هذا المكتب (حفظ يدوي، استيراد،
    // تصفير...) يمر من هنا، فيُقارَن بالحالة السابقة ويُرفع الفرق فقط للسحابة تلقائيًا
    if (typeof syncReconcileAndPush === 'function' && !window.__applyingRemoteSnapshot) {
      syncReconcileAndPush(prevState, state);
    }
  }

  function nextId(key) {
    state.seq[key] = (state.seq[key] || 0) + 1;
    return state.seq[key];
  }

  function log(action, entity, description) {
    state.activityLog.push({
      id: nextId('activityLog'),
      ts: new Date().toISOString(),
      action, entity, description
    });
    if (state.activityLog.length > MAX_LOG_ENTRIES) {
      state.activityLog = state.activityLog.slice(-MAX_LOG_ENTRIES);
    }
  }

  return {
    CORE_TABLES, SCHEMA_VERSION,
    // جسر وصول للمزامنة السحابية فقط — state متغيّر خاص داخل نطاق DataLayer، وكود
    // المزامنة يعمل خارج هذا النطاق تمامًا (دالات عامة في نهاية الملف)، فيحتاج نقطة
    // وصول صريحة بدل الوصول المباشر لمتغيّر غير معرَّف في نطاقه (وهو بالضبط الخطأ
    // "state is not defined" الذي ظهر فعليًا عند وصول المزامنة لهذه النقطة لأول مرة).
    _syncGetState() { return state; },

    // ---------- إعداد الجداول الديناميكي (أساسية معاد تسميتها + مخصّصة) ----------
    // كل الصفحات (Entry، سلامة البيانات...) تستدعي هذا بدلاً من قائمة ثابتة، بحيث تنعكس
    // إعادة التسمية والإضافة والحذف فورًا في كل مكان دون أي تعديل عليها.
    getTableConfig() {
      const merged = {};
      Object.entries(CORE_TABLE_CONFIG).forEach(([key, cfg]) => {
        const override = state.categoryOverrides[key] || {};
        merged[key] = {
          ...cfg,
          title: override.title || cfg.title,
          icon: override.icon || cfg.icon,
          labels: { ...cfg.labels, ...(override.labels || {}) },
          hidden: !!override.hidden,
          fieldTypes: cfg.fieldTypes || {},
          isCore: true
        };
      });
      state.customCategories.forEach(c => {
        merged[c.key] = {
          title: c.title, hasDept: false, keyFields: ['month', 'year'],
          valueFields: c.valueFields.map(f => f.key),
          icon: c.icon || DEFAULT_CUSTOM_ICON,
          labels: Object.fromEntries(c.valueFields.map(f => [f.key, f.label])),
          fieldTypes: Object.fromEntries(c.valueFields.map(f => [f.key, f.type || 'number'])),
          hidden: !!c.hidden,
          isCore: false
        };
      });
      return merged;
    },
    getRecordTables() { return Object.keys(this.getTableConfig()); },
    listCustomCategories() { return state.customCategories.map(c => ({ ...c, valueFields: c.valueFields.map(f => ({ ...f })) })); },

    /** تغيير اسم محور أساسي و/أو تسميات حقوله (لا يمس البيانات المخزّنة إطلاقًا) */
    renameCoreCategory(tableKey, { title, fieldLabels, icon }) {
      if (!CORE_TABLE_CONFIG[tableKey]) throw new Error('محور أساسي غير معروف');
      const existing = state.categoryOverrides[tableKey] || {};
      // تصفية أي تسمية حقل فارغة قبل الدمج (بنفس حماية العنوان والأيقونة أعلاه) — حقل
      // تسمية فارغ يُهمَل ويبقى على قيمته السابقة، بدل أن يُحفَظ فارغًا فيختفي نصه
      // بالكامل من كل مكان يُعرض فيه (كجدول اختيار مؤشرات التقرير).
      const cleanedLabels = {};
      Object.entries(fieldLabels || {}).forEach(([k, v]) => { if (v && v.trim()) cleanedLabels[k] = v; });
      state.categoryOverrides[tableKey] = {
        title: title !== undefined && title !== '' ? title : existing.title,
        icon: icon !== undefined && icon !== '' ? icon : existing.icon,
        labels: { ...existing.labels, ...cleanedLabels },
        hidden: existing.hidden
      };
      log('update', 'category', `إعادة تسمية محور: ${this.getTableConfig()[tableKey].title}`);
      persist();
    },

    /** إظهار/إخفاء محور في شاشة إدخال البيانات، دون حذفه أو التأثير على بياناته —
     *  تعمل للمحاور الأساسية والمخصّصة معًا. الإظهار/الإخفاء خاص بهذا المكتب فقط. */
    setCategoryVisibility(key, hidden) {
      if (CORE_TABLE_CONFIG[key]) {
        const existing = state.categoryOverrides[key] || {};
        state.categoryOverrides[key] = { ...existing, hidden };
      } else {
        const cat = state.customCategories.find(c => c.key === key);
        if (!cat) throw new Error('محور غير معروف');
        cat.hidden = hidden;
      }
      log('update', 'category', `${hidden ? 'إخفاء' : 'إظهار'} محور: ${this.getTableConfig()[key].title}`);
      persist();
    },

    /** إضافة محور مخصّص جديد بالكامل — يظهر تلقائيًا كتبويب في إدخال البيانات، وكبطاقات
     *  عامة في لوحة التحكم والتقارير، دون أي حاجة لتعديل كود أي صفحة. */
    /** fields: مصفوفة من نصوص (توافقًا مع الاستخدام القديم، تُصبح كلها من نوع "رقم")
     *  أو من كائنات {label, type} حيث type هو 'number' (افتراضي) أو 'text'. الحقول
     *  النصية تُخزَّن كتجميع تكراري (قيمة نصية + عدد مرات تكرارها) بدل رقم واحد، مما
     *  يسمح بتتبع أشياء مثل "المناسبة: تعزية ×3، عزاء ×1" ضمن نفس الشهر. */
    addCustomCategory(title, fields) {
      if (!title || !title.trim()) throw new Error('اسم المحور مطلوب');
      const normalized = fields.map(f => typeof f === 'string' ? { label: f, type: 'number' } : f)
        .filter(f => f && f.label && f.label.trim());
      if (!normalized.length) throw new Error('أضف اسم حقل واحد على الأقل');
      const key = 'custom_' + nextId('customCategorySeq');
      const valueFields = normalized.map((f, i) => ({ key: 'v' + (i + 1), label: f.label.trim(), type: f.type === 'text' ? 'text' : 'number' }));
      state.customCategories.push({ key, title: title.trim(), valueFields });
      state[key] = [];
      state.seq[key] = 0;
      log('create', 'category', `إضافة محور جديد: ${title}`);
      persist();
      return key;
    },
    updateCustomCategory(key, { title, fieldLabels, icon }) {
      const cat = state.customCategories.find(c => c.key === key);
      if (!cat) throw new Error('المحور غير موجود');
      if (title && title.trim()) cat.title = title.trim();
      if (icon && icon.trim()) cat.icon = icon.trim();
      if (fieldLabels) {
        cat.valueFields.forEach(f => {
          if (fieldLabels[f.key] && fieldLabels[f.key].trim()) f.label = fieldLabels[f.key].trim();
        });
      }
      log('update', 'category', `تعديل محور: ${cat.title}`);
      persist();
    },
    deleteCustomCategory(key) {
      const cat = state.customCategories.find(c => c.key === key);
      if (!cat) throw new Error('المحور غير موجود');
      state.customCategories = state.customCategories.filter(c => c.key !== key);
      delete state[key];
      delete state.seq[key];
      log('delete', 'category', `حذف محور: ${cat.title} (وكل بياناته)`);
      persist();
    },

    // ---------- التهيئة ----------
    init() {
      const loaded = StorageEngine.read();
      if (loaded) {
        state = loaded;
        // ضمان وجود كل الحقول (لتوافق النسخ القديمة/الناقصة)
        const fresh = defaultState();
        state.settings = { ...fresh.settings, ...(state.settings || {}) };
        // توافق مع نسخ سابقة: كان محتوى "عن المكتب" و"دليل الإجراءات" مخزَّنًا لكل مكتب
        // على حدة — أصبح الآن مشتركًا بين المكتبين. ننقل أي محتوى سابق (من أي مكتب
        // وُجد فيه أولًا) إلى التخزين المشترك مرة واحدة فقط، حتى لا يُفقد محتوى حقيقي
        // أدخله المستخدم عند التحويل لتخزين مشترك.
        const g = StorageEngine.readGlobal() || {};
        if (!g._aboutProcMigrated) {
          const legacy = state.settings;
          const sharedUpdate = {};
          if (legacy.aboutIntro) sharedUpdate.aboutIntro = legacy.aboutIntro;
          if (legacy.procGuideFieldTitles) sharedUpdate.procGuideFieldTitles = legacy.procGuideFieldTitles;
          ['intro', 'vision', 'mission', 'goals', 'content', 'conclusion'].forEach(k => {
            if (legacy['procGuide_' + k]) sharedUpdate['procGuide_' + k] = legacy['procGuide_' + k];
          });
          // توافق أقدم: قبل فصل دليل الإجراءات، كانت الرؤية/الرسالة/الأهداف ضمن "عن المكتب" مباشرة
          if (legacy.aboutVision && !sharedUpdate.procGuide_vision) sharedUpdate.procGuide_vision = legacy.aboutVision;
          if (legacy.aboutMission && !sharedUpdate.procGuide_mission) sharedUpdate.procGuide_mission = legacy.aboutMission;
          if (legacy.aboutGoals && !sharedUpdate.procGuide_goals) sharedUpdate.procGuide_goals = legacy.aboutGoals;
          if (legacy.aboutProcedures && !sharedUpdate.procGuide_content) sharedUpdate.procGuide_content = legacy.aboutProcedures;
          StorageEngine.writeGlobal({ ...g, ...sharedUpdate, _aboutProcMigrated: true });
        }
        // توافق مع نسخ سابقة: كان اسم المكتب يُحفظ في officeName قبل فصل هوية الجهة المشتركة
        if (!state.settings.branchName && state.settings.officeName) {
          state.settings.branchName = state.settings.officeName;
        }
        state.seq = { ...fresh.seq, ...(state.seq || {}) };
        state.meta = { ...fresh.meta, ...(state.meta || {}) };
        // توافق مع نسخ سابقة: إعادة هيكلة المحاور الأساسية الأربعة (اللقاءات اليومية،
        // الأنشطة والزيارات، التواصل، الجلسات الأسبوعية) بناءً على التقرير الرسمي —
        // نقل بيانات "الزيارات" القديمة لمحور "الأنشطة والزيارات" الجديد، وترقية أي
        // محور مخصّص كان يمثّل "التواصل" (بحقلين نصيين) إلى محور أساسي ثابت، مرة واحدة
        // فقط لكل مكتب حتى لا يتكرر النقل أو يُفقد شيء.
        if (!state.meta._axesRestructured) {
          if (Array.isArray(state.visits) && state.visits.length) {
            state.activities = (state.activities || []).concat(state.visits.map(r => ({
              id: r.id, month: r.month, year: r.year,
              visits_count: r.visits_count || 0, visitors_count: r.visitors_count || 0,
              official_meetings_count: 0, celebrations_count: 0, updated_at: r.updated_at
            })));
          }
          const commCat = (state.customCategories || []).find(c =>
            c.title && (c.title.includes('التواصل') || c.title.includes('الوجهاء'))
          );
          if (commCat && commCat.valueFields.length >= 2) {
            const [occField, methField] = commCat.valueFields;
            const oldRows = state[commCat.key] || [];
            // محور "التواصل" أصبح بثلاثة حقول (تهنئة/تعزية/طريقة) بدل حقلين (مناسبة/طريقة)
            // — لا يمكن تقسيم بيانات "المناسبة" القديمة تلقائيًا وبثقة بين تهنئة وتعزية،
            // فتُنقَل مبدئيًا إلى "مناسبات التهنئة" (أهون من فقدانها بالكامل)، ويُترك
            // للمستخدم مراجعتها وإعادة تصنيف ما يلزم يدويًا عبر شاشة الإدخال.
            state.communication = (state.communication || []).concat(oldRows.map(r => ({
              id: r.id, month: r.month, year: r.year,
              celebration: r[occField.key] || [], condolence: [], method: r[methField.key] || [],
              updated_at: r.updated_at
            })));
            state.customCategories = state.customCategories.filter(c => c.key !== commCat.key);
            delete state[commCat.key];
            delete state.seq[commCat.key];
          }
          state.meta._axesRestructured = true;
        }
        // توافق مع نسخ سابقة أيضًا: محور "التواصل" كان يفصل بين "مناسبات التهنئة"
        // و"مناسبات التعزية" كحقلين مستقلَّين، فأصبح الآن حقلًا واحدًا موحَّدًا "نوع
        // المناسبة" يقبل أي اسم مناسبة نصيًا (تهنئة أو تعزية أو غيرهما). تُدمَج بيانات
        // الحقلين القديمين هنا في الحقل الجديد، مع جمع عدّادات أي اسم مناسبة متطابق
        // بينهما بدل تكراره كسطرين منفصلين.
        if (!state.meta._commOccasionMerged) {
          (state.communication || []).forEach(r => {
            const merged = {};
            [...(Array.isArray(r.celebration) ? r.celebration : []), ...(Array.isArray(r.condolence) ? r.condolence : [])].forEach(t => {
              if (merged[t.value]) merged[t.value].count += (t.count || 0);
              else merged[t.value] = { value: t.value, count: t.count || 0 };
            });
            r.occasion_type = Object.values(merged);
            delete r.celebration;
            delete r.condolence;
          });
          state.meta._commOccasionMerged = true;
        }
        if (!Array.isArray(state.customCategories)) state.customCategories = [];
        // بيانات مستوردة من ملف إكسل خاصة بتبويب "معلومات" — منفصلة تمامًا عن محاور
        // الإدخال العادية، لأنها تُستورَد كاملة من ملف خارجي بدل الإدخال اليدوي.
        // بيانات مستورَدة من ملف إكسل لمحور "اللقاءات اليومية" — سجل واحد لكل طلب على
        // حدة (لا إجمالي شهري)، يُشتَق منها تلقائيًا جدول "requests" التجميعي أدناه.
        if (!Array.isArray(state.importedDailyMeetings)) state.importedDailyMeetings = [];
        if (typeof state.categoryOverrides !== 'object' || !state.categoryOverrides) state.categoryOverrides = {};
        CORE_TABLES.forEach(t => { if (!Array.isArray(state[t])) state[t] = []; });
        state.customCategories.forEach(c => { if (!Array.isArray(state[c.key])) state[c.key] = []; });
        if (!Array.isArray(state.departments)) state.departments = [];
        if (!Array.isArray(state.activityLog)) state.activityLog = [];
      } else {
        state = seedDefaults(defaultState());
        persist();
        log('system', 'system', 'تهيئة النظام لأول مرة بالبيانات الافتراضية');
        persist();
      }
      return state;
    },

    // ---------- الإعدادات ----------
    getSettings() { return { ...state.settings }; },
    updateSettings(patch) {
      state.settings = { ...state.settings, ...patch };
      log('update', 'settings', 'تم تحديث إعدادات النظام');
      persist();
    },

    // ---------- بيانات "اللقاءات اليومية" المستورَدة من إكسل ----------
    getImportedDailyMeetings() {
      return state.importedDailyMeetings || [];
    },
    /** يستبدل كامل البيانات المستورَدة سابقًا بالبيانات الجديدة (استيراد جديد يحل محل
     *  القديم بالكامل، حسب الطلب الصريح)، ثم يُعيد اشتقاق جدول "requests" التجميعي
     *  (المُستخدَم في كل مكان آخر بالنظام: البطاقات، الرسوم، التقارير) تلقائيًا من
     *  هذه البيانات التفصيلية الجديدة — فلا حاجة لتعديل أي كود آخر في النظام. */
    setImportedDailyMeetings(rows) {
      state.importedDailyMeetings = rows;
      this._recomputeRequestsFromImport();
      log('update', 'importedDailyMeetings', `استيراد بيانات اللقاءات اليومية (${rows.length} صفًا)، استبدال الاستيراد السابق`);
      persist();
    },
    /** يشتق جدول "requests" التجميعي (شهر × سنة × تصنيف) من سجلات الاستيراد التفصيلية
     *  — كل سجل تفصيلي واحد فيه: تاريخ، متلقي الطلب، التصنيف الأساسي، حالة الطلب،
     *  الإدارة المعنية. يُطابَق هذا الاشتقاق بنية "requests" القديمة تمامًا (العدد
     *  الإجمالي، المنجزة، جهات الإحالة) بحيث يستمر كل ما بُني على هذه البنية (لوحة
     *  التحكم، التحليلات، التقارير) بالعمل دون أي تعديل إضافي. */
    _recomputeRequestsFromImport() {
      const groups = {};
      (state.importedDailyMeetings || []).forEach(r => {
        if (!r.date) return;
        const d = new Date(r.date);
        if (isNaN(d.getTime())) return;
        const month = d.getMonth() + 1, year = d.getFullYear();
        const category = r.category || 'غير مصنّف';
        const key = year + '|' + month + '|' + category;
        if (!groups[key]) {
          groups[key] = {
            id: nextId('requests'), month, year, requestType: category,
            totalCount: 0, completedCount: 0, referrals: {}, inProgressItems: [],
            followUpMechanism: 'office', followUpOther: ''
          };
        }
        const g = groups[key];
        g.totalCount++;
        if (r.status === 'مكتمل') g.completedCount++;
        const dept = r.department || 'غير محددة';
        g.referrals[dept] = (g.referrals[dept] || 0) + 1;
      });
      state.requests = Object.values(groups).map(g => ({
        ...g,
        referrals: Object.entries(g.referrals).map(([destination, count]) => ({ destination, count }))
      }));
    },
    // ---------- الإدارات ----------
    listDepartments(activeOnly = false) {
      return state.departments
        .filter(d => !activeOnly || d.active)
        .map(d => ({ ...d, type: d.type === 'external' ? 'external' : 'internal' })) // توافق مع بيانات محفوظة سابقًا بلا حقل نوع
        .sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    },
    addDepartment(name, type = 'internal') {
      if (state.departments.some(d => d.name === name)) throw new Error('الإدارة موجودة مسبقًا');
      const dept = { id: nextId('departments'), name, active: 1, type: type === 'external' ? 'external' : 'internal' };
      state.departments.push(dept);
      log('create', 'department', `إضافة ${type === 'external' ? 'جهة خارجية' : 'إدارة داخلية'}: ${name}`);
      persist();
      return dept;
    },
    updateDepartment(id, patch) {
      const d = state.departments.find(x => x.id === id);
      if (!d) throw new Error('الإدارة غير موجودة');
      Object.assign(d, patch);
      log('update', 'department', `تعديل إدارة: ${d.name}`);
      persist();
    },
    deleteDepartment(id) {
      const d = state.departments.find(x => x.id === id);
      const used = state.requests.some(r => r.department_id === id);
      if (used) throw new Error('لا يمكن حذف الإدارة لوجود بيانات مرتبطة بها. يمكنك إيقافها بدلاً من ذلك.');
      state.departments = state.departments.filter(x => x.id !== id);
      log('delete', 'department', `حذف إدارة: ${d ? d.name : id}`);
      persist();
    },

    // ---------- CRUD عام للجداول الشهرية (موحّد عبر getTableConfig) ----------
    listRecords(table, filters = {}) {
      if (!Array.isArray(state[table])) return [];
      return state[table]
        .filter(r => Object.entries(filters).every(([k, v]) => v === undefined || v === '' || r[k] === v))
        .sort((a, b) => b.year - a.year || b.month - a.month);
    },
    upsertRecord(table, record) {
      const cfg = this.getTableConfig()[table];
      if (!cfg) throw new Error('محور غير معروف: ' + table);
      const arr = state[table];
      const existing = arr.find(r => cfg.keyFields.every(k => r[k] === record[k]));
      const isNew = !existing;
      // نُحدِّث فقط الحقول الموجودة فعليًا في record المُمرَّر — وليس كل valueFields
      // دومًا — حتى لا يُمحى تجميع نصي (تالي) موجود مسبقًا لحقل نصي لم يُرسَل ضمن هذا
      // الحفظ (مثل استيراد CSV أو نموذج الإدخال اليدوي عند وجود حقول نصية في نفس المحور).
      if (existing) {
        cfg.valueFields.forEach(f => { if (f in record) existing[f] = record[f]; });
        existing.updated_at = new Date().toISOString();
      } else {
        const row = { id: nextId(table) };
        cfg.keyFields.forEach(f => { row[f] = record[f]; });
        cfg.valueFields.forEach(f => { row[f] = (f in record) ? record[f] : (cfg.fieldTypes && cfg.fieldTypes[f] === 'text' ? [] : 0); });
        row.updated_at = new Date().toISOString();
        arr.push(row);
      }
      const monthLabel = record.month && record.year ? `${record.month}/${record.year}` : '';
      log(isNew ? 'create' : 'update', table, `${isNew ? 'إضافة' : 'تعديل'} بيانات ${cfg.title} (${monthLabel})`);
      persist();
    },
    /** محور "الطلبات" بشكله الجديد له بنية غنية (مصفوفات إحالات وإجراءات متغيّرة
     *  العدد) لا تناسب النمط العام القائم على valueFields المسطّحة، لذلك له دوال
     *  حفظ/قراءة مخصّصة بدل استخدام upsertRecord/listRecords العامّة. سجل واحد فقط
     *  لكل (شهر/سنة) — لا ارتباط بإدارة، لأن "جهة الإحالة" أصبحت نصًا حرًا لكل صف
     *  إحالة على حدة بدل الارتباط بقائمة الإدارات الثابتة. */
    upsertStructuredRequest(record) {
      const arr = state.requests;
      const typeNorm = (record.requestType || '').trim();
      // المطابقة الآن بالشهر + السنة + نوع الطلب معًا (وليس الشهر والسنة فقط)، حتى
      // تتعايش عدة أنواع طلبات مختلفة ضمن الشهر نفسه دون أن يستبدل أحدها الآخر.
      const existing = arr.find(r => r.month === record.month && r.year === record.year && (r.requestType || '').trim() === typeNorm);
      const isNew = !existing;
      const row = existing || { id: nextId('requests') };
      row.month = record.month;
      row.year = record.year;
      row.requestType = typeNorm;
      row.totalCount = +record.totalCount || 0;
      row.referrals = Array.isArray(record.referrals)
        ? record.referrals.map(r => ({ count: +r.count || 0, destination: (r.destination || '').trim() })).filter(r => r.count > 0 || r.destination)
        : [];
      row.followUpMechanism = record.followUpMechanism === 'other' ? 'other' : 'office';
      row.followUpOther = record.followUpMechanism === 'other' ? (record.followUpOther || '') : '';
      row.inProgressItems = Array.isArray(record.inProgressItems)
        ? record.inProgressItems.map(r => ({ count: +r.count || 0, action: (r.action || '').trim() })).filter(r => r.count > 0 || r.action)
        : [];
      row.completedCount = +record.completedCount || 0;
      row.updated_at = new Date().toISOString();
      if (isNew) arr.push(row);
      const typeLabel = typeNorm ? ` — ${typeNorm}` : '';
      log(isNew ? 'create' : 'update', 'requests', `${isNew ? 'إضافة' : 'تعديل'} بيانات الطلبات (${record.month}/${record.year}${typeLabel})`);
      persist();
      return row;
    },
    getStructuredRequest(month, year, requestType = '') {
      const typeNorm = (requestType || '').trim();
      return state.requests.find(r => r.month === month && r.year === year && (r.requestType || '').trim() === typeNorm) || null;
    },
    /** "إضافة سريعة": يضيف الزيادات المُعطاة إلى القيم الحالية للسجل المطابق (شهر/سنة/
     *  إدارة إن وُجدت) بدل استبدالها بالكامل — مفيد لتحديث بيانات يوم واحد دون الحاجة
     *  لإعادة كتابة مجموع الشهر كله في كل مرة. يُعيد القيم النهائية بعد الإضافة. */
    incrementRecord(table, keys, increments) {
      const cfg = this.getTableConfig()[table];
      if (!cfg) throw new Error('محور غير معروف: ' + table);
      // مهم: نقتصر هنا على الحقول الرقمية الفعلية فقط (لا نوع 'text' التجميعي ولا
      // 'label' النصي البسيط) — المرور على valueFields بالكامل دون تصفية كان يُطبِّق
      // (existing[f] || 0) + (increments[f] || 0) حتى على حقول نصية/مصفوفات تجميع،
      // وجمع مصفوفة مع رقم في JS يُحوِّلها إلى نص عبر الإكراه الضمني وينتج قيمة
      // تالفة مثل "[object Object]0" بدل الحفاظ على التجميع الصحيح. هذا الخلل كان
      // كامنًا دون أن يظهر لأن كل محور سابقًا كان إما أرقامًا بالكامل أو نصوصًا
      // بالكامل، لا مزيجًا من الاثنين ضمن نفس المحور — إلى أن أُضيف حقل نصي لمحور
      // "الجلسات الأسبوعية" الذي يحوي حقولًا رقمية أيضًا.
      const numberFields = cfg.valueFields.filter(f => !cfg.fieldTypes || (cfg.fieldTypes[f] !== 'text' && cfg.fieldTypes[f] !== 'label'));
      const arr = state[table];
      const existing = arr.find(r => cfg.keyFields.every(k => r[k] === keys[k]));
      const isNew = !existing;
      let row;
      if (existing) {
        numberFields.forEach(f => { existing[f] = (existing[f] || 0) + (increments[f] || 0); });
        existing.updated_at = new Date().toISOString();
        row = existing;
      } else {
        row = { id: nextId(table) };
        cfg.keyFields.forEach(k => { row[k] = keys[k]; });
        numberFields.forEach(f => { row[f] = increments[f] || 0; });
        row.updated_at = new Date().toISOString();
        arr.push(row);
      }
      const monthLabel = keys.month && keys.year ? `${keys.month}/${keys.year}` : '';
      log(isNew ? 'create' : 'update', table, `إضافة سريعة ليوم على بيانات ${cfg.title} (${monthLabel})`);
      persist();
      const result = {};
      numberFields.forEach(f => { result[f] = row[f]; });
      return result;
    },
    /** يجمع مجموع التكرارات لحقل نصي (سواء كان مصفوفة تجميع، أو غير موجود بعد) —
     *  يُستخدم لحساب "الإجمالي" لأي حقل نصي بنفس طريقة الحقول الرقمية العادية. */
    sumTextTally(tallyArr) {
      return Array.isArray(tallyArr) ? tallyArr.reduce((s, t) => s + (t.count || 0), 0) : 0;
    },
    /** "إضافة سريعة" لحقل نصي بنظام العدّ — تضيف تكرارًا (أو أكثر) لقيمة نصية معيّنة
     *  ضمن حقل مُعرَّف بنوع "نصي" في محور مخصّص، بدل استبدال القيمة بالكامل. مثال:
     *  حقل "المناسبة" في محور "التواصل مع الوجهاء" — كل إضافة تزيد عدّاد القيمة
     *  المطابقة (مثل "تعزية") أو تنشئ قيمة جديدة إن لم تكن موجودة من قبل. */
    incrementTextTally(table, keys, fieldKey, value, count = 1) {
      const cfg = this.getTableConfig()[table];
      if (!cfg) throw new Error('محور غير معروف: ' + table);
      if (!cfg.valueFields.includes(fieldKey)) throw new Error('حقل غير معروف: ' + fieldKey);
      const valueNorm = (value || '').trim();
      if (!valueNorm) throw new Error('القيمة مطلوبة');
      const arr = state[table];
      let row = arr.find(r => cfg.keyFields.every(k => r[k] === keys[k]));
      const isNew = !row;
      if (!row) {
        row = { id: nextId(table) };
        cfg.keyFields.forEach(k => { row[k] = keys[k]; });
        cfg.valueFields.forEach(f => { row[f] = cfg.fieldTypes[f] === 'text' ? [] : 0; });
        arr.push(row);
      }
      if (!Array.isArray(row[fieldKey])) row[fieldKey] = [];
      const entry = row[fieldKey].find(t => t.value === valueNorm);
      if (entry) entry.count += count;
      else row[fieldKey].push({ value: valueNorm, count });
      row.updated_at = new Date().toISOString();
      const monthLabel = keys.month && keys.year ? `${keys.month}/${keys.year}` : '';
      log(isNew ? 'create' : 'update', table, `إضافة سريعة (${valueNorm}) على بيانات ${cfg.title} (${monthLabel})`);
      persist();
      return row[fieldKey];
    },
    deleteRecord(table, id) {
      const cfg = this.getTableConfig()[table];
      state[table] = state[table].filter(r => r.id !== id);
      log('delete', table, `حذف سجل من ${cfg ? cfg.title : table} (#${id})`);
      persist();
    },

    // ---------- سجل النشاط ----------
    getActivityLog(limit = 50) {
      return [...state.activityLog].reverse().slice(0, limit);
    },

    // ---------- سلامة البيانات ----------
    dataHealth() {
      const cfg = this.getTableConfig();
      const tables = this.getRecordTables();
      const counts = {};
      tables.forEach(t => { counts[t] = (state[t] || []).length; });
      const totalRecords = Object.values(counts).reduce((s, v) => s + v, 0);

      const allRows = tables.map(t => (state[t] || []).map(r => ({ table: t, ...r }))).reduce((a,b)=>a.concat(b),[]);
      const years = allRows.map(r => r.year).filter(Boolean);
      const earliestYear = years.length ? Math.min(...years) : null;
      const latestYear = years.length ? Math.max(...years) : null;

      const issues = [];
      const activeDeptIds = new Set(state.departments.map(d => d.id));

      tables.forEach(t => {
        const c = cfg[t];
        (state[t] || []).forEach(r => {
          c.valueFields.forEach(f => {
            if (typeof r[f] !== 'number' || r[f] < 0) {
              issues.push({ severity: 'error', message: `قيمة غير منطقية (${c.labels[f]}) في سجل ${c.title} بتاريخ ${r.month}/${r.year}` });
            }
          });
          if (t === 'requests') {
            if (r.completed + r.in_progress !== r.total) {
              issues.push({ severity: 'warning', message: `في سجل الطلبات بتاريخ ${r.month}/${r.year}: مجموع (المكتملة + تحت الإجراء) لا يساوي الإجمالي` });
            }
            if (!activeDeptIds.has(r.department_id)) {
              issues.push({ severity: 'warning', message: `سجل طلبات بتاريخ ${r.month}/${r.year} يشير إلى إدارة غير موجودة` });
            }
          }
        });
      });

      return {
        counts, totalRecords, earliestYear, latestYear,
        departmentsCount: state.departments.length,
        lastModifiedAt: state.meta.lastModifiedAt,
        lastBackupAt: state.settings.lastBackupAt,
        storageSizeKB: StorageEngine.estimateSizeKB(),
        issues
      };
    },

    // ---------- النسخ الاحتياطي ----------
    // يشمل النسخ الاحتياطي الكامل بيانات هذا المكتب (state) والإعدادات المشتركة بين
    // المكتبين معًا (هوية الجهة، القوالب، بيانات الدخول...) في ملف واحد. الصيغة تدعم
    // أيضًا استيراد ملفات النسخ الاحتياطي القديمة (بيانات المكتب فقط دون الإعدادات
    // المشتركة، أو دون البيانات الوصفية الغنية المُضافة لاحقًا).

    /** أسماء جداول بيانات المحاور المخصّصة (غير الأساسية) — تُحسَب من customCategories
     *  نفسها لأن أسماء مفاتيحها ديناميكية (لا تُعرَف مسبقًا كـCORE_TABLES). */
    _customTableKeys() { return (state.customCategories || []).map(c => c.key); },

    /** يبني كائن البيانات الوصفية الغنية المرفقة مع كل نسخة احتياطية — تُحتسب من
     *  المحتوى الفعلي وقت التصدير، لا قيم ثابتة. */
    _backupMeta(type, workspacePart, globalPart) {
      let recordCount = 0;
      if (workspacePart) {
        CORE_TABLES.concat(this._customTableKeys()).forEach(t => { recordCount += (workspacePart[t] || []).length; });
      }
      const attachmentFields = ['organizationLogo', 'coverBackground', 'reportBackgroundPortrait', 'reportBackgroundLandscape', 'landingCardBackground'];
      const attachmentCount = globalPart ? attachmentFields.filter(f => globalPart[f]).length : 0;
      return {
        schemaVersion: SCHEMA_VERSION,
        backupType: type, // 'full' | 'stats' | 'settings' | 'media'
        createdAt: new Date().toISOString(),
        recordCount,
        departmentCount: workspacePart ? (workspacePart.departments || []).length : 0,
        attachmentCount
      };
    },

    /** type: 'full' (كل شيء) | 'stats' (بيانات المحاور فقط) | 'settings' (الإعدادات
     *  فقط بلا سجلات) | 'media' (الشعار والخلفيات فقط). */
    exportBackup(type = 'full') {
      state.settings.lastBackupAt = new Date().toISOString();
      const g = StorageEngine.readGlobal() || {};
      let workspacePart = null, globalPart = null;

      if (type === 'full') {
        workspacePart = state; globalPart = g;
      } else if (type === 'stats') {
        workspacePart = { departments: state.departments, customCategories: state.customCategories, categoryOverrides: state.categoryOverrides, seq: state.seq };
        CORE_TABLES.concat(this._customTableKeys()).forEach(t => { workspacePart[t] = state[t]; });
      } else if (type === 'settings') {
        workspacePart = { settings: state.settings, categoryOverrides: state.categoryOverrides };
        const { coverBackground, reportBackgroundPortrait, reportBackgroundLandscape, landingCardBackground, ...restGlobal } = g;
        globalPart = restGlobal;
      } else if (type === 'media') {
        globalPart = {};
        ['organizationLogo', 'coverBackground', 'reportBackgroundPortrait', 'reportBackgroundLandscape', 'landingCardBackground'].forEach(f => { if (g[f]) globalPart[f] = g[f]; });
      }

      const meta = this._backupMeta(type, workspacePart, globalPart);
      const backup = { ...meta, workspaceState: workspacePart, globalSettings: globalPart };
      const json = JSON.stringify(backup, null, 2);
      log('backup', 'system', `تم تصدير نسخة احتياطية (${{ full: 'شاملة', stats: 'إحصاءات فقط', settings: 'إعدادات فقط', media: 'وسائط فقط' }[type]})`);
      this._logBackupHistory({ ...meta, sizeKB: Math.round(json.length / 1024 * 10) / 10 }, json);
      persist();
      return json;
    },

    /** يتحقق من صحة الملف ويُرجع ملخصًا لعرضه على المستخدم قبل أي تنفيذ فعلي —
     *  لا يُغيّر أي بيانات، فحص فقط. */
    inspectBackupFile(jsonText) {
      let parsed;
      try { parsed = JSON.parse(jsonText); } catch (e) { throw new Error('ملف غير صالح: ليس بصيغة JSON سليمة'); }
      if (typeof parsed !== 'object' || parsed === null) throw new Error('ملف غير صالح: التنسيق غير متعرف عليه');
      const workspacePart = parsed.workspaceState;
      const isLegacy = !('backupType' in parsed);
      // التوافق مع النسخ القديمة (قبل هذا التحسين): إما بيانات المكتب مباشرة على
      // المستوى الأعلى، أو بصيغة workspaceState بلا بيانات وصفية غنية.
      const effectiveWorkspace = workspacePart || (isLegacy && !parsed.globalSettings ? parsed : null);
      if (effectiveWorkspace) {
        const backupType = parsed.backupType || 'full';
        // كل نوع نسخة له متطلباته الخاصة — نسخة "إحصاءات فقط" مثلًا لا تحوي settings
        // بتصميم صحيح، فلا يصح مطالبتها به. النسخ القديمة (isLegacy) تُفترض كاملة.
        let required = [];
        if (isLegacy || backupType === 'full') required = ['departments', 'settings', ...CORE_TABLES];
        else if (backupType === 'stats') required = ['departments', ...CORE_TABLES];
        else if (backupType === 'settings') required = ['settings'];
        const missing = required.filter(k => !(k in effectiveWorkspace));
        if (missing.length) throw new Error('ملف غير صالح: يفتقد إلى بيانات أساسية (' + missing.join(', ') + ')');
      }
      if (!parsed.workspaceState && !parsed.globalSettings && !isLegacy) {
        throw new Error('ملف غير صالح: لا يحوي أي بيانات قابلة للاستيراد');
      }
      if (parsed.schemaVersion && parsed.schemaVersion > SCHEMA_VERSION) {
        throw new Error(`هذا الملف من إصدار أحدث من النظام الحالي (${parsed.schemaVersion} > ${SCHEMA_VERSION}) — يُرجى تحديث النظام أولًا قبل الاستيراد`);
      }
      let recordCount = 0;
      if (workspacePart) CORE_TABLES.concat((workspacePart.customCategories || []).map(c => c.key)).forEach(t => { recordCount += (workspacePart[t] || []).length; });
      return {
        parsed,
        backupType: parsed.backupType || 'full (نسخة قديمة)',
        createdAt: parsed.createdAt || null,
        schemaVersion: parsed.schemaVersion || null,
        recordCount: (parsed.recordCount === undefined || parsed.recordCount === null) ? recordCount : parsed.recordCount,
        departmentCount: (parsed.departmentCount === undefined || parsed.departmentCount === null) ? (workspacePart ? (workspacePart.departments || []).length : 0) : parsed.departmentCount,
        attachmentCount: (parsed.attachmentCount === undefined || parsed.attachmentCount === null) ? null : parsed.attachmentCount,
        sizeKB: Math.round(jsonText.length / 1024 * 10) / 10,
        isLegacy
      };
    },

    validateBackup(parsed) { this.inspectBackupFile(JSON.stringify(parsed)); return true; }, // للتوافق الخلفي

    /** mode: 'merge' (الافتراضي الآمن — يضيف السجلات غير الموجودة فقط، لا يمسّ أي
