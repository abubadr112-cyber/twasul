     *  سجل حالي) | 'update' (يستبدل قيمة السجلات المشتركة بمحتوى النسخة، ويضيف غير
     *  الموجود، دون حذف أي سجل آخر) | 'replace' (استبدال كامل — يمسح كل شيء أولًا).
     *  يُرجع تقريرًا تفصيليًا بعد التنفيذ. */
    importBackup(jsonText, mode = 'replace') {
      const t0 = Date.now();
      const { parsed } = this.inspectBackupFile(jsonText);
      const workspacePart = parsed.workspaceState || (!parsed.globalSettings ? parsed : null);
      const report = { added: 0, updated: 0, skipped: 0, errors: 0, mode };

      if (mode === 'replace') {
        const fresh = defaultState();
        if (workspacePart) {
          state = {
            ...fresh, ...workspacePart,
            settings: { ...fresh.settings, ...(workspacePart.settings || {}) },
            seq: { ...fresh.seq, ...(workspacePart.seq || {}) }
          };
          CORE_TABLES.concat(this._customTableKeys()).forEach(t => { report.added += (state[t] || []).length; });
        }
      } else {
        // merge/update: نمرّ على كل جدول بيانات (أساسي أو مخصّص) موجود في النسخة،
        // ونُطبِّق upsertRecord/upsertStructuredRequest سجلًا سجلًا — وهو بالضبط نفس
        // منطق "الإدخال اليدوي" المستخدم أصلًا، فنضمن اتساقًا تامًا مع بقية النظام
        // بدل إعادة اختراع منطق دمج منفصل.
        if (workspacePart) {
          if (Array.isArray(workspacePart.departments)) {
            workspacePart.departments.forEach(d => {
              try {
                const exists = state.departments.some(x => x.name === d.name);
                if (!exists) { this.addDepartment(d.name); report.added++; }
                else report.skipped++;
              } catch (e) { report.errors++; }
            });
          }
          ['requests', 'activities', 'communication', 'weekly_sessions'].forEach(table => {
            (workspacePart[table] || []).forEach(rec => {
              try {
                const cfg = this.getTableConfig()[table];
                const keys = {}; cfg.keyFields.forEach(k => { keys[k] = rec[k]; });
                if (table === 'requests') keys.requestType = rec.requestType;
                const existing = table === 'requests'
                  ? this.getStructuredRequest(rec.month, rec.year, rec.requestType)
                  : state[table].find(r => cfg.keyFields.every(k => r[k] === rec[k]));
                if (existing && mode === 'merge') { report.skipped++; return; }
                if (table === 'requests') this.upsertStructuredRequest(rec);
                else this.upsertRecord(table, rec);
                existing ? report.updated++ : report.added++;
              } catch (e) { report.errors++; }
            });
          });
          (workspacePart.customCategories || []).forEach(cc => {
            try {
              if (!state.customCategories.some(x => x.key === cc.key)) {
                state.customCategories.push(cc);
                state.seq[cc.key] = state.seq[cc.key] || 0;
                if (!state[cc.key]) state[cc.key] = [];
              }
            } catch (e) { report.errors++; }
          });
        }
      }

      if (parsed.globalSettings && (mode === 'replace' || mode === 'update')) {
        const currentGlobal = StorageEngine.readGlobal() || {};
        StorageEngine.writeGlobal(mode === 'replace' ? parsed.globalSettings : { ...currentGlobal, ...parsed.globalSettings });
      } else if (parsed.globalSettings && mode === 'merge') {
        const currentGlobal = StorageEngine.readGlobal() || {};
        const merged = { ...parsed.globalSettings, ...currentGlobal }; // القيم الحالية تبقى أولوية في الدمج الآمن
        StorageEngine.writeGlobal(merged);
      }

      report.durationMs = Date.now() - t0;
      log('restore', 'system', `تم استيراد نسخة احتياطية (${{ merge: 'دمج', update: 'تحديث', replace: 'استبدال كامل' }[mode]}) — أُضيف ${report.added}، حُدِّث ${report.updated}، تُجوهل ${report.skipped}`);
      persist();
      return report;
    },

    // ---------- سجل النسخ الاحتياطية ----------
    /** يُخزَّن آخر ١٠ نسخ فقط (بمحتواها الكامل، لإتاحة إعادة التنزيل) لتفادي تضخّم
     *  التخزين المحلي بلا حدود؛ الأقدم يُحذف تلقائيًا عند تجاوز الحد. */
    _logBackupHistory(meta, content) {
      if (!state.settings.backupHistory) state.settings.backupHistory = [];
      state.settings.backupHistory.unshift({
        id: 'bkp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        ...meta,
        filename: this._backupFilename(meta.backupType),
        content
      });
      state.settings.backupHistory = state.settings.backupHistory.slice(0, 10);
    },
    _backupFilename(type) {
      const stamp = new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '-');
      const label = { full: 'كاملة', stats: 'إحصاءات', settings: 'إعدادات', media: 'وسائط' }[type] || type;
      return `نسخة-احتياطية-${label}_${stamp}.json`;
    },
    listBackupHistory() { return state.settings.backupHistory || []; },
    deleteBackupHistoryEntry(id) {
      state.settings.backupHistory = (state.settings.backupHistory || []).filter(b => b.id !== id);
      persist();
    },

    resetAll() {
      state = seedDefaults(defaultState());
      log('reset', 'system', 'تمت إعادة تعيين النظام بالكامل إلى الحالة الافتراضية');
      persist();
    }
  };
})();


/* ===== auth.js ===== */
/**
 * ===== الصلاحيات (Auth) =====
 * ثلاثة مستويات ثابتة: admin (مسؤول النظام، صلاحيات كاملة دومًا)، supervisor (مشرف)،
 * employee (موظف). هذه الحسابات **مشتركة بين المكتبين** (وليست خاصة بمكتب واحد)،
 * لأن تسجيل الدخول يحدث قبل اختيار أي مكتب أصلًا — تمامًا مثل هوية الجهة الرئيسية.
 *
 * ⚠️ تنبيه مهم: هذا نظام "فصل استخدام" (Access Gating) لمنع التعديل العرضي بين عدة
 * أشخاص يستخدمون نفس الجهاز — وليس نظام حماية أمنية حقيقية. النظام كامل يعمل محليًا
 * في المتصفح دون خادم، وأي بيانات الدخول محفوظة كنص عادي يمكن لأي شخص لديه معرفة
 * تقنية بسيطة الوصول إليها عبر أدوات المطوّر في المتصفح. لا تستخدمه لحماية معلومات
 * حسّاسة فعليًا — دوره منع الأخطاء العرضية بين الموظفين، لا أكثر.
 */
const Auth = {
  currentRole: null, // 'admin' | 'supervisor' | 'employee' | null قبل تسجيل الدخول

  DEFAULT_AUTH: {
    admin: { username: 'admin', password: 'admin123' },
    supervisor: {
      username: 'supervisor', password: 'super123', enabled: true, expiresAt: null,
      permissions: { settings_general: true, settings_fields: true, settings_departments: true, settings_health: true, settings_backup: false, about_edit: true }
    },
    employee: {
      username: 'employee', password: 'employee123', enabled: true, expiresAt: null,
      permissions: { settings_general: false, settings_fields: false, settings_departments: false, settings_health: false, settings_backup: false, about_edit: false }
    }
  },

  /** يُنشئ بيانات الدخول الافتراضية لأول مرة فقط. يحاول أيضًا استعارة بيانات مسؤول
   *  النظام من أي مكتب كان يحتفظ ببيانات دخول خاصة به من نسخة سابقة للنظام (قبل أن
   *  تصبح الحسابات مشتركة)، حتى لا يفقد المستخدم أي تخصيص سابق. */
  ensureDefaults() {
    const g = StorageEngine.readGlobal() || {};
    if (g.auth) return;
    let auth = this.DEFAULT_AUTH;
    const office1Raw = localStorage.getItem(StorageEngine.keyFor('office1'));
    if (office1Raw) {
      try {
        const parsed = JSON.parse(office1Raw);
        if (parsed.auth) auth = parsed.auth;
      } catch (e) { /* تجاهل، استخدم الافتراضي */ }
    }
    StorageEngine.writeGlobal({ ...g, auth });
  },

  getAuth() {
    const g = StorageEngine.readGlobal() || {};
    return g.auth || this.DEFAULT_AUTH;
  },

  login(username, password) {
    const auth = this.getAuth();
    for (const role of ['admin', 'supervisor', 'employee']) {
      if (auth[role].username === username && auth[role].password === password) {
        if (role !== 'admin') {
          if (auth[role].enabled === false) return { success: false, reason: 'disabled' };
          if (this.isExpired(auth[role])) return { success: false, reason: 'expired' };
        }
        this.currentRole = role;
        return { success: true, role };
      }
    }
    return { success: false, reason: 'invalid' };
  },

  /** هل تجاوز هذا الحساب تاريخ انتهاء صلاحيته المحدَّد؟ حساب بلا تاريخ = لا ينتهي أبدًا. */
  isExpired(roleAuth) {
    if (!roleAuth || !roleAuth.expiresAt) return false;
    return new Date(roleAuth.expiresAt) < new Date();
  },

  logout() { this.currentRole = null; },

  isAdmin() { return this.currentRole === 'admin'; },

  updateRoleCredentials(role, { username, password }) {
    const g = StorageEngine.readGlobal() || {};
    const auth = { ...this.getAuth() };
    if (!auth[role]) throw new Error('دور غير معروف');
    auth[role] = { ...auth[role] };
    if (username && username.trim()) auth[role].username = username.trim();
    if (password && password.trim()) auth[role].password = password.trim();
    StorageEngine.writeGlobal({ ...g, auth });
  },

  updateRolePermissions(role, permissions) {
    if (role === 'admin') throw new Error('صلاحيات مسؤول النظام ثابتة ولا يمكن تعديلها');
    const g = StorageEngine.readGlobal() || {};
    const auth = { ...this.getAuth() };
    if (!auth[role]) throw new Error('دور غير معروف');
    auth[role] = { ...auth[role], permissions: { ...auth[role].permissions, ...permissions } };
    StorageEngine.writeGlobal({ ...g, auth });
  },

  /** يضبط تفعيل/تعطيل حساب وتاريخ انتهاء صلاحيته (اختياري) — لمسؤول النظام فقط،
   *  ولا تنطبق على حساب مسؤول النظام نفسه أبدًا (يبقى دائمًا مفعّلًا بلا انتهاء). */
  updateRoleExpiry(role, { enabled, expiresAt }) {
    if (role === 'admin') throw new Error('لا ينطبق على حساب مسؤول النظام');
    const g = StorageEngine.readGlobal() || {};
    const auth = { ...this.getAuth() };
    if (!auth[role]) throw new Error('دور غير معروف');
    auth[role] = { ...auth[role], enabled: !!enabled, expiresAt: expiresAt || null };
    StorageEngine.writeGlobal({ ...g, auth });
  },

  /** هل يملك المستخدم الحالي صلاحية معيّنة؟ 'entry' و'reports' أساسيتان لأي حساب
   *  مسجّل دخول (مشرف أو موظف)، و'org_identity' و'manage_users' حكر على مسؤول
   *  النظام دائمًا مهما حدث، وبقية الصلاحيات قابلة للمنح فرديًا. */
  can(permKey) {
    if (this.currentRole === 'admin') return true;
    if (!this.currentRole) return false;
    if (permKey === 'entry' || permKey === 'reports') return true;
    if (permKey === 'org_identity' || permKey === 'manage_users') return false;
    const perms = this.getAuth()[this.currentRole]?.permissions || {};
    return !!perms[permKey];
  },

  /** هل يملك المستخدم الحالي أي صلاحية إعدادات على الإطلاق؟ يُستخدم لإخفاء تبويب
   *  الإعدادات كليًا من القائمة الجانبية إن لم تكن هناك أي صلاحية أصلًا. */
  hasAnySettingsAccess() {
    if (this.currentRole === 'admin') return true;
    return ['settings_general', 'settings_fields', 'settings_departments', 'settings_health', 'settings_backup']
      .some(p => this.can(p));
  }
};


/* ===== analytics.js ===== */
/**
 * ===== طبقة التحليلات (Analytics) =====
 * كل حساب أو تجميع يظهر في أي شاشة (لوحة التحكم، الرسوم البيانية، مؤشرات الأداء، التقارير)
 * يمر من هنا فقط. لا تكرّر أي صفحة عمليات الجمع بنفسها — هذا يضمن أن الرقم نفسه
 * يظهر بنفس القيمة في كل مكان، ويجعل تعديل منطق الحساب مركزيًا في مكان واحد.
 *
 * المحاور الأربعة الأساسية: الطلبات (اللقاءات اليومية) — الأنشطة والزيارات —
 * التواصل — الجلسات الأسبوعية. مبنية على التقرير الرسمي الشهري المرفوع لسمو الأمير.
 */
const Analytics = {
  /** الطلبات بنية غنية وليست حقولًا مسطّحة: العدد الإجمالي والمكتملة مباشرة على
   *  السجل، بينما "تحت الإجراء" و"المُحالة" مجموع مصفوفات متغيّرة العدد. */
  _sumRequests(year, month = null) {
    const rows = DataLayer.listRecords('requests', { year }).filter(r => month === null || r.month === month);
    return {
      t: rows.reduce((s, r) => s + (r.totalCount || 0), 0),
      c: rows.reduce((s, r) => s + (r.completedCount || 0), 0),
      p: rows.reduce((s, r) => s + (r.inProgressItems || []).reduce((s2, x) => s2 + (x.count || 0), 0), 0),
      referred: rows.reduce((s, r) => s + (r.referrals || []).reduce((s2, x) => s2 + (x.count || 0), 0), 0)
    };
  },
  /** تجميع "عدد الطلبات المحالة" حسب نص "جهة الإحالة" عبر كل السجلات المُعطاة. */
  _referralBreakdown(rows) {
    const map = {};
    rows.forEach(r => (r.referrals || []).forEach(x => {
      const key = (x.destination || '').trim() || 'غير محدد';
      map[key] = (map[key] || 0) + (x.count || 0);
    }));
    return Object.entries(map)
      .map(([name, total]) => ({ name, total }))
      .filter(x => x.total > 0)
      .sort((a, b) => b.total - a.total);
  },
  /** نفس تفصيل جهات الإحالة أعلاه، لكن مقسَّمًا إلى إدارات داخلية وجهات خارجية —
   *  بمطابقة اسم كل جهة إحالة مع نوعها المُسجَّل في قائمة الإدارات. أي جهة غير
   *  موجودة في القائمة (أو "غير محدد") تُصنَّف داخلية افتراضيًا للتوافق مع بيانات
   *  سابقة لم يكن فيها هذا التصنيف أصلًا. */
  _referralBreakdownSplit(rows) {
    const all = this._referralBreakdown(rows);
    const typeByName = {};
    DataLayer.listDepartments().forEach(d => { typeByName[d.name] = d.type; });
    const internal = [], external = [];
    all.forEach(x => (typeByName[x.name] === 'external' ? external : internal).push(x));
    return { all, internal, external };
  },
  _sumSimple(table, col, year, month = null) {
    return DataLayer.listRecords(table, { year })
      .filter(r => month === null || r.month === month)
      .reduce((s, r) => s + (r[col] || 0), 0);
  },
  /** جدول شهري لحالة الطلبات (العدد الإجمالي، المنجزة، تحت الإجراء، نسبة الإنجاز)
   *  لكل شهر من أشهر السنة المحدَّدة — الأساس لتبويب "معلومات". */
  monthlyRequestsTable(year) {
    return MONTHS.map((name, i) => {
      const m = i + 1;
      const s = this._sumRequests(year, m);
      const rate = s.t ? Math.round((s.c / s.t) * 1000) / 10 : 0;
      return { month: m, name, total: s.t, completed: s.c, inProgress: s.p, rate };
    });
  },
  /** توزيع الطلبات حسب "متلقي الطلب" (جهة الإحالة)، مقسَّمًا لداخلي/خارجي — قابل
   *  للتضييق على شهر واحد بدل السنة كاملة عبر معامل month الاختياري. */
  recipientBreakdown(year, month = null) {
    const rows = DataLayer.listRecords('requests', { year }).filter(r => month === null || r.month === month);
    return this._referralBreakdownSplit(rows);
  },
  /** جمع حقل نصي تراكمي (مصفوفة {value,count}) عبر كل السجلات — لمحور "التواصل". */
  _sumTextField(table, col, year, month = null) {
    return DataLayer.listRecords(table, { year })
      .filter(r => month === null || r.month === month)
      .reduce((s, r) => s + DataLayer.sumTextTally(r[col]), 0);
  },
  /** تفصيل قيم حقل نصي تراكمي (مثل "المناسبة": تعزية×3، عزاء×1) عبر مجموعة سجلات. */
  _textFieldBreakdown(rows, col) {
    const map = {};
    rows.forEach(r => (r[col] || []).forEach(t => {
      const key = (t.value || '').trim() || 'غير محدد';
      map[key] = (map[key] || 0) + (t.count || 0);
    }));
    return Object.entries(map)
      .map(([name, total]) => ({ name, total }))
      .filter(x => x.total > 0)
      .sort((a, b) => b.total - a.total);
  },
  _pctChange(now, prev) {
    return prev ? Math.round(((now - prev) / prev) * 1000) / 10 : (now > 0 ? 100 : 0);
  },

  dashboard(year) {
    const rNow = this._sumRequests(year), rPrev = this._sumRequests(year - 1);
    const visNow = this._sumSimple('activities', 'visits_count', year), visPrev = this._sumSimple('activities', 'visits_count', year - 1);
    const vrNow = this._sumSimple('activities', 'visitors_count', year), vrPrev = this._sumSimple('activities', 'visitors_count', year - 1);
    const omNow = this._sumSimple('activities', 'official_meetings_count', year), omPrev = this._sumSimple('activities', 'official_meetings_count', year - 1);
    const celNow = this._sumSimple('activities', 'celebrations_count', year), celPrev = this._sumSimple('activities', 'celebrations_count', year - 1);
    const commOccNow = this._sumTextField('communication', 'occasion_type', year), commOccPrev = this._sumTextField('communication', 'occasion_type', year - 1);
    const methNow = this._sumTextField('communication', 'method', year), methPrev = this._sumTextField('communication', 'method', year - 1);
    const sesNow = this._sumSimple('weekly_sessions', 'sessions_count', year), sesPrev = this._sumSimple('weekly_sessions', 'sessions_count', year - 1);
    const sesAttNow = this._sumSimple('weekly_sessions', 'attendees_count', year), sesAttPrev = this._sumSimple('weekly_sessions', 'attendees_count', year - 1);

    const rateNow = rNow.t ? Math.round((rNow.c / rNow.t) * 1000) / 10 : 0;
    const ratePrev = rPrev.t ? Math.round((rPrev.c / rPrev.t) * 1000) / 10 : 0;

    return {
      year,
      cards: {
        total_requests: { value: rNow.t, change: this._pctChange(rNow.t, rPrev.t) },
        completed_requests: { value: rNow.c, change: this._pctChange(rNow.c, rPrev.c) },
        in_progress_requests: { value: rNow.p, change: this._pctChange(rNow.p, rPrev.p) },
        referred_requests: { value: rNow.referred, change: this._pctChange(rNow.referred, rPrev.referred) },
        // نسبة الإنجاز تُقارن بفارق النقاط المئوية وليس بنسبة تغيّر نسبية، لأن ذلك أوضح وأدق لقارئ التقرير
        completion_rate: { value: rateNow, changePoints: Math.round((rateNow - ratePrev) * 10) / 10 },
        total_visits: { value: visNow, change: this._pctChange(visNow, visPrev) },
        total_visitors: { value: vrNow, change: this._pctChange(vrNow, vrPrev) },
        total_official_meetings: { value: omNow, change: this._pctChange(omNow, omPrev) },
        total_celebrations: { value: celNow, change: this._pctChange(celNow, celPrev) },
        total_communication_occasions: { value: commOccNow, change: this._pctChange(commOccNow, commOccPrev) },
        total_communication_methods: { value: methNow, change: this._pctChange(methNow, methPrev) },
        total_sessions: { value: sesNow, change: this._pctChange(sesNow, sesPrev) },
        total_session_attendees: { value: sesAttNow, change: this._pctChange(sesAttNow, sesAttPrev) }
      }
    };
  },

  chartsData(year) {
    const months = Array.from({ length: 12 }, (_, i) => i + 1);
    const byMonth = (table, col) => months.map(m => this._sumSimple(table, col, year, m));
    const reqByMonth = months.map(m => this._sumRequests(year, m));
    const byReferral = this._referralBreakdown(DataLayer.listRecords('requests', { year }));
    const byReferralSplit = this._referralBreakdownSplit(DataLayer.listRecords('requests', { year }));
    const commRows = DataLayer.listRecords('communication', { year });

    return {
      year, monthNames: MONTHS,
      requests_total: reqByMonth.map(r => r.t),
      requests_completed: reqByMonth.map(r => r.c),
      requests_in_progress: reqByMonth.map(r => r.p),
      visits: byMonth('activities', 'visits_count'),
      visitors: byMonth('activities', 'visitors_count'),
      official_meetings: byMonth('activities', 'official_meetings_count'),
      celebrations: byMonth('activities', 'celebrations_count'),
      sessions: byMonth('weekly_sessions', 'sessions_count'),
      session_attendees: byMonth('weekly_sessions', 'attendees_count'),
      by_referral: byReferral,
      by_referral_split: byReferralSplit,
      by_occasion_type: this._textFieldBreakdown(commRows, 'occasion_type'),
      by_method: this._textFieldBreakdown(commRows, 'method')
    };
  },

  kpis(year) {
    const r = this._sumRequests(year);
    const monthsWithData = new Set(DataLayer.listRecords('requests', { year }).map(x => x.month)).size || 1;
    const byReferral = this._referralBreakdown(DataLayer.listRecords('requests', { year }));

    const monthlyTotals = Array.from({ length: 12 }, (_, i) => ({ m: i + 1, t: this._sumRequests(year, i + 1).t }))
      .sort((a, b) => b.t - a.t);

    // متوسط "نسبة الإنجاز الشهرية" — متوسط نسبة كل شهر على حدة (لا نسبة الإجمالي السنوي
    // نفسها)، فيعكس استقرار الأداء عبر الأشهر لا فقط المجموع الكلي.
    const monthlyRates = [];
    for (let m = 1; m <= 12; m++) {
      const mr = this._sumRequests(year, m);
      if (mr.t > 0) monthlyRates.push((mr.c / mr.t) * 100);
    }
    const avgMonthlyCompletionRate = monthlyRates.length
      ? Math.round((monthlyRates.reduce((a, b) => a + b, 0) / monthlyRates.length) * 10) / 10 : 0;

    return {
      completion_rate: r.t ? Math.round((r.c / r.t) * 1000) / 10 : 0,
      avg_monthly_completion_rate: avgMonthlyCompletionRate,
      avg_requests_month: Math.round((r.t / monthsWithData) * 10) / 10,
      avg_visits_month: Math.round((this._sumSimple('activities', 'visits_count', year) / monthsWithData) * 10) / 10,
      avg_visitors_month: Math.round((this._sumSimple('activities', 'visitors_count', year) / monthsWithData) * 10) / 10,
      avg_sessions_month: Math.round((this._sumSimple('weekly_sessions', 'sessions_count', year) / monthsWithData) * 10) / 10,
      top_referral: byReferral[0]?.total ? byReferral[0].name : '—',
      top_month: monthlyTotals[0]?.t ? MONTHS[monthlyTotals[0].m - 1] : '—'
    };
  },

  aggregateRange(fromYear, fromMonth, toYear, toMonth) {
    const inRange = (y, m) => (y > fromYear || (y === fromYear && m >= fromMonth)) && (y < toYear || (y === toYear && m <= toMonth));
    const pick = table => DataLayer.listRecords(table).filter(x => inRange(x.year, x.month));

    const r = pick('requests'), act = pick('activities'), comm = pick('communication'), ws = pick('weekly_sessions');

    const byReferral = this._referralBreakdown(r);
    const sumField = (arr, key) => arr.reduce((s, x) => s + (x[key] || 0), 0);
    const sumNested = (arr, key) => arr.reduce((s, x) => s + (x[key] || []).reduce((s2, y) => s2 + (y.count || 0), 0), 0);

    return {
      period: { fromYear, fromMonth, toYear, toMonth },
      requests: {
        total: sumField(r, 'totalCount'), completed: sumField(r, 'completedCount'),
        in_progress: sumNested(r, 'inProgressItems'), referred: sumNested(r, 'referrals')
      },
      visits: sumField(act, 'visits_count'),
      visitors: sumField(act, 'visitors_count'),
      official_meetings: sumField(act, 'official_meetings_count'),
      celebrations: sumField(act, 'celebrations_count'),
      communication_occasions: sumNested(comm, 'occasion_type'),
      communication_methods: sumNested(comm, 'method'),
      sessions: sumField(ws, 'sessions_count'),
      session_attendees: sumField(ws, 'attendees_count'),
      by_referral: byReferral,
      by_occasion_type: this._textFieldBreakdown(comm, 'occasion_type'),
      by_method: this._textFieldBreakdown(comm, 'method')
    };
  },

  /** مؤشرات أداء محسوبة لأي فترة تقرير (وليس سنة كاملة فقط)، بناءً على ناتج aggregateRange
   *  نفسه دون أي استعلام إضافي — حساب واحد يُعاد استخدامه، بلا ازدواجية. */
  periodKpis(range) {
    const { fromYear, fromMonth, toYear, toMonth } = range.period;
    const monthsCount = (toYear - fromYear) * 12 + (toMonth - fromMonth) + 1;
    const perMonth = v => monthsCount ? Math.round((v / monthsCount) * 10) / 10 : 0;
    return {
      monthsCount,
      completion_rate: range.requests.total ? Math.round((range.requests.completed / range.requests.total) * 1000) / 10 : 0,
      avg_requests_month: perMonth(range.requests.total),
      avg_visits_month: perMonth(range.visits),
      avg_sessions_month: perMonth(range.sessions),
      top_referral: range.by_referral[0]?.name || '—'
    };
  },

  /** سلسلة شهرية لأي فترة تقرير (وليست سنة كاملة فقط) — تُستخدم لرسم اتجاه الطلبات
   *  وربطها بصريًا بمؤشرات الأداء المحسوبة لنفس الفترة بالضبط. */
  monthlySeries(fromYear, fromMonth, toYear, toMonth) {
    const months = [];
    let y = fromYear, m = fromMonth;
    while (y < toYear || (y === toYear && m <= toMonth)) {
      months.push({ y, m });
      m++; if (m > 12) { m = 1; y++; }
    }
    const labels = months.map(({ y, m }) => `${MONTHS[m - 1].slice(0, 3)} ${y}`);
    const req = months.map(({ y, m }) => this._sumRequests(y, m));
    return {
      labels,
      requests_total: req.map(r => r.t),
      requests_completed: req.map(r => r.c),
      requests_in_progress: req.map(r => r.p),
      visits: months.map(({ y, m }) => this._sumSimple('activities', 'visits_count', y, m)),
      sessions: months.map(({ y, m }) => this._sumSimple('weekly_sessions', 'sessions_count', y, m))
    };
  },

  /** إجمالي كل محور مخصّص (أضافه المستخدم من الإعدادات) لسنة معيّنة — تُستخدم في تبويب
   *  "مؤشرات إضافية" بلوحة التحكم. تعمل تلقائيًا مع أي عدد من المحاور المخصّصة دون تعديل. */
  customCategoryTotals(year) {
    return DataLayer.listCustomCategories().map(c => {
      const rows = DataLayer.listRecords(c.key, { year });
      const cfg = DataLayer.getTableConfig()[c.key];
      const totals = {};
      c.valueFields.forEach(f => {
        if (cfg.fieldTypes[f.key] === 'text') {
          totals[f.key] = rows.reduce((s, r) => s + DataLayer.sumTextTally(r[f.key]), 0);
        } else {
          totals[f.key] = rows.reduce((s, r) => s + (r[f.key] || 0), 0);
        }
      });
      return { key: c.key, title: c.title, fields: c.valueFields, totals };
    });
  },

  /** نفس الفكرة لكن لأي فترة تقرير مخصّصة بدل سنة كاملة. */
  customCategoryRangeTotals(fromYear, fromMonth, toYear, toMonth) {
    const inRange = (y, m) => (y > fromYear || (y === fromYear && m >= fromMonth)) && (y < toYear || (y === toYear && m <= toMonth));
    return DataLayer.listCustomCategories().map(c => {
      const rows = DataLayer.listRecords(c.key).filter(x => inRange(x.year, x.month));
      const cfg = DataLayer.getTableConfig()[c.key];
      const totals = {};
      c.valueFields.forEach(f => {
        if (cfg.fieldTypes[f.key] === 'text') {
          totals[f.key] = rows.reduce((s, r) => s + DataLayer.sumTextTally(r[f.key]), 0);
        } else {
          totals[f.key] = rows.reduce((s, r) => s + (r[f.key] || 0), 0);
        }
      });
      return { key: c.key, title: c.title, fields: c.valueFields, totals };
    });
  },

  earliestDataYear() {
    const all = DataLayer.getRecordTables().map(t => DataLayer.listRecords(t)).reduce((a,b)=>a.concat(b),[]);
    const founding = DataLayer.getSettings().foundingYear;
    if (!all.length) return founding || new Date().getFullYear();
    return Math.min(founding || Infinity, ...all.map(x => x.year));
  }
};


/* ===== charts.js ===== */
/**
 * محرك رسوم بيانية خفيف مبني بالكامل بلغة JavaScript الأصلية (Canvas API)
 * لا يعتمد على أي مكتبة خارجية (لا Chart.js ولا غيرها) — ليتوافق مع متطلب
 * عدم الاعتماد على مكونات خارجية تتطلب اتصالاً بالإنترنت أو تثبيتًا.
 * يدعم: line, bar, doughnut
 */
class MiniChart {
  constructor(canvas, config) {
    this.canvas = canvas;
    this.config = config;
    this.dpr = window.devicePixelRatio || 1;
    this._resize();
    window.addEventListener('resize', () => { this._resize(); this.draw(); });
    this.draw();
  }

  _resize() {
    // .chart-card أصبح له ارتفاع ثابت موحّد عبر CSS (بدل الاعتماد على حجم المحتوى) —
    // نحسب هنا ارتفاع لوحة الرسم بدقة حسابية من ارتفاع البطاقة الثابت هذا ناقص
    // العنوان والحشوة، بدل حسابه من عرض البطاقة كما كان سابقًا. هذا يضمن تطابق ارتفاع
    // كل الرسوم البيانية تمامًا بصرف النظر عن عرضها أو موضعها في الشبكة — وهو بالضبط
    // ما كان يُنتج تفاوتًا بصريًا ملحوظًا بين البطاقات (بعضها أطول من بعض) سابقًا.
    const card = this.canvas.parentElement;
    const cardRect = card.getBoundingClientRect();
    const h3 = card.querySelector('h3');
    const h3Height = h3 ? h3.getBoundingClientRect().height : 0;
    const cs = window.getComputedStyle(card);
    const padLeft = parseFloat(cs.paddingLeft) || 0, padRight = parseFloat(cs.paddingRight) || 0;
    const padTop = parseFloat(cs.paddingTop) || 0, padBottom = parseFloat(cs.paddingBottom) || 0;
    const cssW = Math.max(60, cardRect.width - padLeft - padRight);
    const cssH = Math.max(60, cardRect.height - padTop - padBottom - h3Height);
    this.canvas.style.width = cssW + 'px';
    this.canvas.style.height = cssH + 'px';
    this.canvas.width = cssW * this.dpr;
    this.canvas.height = cssH * this.dpr;
    this.ctx = this.canvas.getContext('2d');
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.w = cssW; this.h = cssH;
  }

  draw() {
    const { type } = this.config;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);
    ctx.font = (this._isNarrow() ? '10px' : '11px') + ' Segoe UI, Tahoma, sans-serif';
    if (type === 'line' || type === 'bar') this._drawCartesian();
    else if (type === 'doughnut') this._drawDoughnut();
  }

  _isDark() {
    return document.documentElement.getAttribute('data-theme') === 'dark';
  }
  _isNarrow() { return this.w < 380; }
  _gridColor() { return this._isDark() ? '#25342B' : '#E7EAE7'; }
  _textColor() { return this._isDark() ? '#93A69B' : '#5B6B63'; }

  _drawCartesian() {
    const { labels, datasets, type } = this.config;
    const ctx = this.ctx;
    const allValues = datasets.map(d => d.data).reduce((a,b)=>a.concat(b),[]);
    const maxVal = Math.max(1, ...allValues);
    const niceMax = this._niceMax(maxVal);

    const yLabelWidth = ctx.measureText(this._fmt(niceMax)).width;
    const padL = Math.max(28, yLabelWidth + 12), padR = 10, padT = 16, padB = this._isNarrow() ? 22 : 28;
    const plotW = this.w - padL - padR;
    const plotH = this.h - padT - padB;

    // خطوط الشبكة الأفقية
    ctx.strokeStyle = this._gridColor();
    ctx.fillStyle = this._textColor();
    ctx.lineWidth = 1;
    const steps = 4;
    for (let i = 0; i <= steps; i++) {
      const y = padT + plotH - (plotH * i / steps);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(this.w - padR, y);
      ctx.stroke();
      const val = Math.round(niceMax * i / steps);
      ctx.textAlign = 'right';
      ctx.fillText(this._fmt(val), padL - 6, y + 3);
    }

    // تسميات المحور الأفقي — نُظهر عددًا من التسميات يتناسب مع العرض الفعلي المتاح
    // فقط، بدلاً من قاعدة ثابتة، لضمان عدم تداخل النصوص على شاشات الجوال الضيقة.
    ctx.textAlign = 'center';
    const approxLabelWidth = this._isNarrow() ? 34 : 46; // تقدير عرض تسمية شهر واحدة بالبكسل
    const maxLabelsFit = Math.max(2, Math.floor(plotW / approxLabelWidth));
    const step = Math.max(1, Math.ceil(labels.length / maxLabelsFit));
    labels.forEach((lab, i) => {
      if (i % step !== 0) return;
      const x = padL + plotW * (i + 0.5) / labels.length;
      ctx.fillText(this._isNarrow() ? lab.slice(0, 3) : lab, x, this.h - 8);
    });

    if (type === 'bar') {
      const groupW = plotW / labels.length;
      const barGap = 4;
      const barW = (groupW - barGap * (datasets.length + 1)) / datasets.length;
      datasets.forEach((ds, di) => {
        ctx.fillStyle = ds.color;
        ds.data.forEach((v, i) => {
          const x = padL + groupW * i + barGap + di * (barW + barGap);
          const barH = plotH * (v / niceMax);
          const y = padT + plotH - barH;
          this._roundRect(ctx, x, y, barW, barH, 3);
          ctx.fill();
        });
      });
    } else {
      datasets.forEach(ds => {
        ctx.strokeStyle = ds.color;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ds.data.forEach((v, i) => {
          const x = padL + plotW * (i + 0.5) / labels.length;
          const y = padT + plotH - plotH * (v / niceMax);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
        // نقاط
        ctx.fillStyle = ds.color;
        ds.data.forEach((v, i) => {
          const x = padL + plotW * (i + 0.5) / labels.length;
          const y = padT + plotH - plotH * (v / niceMax);
          ctx.beginPath();
          ctx.arc(x, y, 2.6, 0, Math.PI * 2);
          ctx.fill();
        });
      });
    }

    if (datasets.length > 1) this._legend(datasets);
  }

  _drawDoughnut() {
    const { colors } = this.config;
    let { labels, data } = this.config;
    const ctx = this.ctx;

    // حد أقصى لعناصر المفتاح المعروضة كي لا يطول عن ارتفاع اللوحة عند وجود إدارات كثيرة
    const MAX_LEGEND_ITEMS = 6;
    if (labels.length > MAX_LEGEND_ITEMS) {
      const otherSum = data.slice(MAX_LEGEND_ITEMS).reduce((s, v) => s + v, 0);
      labels = [...labels.slice(0, MAX_LEGEND_ITEMS), `أخرى (${labels.length - MAX_LEGEND_ITEMS})`];
      data = [...data.slice(0, MAX_LEGEND_ITEMS), otherSum];
    }

    // نحجز مساحة مستقلة للمفتاح أسفل اللوحة، بحيث لا يتداخل نصه مع الرسم الدائري إطلاقًا
    const legendH = labels.length * (this._isNarrow() ? 14 : 15) + 10;
    const chartAreaH = this.h - legendH;
    const cx = this.w / 2, cy = chartAreaH / 2;
    const radius = Math.min(this.w, chartAreaH) / 2 - 8;
    const total = data.reduce((s, v) => s + v, 0) || 1;
    let start = -Math.PI / 2;

    if (data.every(v => v === 0)) {
      ctx.fillStyle = this._textColor();
      ctx.textAlign = 'center';
      ctx.fillText('لا توجد بيانات', cx, cy);
      return;
    }

    data.forEach((v, i) => {
      const angle = (v / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, start, start + angle);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      start += angle;
    });
    // حفرة الدونات
    ctx.fillStyle = this._isDark() ? '#152019' : '#FFFFFF';
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.58, 0, Math.PI * 2);
    ctx.fill();

    // مفتاح الرسم (Legend) — في مساحته المحجوزة أسفل الرسم، لا فوقه
    ctx.textAlign = 'right';
    ctx.font = (this._isNarrow() ? '9.5px' : '11px') + ' Segoe UI, Tahoma, sans-serif';
    let ly = chartAreaH + 14;
    labels.forEach((lab, i) => {
      ctx.fillStyle = colors[i % colors.length];
      ctx.fillRect(this.w - 14, ly - 8, 9, 9);
      ctx.fillStyle = this._textColor();
      ctx.fillText(lab, this.w - 20, ly);
      ly += this._isNarrow() ? 14 : 15;
    });
  }

  _legend(datasets) {
    const ctx = this.ctx;
    let x = this.w - 10;
    ctx.font = (this._isNarrow() ? '9px' : '11px') + ' Segoe UI, Tahoma, sans-serif';
    ctx.textAlign = 'right';
    datasets.forEach(ds => {
      const width = ctx.measureText(ds.label).width;
      ctx.fillStyle = ds.color;
      ctx.fillRect(x - width - 14, 4, 9, 9);
      ctx.fillStyle = this._textColor();
      ctx.fillText(ds.label, x, 12);
      x -= (width + 26);
    });
  }

  _roundRect(ctx, x, y, w, h, r) {
    if (h <= 0) { ctx.beginPath(); return; }
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  _niceMax(v) {
    if (v <= 5) return 5;
    const pow = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / pow;
    let nice;
    if (n <= 1) nice = 1; else if (n <= 2) nice = 2; else if (n <= 5) nice = 5; else nice = 10;
    return nice * pow;
  }
  _fmt(n) { return new Intl.NumberFormat('ar-EG-u-nu-latn').format(n); }
}


/* ===== xlsExport.js ===== */
/**
 * تصدير إلى Excel بدون أي مكتبة خارجية
 * يستخدم صيغة SpreadsheetML (XML) التي يفتحها Excel مباشرة ويدعم عدة أوراق عمل،
 * وهي صيغة نصية خالصة يمكن توليدها بجافاسكريبت الأصلية دون الحاجة لأي مكتبة ضغط أو تحويل.
 */
const XlsExport = {
  escapeXml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  },

  cell(value) {
    const isNum = typeof value === 'number' && !isNaN(value);
    const type = isNum ? 'Number' : 'String';
    return `<Cell><Data ss:Type="${type}">${this.escapeXml(value)}</Data></Cell>`;
  },

  sheet(name, rows) {
    const rowsXml = rows.map(r => `<Row>${r.map(c => this.cell(c)).join('')}</Row>`).join('');
    return `<Worksheet ss:Name="${this.escapeXml(name)}"><Table>${rowsXml}</Table></Worksheet>`;
  },

  /**
   * sheets: [{ name: 'اسم الورقة', rows: [[...], [...]] }, ...]
   */
  download(sheets, fileName) {
    const sheetsXml = sheets.map(s => this.sheet(s.name, s.rows)).join('');
    const xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">
<Styles>
  <Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Bottom" ss:ReadingOrder="RightToLeft"/></Style>
</Styles>
${sheetsXml}
</Workbook>`;
    const blob = new Blob([xml], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName.endsWith('.xls') ? fileName : fileName + '.xls';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
};


/* ===== pages/dashboard.js ===== */
/**
 * ===== صفحة لوحة التحكم =====
 * العنصر الرئيسي في النظام. تقرأ فقط من Analytics ولا تحسب أي شيء بنفسها —
 * تُحسب كل الأرقام مرة واحدة في render()، وتُوزَّع بعد ذلك على التصنيفات (Categories)
 * فقط للعرض، دون أي إعادة حساب. هذا يبقي المؤشرات "مصدرًا واحدًا للحقيقة" رغم التقسيم.
 *
 * المحاور الأربعة: اللقاءات اليومية (الطلبات) — الأنشطة والزيارات — التواصل —
 * الجلسات الأسبوعية. مبنية على التقرير الرسمي الشهري المرفوع لسمو الأمير.
 */
const DashboardPage = {
  activeCategory: 'overview',
  _ctx: null, // يحتفظ بآخر بيانات محسوبة (dash/chartData/kpis) لإعادة استخدامها عند تبديل التصنيف

  /** التصنيفات مبنية ديناميكيًا من DataLayer.getTableConfig() بدل عناوين ثابتة، حتى
   *  تنعكس أي إعادة تسمية أو تغيير أيقونة من الإعدادات هنا فورًا. */
  buildBaseCategories() {
    const cfg = DataLayer.getTableConfig();
    return [
      { key: 'overview', title: 'نظرة عامة' },
      { key: 'requests', title: cfg.requests.title },
      { key: 'activities', title: cfg.activities.title },
      { key: 'communication', title: cfg.communication.title },
      { key: 'weekly_sessions', title: cfg.weekly_sessions.title },
      { key: 'performance', title: 'الأداء العام' }
    ];
  },

  render(container, year) {
    const dash = Analytics.dashboard(year);
    const chartData = Analytics.chartsData(year);
    const kpis = Analytics.kpis(year);
    const customTotals = Analytics.customCategoryTotals(year);
    this._ctx = { dash, chartData, kpis, year, customTotals };

    // تبويب "مؤشرات إضافية" يظهر فقط إن وُجدت محاور مخصّصة أضافها المستخدم من الإعدادات
    const base = this.buildBaseCategories();
    this.categories = customTotals.length
      ? [...base, { key: 'custom', title: 'مؤشرات إضافية' }]
      : base;
    if (!this.categories.some(c => c.key === this.activeCategory)) this.activeCategory = 'overview';

    const pct = dash.cards.completion_rate.value;

    container.innerHTML = `
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
        <button class="btn btn-gold btn-small" id="startPresentationBtn" title="عرض تقديمي" aria-label="عرض تقديمي">🖥️</button>
      </div>
      <div class="hero-badge">
        <div class="hero-ring" style="--pct:${pct}">
          <div class="hero-ring-inner">${pct}%</div>
        </div>
        <div class="hero-text">
          <h2>نسبة إنجاز الطلبات لعام ${year}</h2>
          <p>من إجمالي ${fmtNum(dash.cards.total_requests.value)} طلب — ${fmtNum(dash.cards.completed_requests.value)} طلب مكتمل</p>
        </div>
      </div>

      <div class="tabs" id="dashTabs"></div>
      <div id="dashCategoryBody"></div>
    `;

    document.getElementById('startPresentationBtn').addEventListener('click', () => PresentationPage.startForOffice());
    const tabsEl = document.getElementById('dashTabs');
    tabsEl.innerHTML = this.categories.map(c =>
      `<button class="tab-btn ${c.key === this.activeCategory ? 'active' : ''}" data-cat="${c.key}">${c.title}</button>`
    ).join('');
    tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        this.activeCategory = btn.dataset.cat;
        tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        this.renderCategory();
      });
    });

    this.renderCategory();
  },

  card(label, d, icon) {
    let changeHtml = '<div class="change"></div>'; // محجوز دائمًا للحفاظ على ارتفاع موحّد، حتى بلا نسبة تغيّر
    if (d.changePoints !== undefined) {
      const v = d.changePoints;
      changeHtml = `<div class="change ${v > 0 ? 'up' : v < 0 ? 'down' : 'flat'}">${v > 0 ? '+' : ''}${v} نقطة</div>`;
    } else if (d.change !== undefined) {
      changeHtml = `<div class="change ${d.change > 0 ? 'up' : d.change < 0 ? 'down' : 'flat'}">${fmtPct(d.change)}</div>`;
    }
    return `
      <div class="stat-card">
        <div class="stat-top">
          <div class="label">${label}</div>
        </div>
        <div class="value">${typeof d.value === 'number' ? fmtNum(d.value) : d.value}</div>
        ${changeHtml}
      </div>`;
  },
  kpiItem(label, value) {
    return `<div class="kpi-item"><div class="kv">${value}</div><div class="kl">${label}</div></div>`;
  },
  /** شريط "لمحة سريعة" — بديل بطاقات KPI الصغيرة المتفرقة، بنفس لغة بطاقات المؤشرات
   *  الرئيسية تصميميًا (ارتفاع ثابت، حواف وظل موحّدان، عنوان مقصوص بسطرين كحد أقصى)
   *  لكن كشريط أفقي مضغوط بلا أيقونات، لأنها لا تناسب هذا السياق المكثّف. */
  quickGlanceBar(items) {
    return `
      <div class="quick-glance-bar">
        ${items.map(it => `
          <div class="quick-glance-item">
            <div class="qg-label">${it.label}</div>
            <div class="qg-value">${it.value}</div>
          </div>
        `).join('')}
      </div>`;
  },
  chartCard(title, canvasId, full = false) {
    return `<div class="chart-card${full ? ' full' : ''}"><h3>${title}</h3><canvas id="${this._idPrefix || ''}${canvasId}"></canvas></div>`;
  },
  /** قائمة "الأعلى" أفقية مرتبة — تُظهر الاسم والرقم الدقيق أمامه مباشرة، أوضح للقراءة
   *  من رسم دائري حين يكون الترتيب والقيمة الفعلية أهم من مجرّد النسبة البصرية. */
  topListCard(data) {
    const top = data.slice(0, 5);
    if (!top.length) return `<p style="color:var(--text-muted);font-size:12.5px">لا توجد بيانات كافية بعد.</p>`;
    const max = top[0].total || 1;
    return `
      <div class="chart-card full top-list-card">
        ${top.map((x, i) => `
          <div class="top-list-row">
            <div class="top-list-rank">${i + 1}</div>
            <div class="top-list-info">
              <div class="top-list-name">${x.name}</div>
              <div class="top-list-bar-track"><div class="top-list-bar-fill" style="width:${Math.round((x.total / max) * 100)}%"></div></div>
            </div>
            <div class="top-list-value">${fmtNum(x.total)}</div>
          </div>
        `).join('')}
      </div>`;
  },

  /** targetBodyId/categoryOverride اختياريان — تمكّنان إعادة استخدام هذا المنطق نفسه
   *  خارج الصفحة الرئيسية (في العرض التقديمي مثلًا) دون تكرار أي كود، مع تفادي تصادم
   *  معرّفات عناصر الرسوم البيانية عبر بادئة فريدة لكل هدف. */
  renderCategory(targetBodyId, categoryOverride, part) {
    const { dash, chartData, kpis, customTotals } = this._ctx;
    const c = dash.cards;
    const bodyId = targetBodyId || 'dashCategoryBody';
    const body = document.getElementById(bodyId);
    const cat = categoryOverride || this.activeCategory;
    this._idPrefix = bodyId === 'dashCategoryBody' ? '' : bodyId + '_';

    const tcfg = DataLayer.getTableConfig();
    const reqTitle = tcfg.requests.title;
    const reqTotalLabel = tcfg.requests.labels.totalCount;
    const reqCompletedLabel = tcfg.requests.labels.completedCount;
    const reqInProgressLabel = tcfg.requests.labels.inProgressCount;
    const reqReferralLabel = tcfg.requests.labels.referralCount;
    const referralDestLabel = tcfg.requests.labels.referralDestination;

    const activitiesTitle = tcfg.activities.title;
    const visitsLabel = tcfg.activities.labels.visits_count;
    const visitorsLabel = tcfg.activities.labels.visitors_count;
    const officialMeetingsLabel = tcfg.activities.labels.official_meetings_count;
    const celebrationsLabel = tcfg.activities.labels.celebrations_count;

    const commTitle = tcfg.communication.title;
    const occasionLabel = tcfg.communication.labels.occasion_type;
    const methodLabel = tcfg.communication.labels.method;

    const sessionsTitle = tcfg.weekly_sessions.title;
    const sessionsLabel = tcfg.weekly_sessions.labels.sessions_count;
    const sessionAttendeesLabel = tcfg.weekly_sessions.labels.attendees_count;

    // أيقونات مأخوذة من إعدادات كل محور نفسها (Settings ← الحقول والمؤشرات)، فتبقى
    // متّسقة مع أي أيقونة يختارها المستخدم لاحقًا، لا ثابتة في الكود.
    const reqIcon = tcfg.requests.icon, activitiesIcon = tcfg.activities.icon;
    const commIcon = tcfg.communication.icon, sessionsIcon = tcfg.weekly_sessions.icon;
    const rateIcon = '🎯', trophyIcon = '🏆', avgIcon = '📈';
    const lastModified = DataLayer.dataHealth().lastModifiedAt;
    const daysSinceUpdate = lastModified ? Math.floor((Date.now() - new Date(lastModified).getTime()) / 86400000) : null;
    const daysSinceUpdateLabel = daysSinceUpdate === null ? '—' : daysSinceUpdate === 0 ? 'اليوم' : fmtNum(daysSinceUpdate);

    const chartsToBuild = [];

    if (cat === 'overview') {
      body.innerHTML = `
        <div class="section-title">أبرز المؤشرات</div>
        <div class="cards-grid">
          ${this.card(reqTotalLabel, c.total_requests, reqIcon)}
          ${this.card('نسبة الإنجاز', { value: c.completion_rate.value + '%', changePoints: c.completion_rate.changePoints }, rateIcon)}
          ${this.card(visitsLabel, c.total_visits, activitiesIcon)}
          ${this.card(sessionsLabel, c.total_sessions, sessionsIcon)}
        </div>
        <div class="section-title">لمحة سريعة</div>
        ${this.quickGlanceBar([
          { label: 'أكثر ' + referralDestLabel + ' استقبالًا لـ' + reqTitle, value: kpis.top_referral },
          { label: 'أكثر شهر نشاطًا', value: kpis.top_month },
          { label: 'متوسط الإنجاز الشهري', value: kpis.avg_monthly_completion_rate + '%' },
          { label: 'عدد الأيام منذ آخر تحديث', value: daysSinceUpdateLabel }
        ])}
        <div class="section-title">الاتجاه العام</div>
        <div class="charts-grid">
          ${this.chartCard('تطور ' + reqTitle + ' حسب الأشهر', 'chartRequestsTrend')}
          ${this.chartCard(visitsLabel + ' حسب الأشهر', 'chartVisitsTrend')}
        </div>
      `;
      chartsToBuild.push(
        ['chartRequestsTrend', { type: 'line', labels: chartData.monthNames, datasets: [{ label: reqTotalLabel, data: chartData.requests_total, color: '#0E4B3D' }] }],
        ['chartVisitsTrend', { type: 'bar', labels: chartData.monthNames, datasets: [{ label: visitsLabel, data: chartData.visits, color: '#B8902F' }] }]
      );

    } else if (cat === 'requests') {
      // في العرض التقديمي تحديدًا، محتوى هذا المحور كثيف بما يكفي ليفيض عن حدود
      // الشريحة الواحدة (بطاقات + مؤشرات + رسمان بيانيان + قائمة الأعلى معًا) —
      // فيُقسَّم إلى شريحتين متتاليتين بدل شريحة واحدة تحتاج تمريرًا. الصفحة الرئيسية
      // تعرض كل شيء دائمًا معًا (part='full')، لأن التمرير فيها أمر طبيعي ومتوقَّع.
      const showMetrics = part !== 'charts';
      const showCharts = part !== 'metrics';
      body.innerHTML = `
        ${showMetrics ? `
        <div class="section-title">مؤشرات ${reqTitle}</div>
        <div class="cards-grid">
          ${this.card(reqTotalLabel, c.total_requests, reqIcon)}
          ${this.card(reqCompletedLabel, c.completed_requests, '✅')}
          ${this.card(reqInProgressLabel, c.in_progress_requests, '⏳')}
          ${this.card(reqReferralLabel, c.referred_requests, '↗️')}
        </div>
        ${(() => {
          const split = chartData.by_referral_split;
          const hasInternal = split.internal.length > 0;
          const hasExternal = split.external.length > 0;
          // إن لم توجد بيانات مصنَّفة إطلاقًا بعد (كل الإحالات لجهات غير مُصنَّفة نوعها)،
          // نعرض القائمة المجمَّعة القديمة بدل قسمين فارغين لا يفيدان أحدًا.
          if (!hasInternal && !hasExternal) return `
            <div class="section-title">أعلى ${referralDestLabel} لـ${reqTitle}</div>
            ${this.topListCard(chartData.by_referral)}`;
          return `
            <div class="section-title">أعلى الإدارات الداخلية (${referralDestLabel})</div>
            ${this.topListCard(split.internal)}
            <div class="section-title">أعلى الجهات الخارجية (${referralDestLabel})</div>
            ${this.topListCard(split.external)}`;
        })()}` : ''}
        ${showCharts ? `
        <div class="section-title">الرسوم البيانية</div>
        <div class="charts-grid charts-grid-tall">
          ${this.chartCard('تطور ' + reqTitle + ' حسب الأشهر', 'chartRequestsTrend')}
          ${this.chartCard(reqCompletedLabel + ' مقابل ' + reqInProgressLabel, 'chartRequestsCompare')}
        </div>` : ''}
      `;
      if (showCharts) chartsToBuild.push(
        ['chartRequestsTrend', { type: 'line', labels: chartData.monthNames, datasets: [{ label: reqTotalLabel, data: chartData.requests_total, color: '#0E4B3D' }] }],
        ['chartRequestsCompare', { type: 'bar', labels: chartData.monthNames, datasets: [
          { label: reqCompletedLabel, data: chartData.requests_completed, color: '#146B54' },
          { label: reqInProgressLabel, data: chartData.requests_in_progress, color: '#B8902F' }
        ]}]
      );

    } else if (cat === 'activities') {
      body.innerHTML = `
        <div class="section-title">${activitiesTitle}</div>
        <div class="cards-grid">
          ${this.card(visitsLabel, c.total_visits, activitiesIcon)}
          ${this.card(visitorsLabel, c.total_visitors, '👥')}
          ${this.card(officialMeetingsLabel, c.total_official_meetings, '🏛️')}
          ${this.card(celebrationsLabel, c.total_celebrations, '🎉')}
        </div>
        <div class="kpi-grid" style="margin-top:12px">
          ${this.kpiItem('متوسط ' + visitsLabel + ' الشهري', fmtNum(kpis.avg_visits_month), avgIcon)}
        </div>
        <div class="section-title">الرسوم البيانية</div>
        <div class="charts-grid">
          ${this.chartCard(visitsLabel + ' حسب الأشهر', 'chartVisits')}
          ${this.chartCard(visitorsLabel + ' حسب الأشهر', 'chartVisitors')}
        </div>
      `;
      chartsToBuild.push(
        ['chartVisits', { type: 'bar', labels: chartData.monthNames, datasets: [{ label: visitsLabel, data: chartData.visits, color: '#1E8A5F' }] }],
        ['chartVisitors', { type: 'line', labels: chartData.monthNames, datasets: [{ label: visitorsLabel, data: chartData.visitors, color: '#7C8B82' }] }]
      );

    } else if (cat === 'communication') {
      const hasOccasion = chartData.by_occasion_type.length > 0;
      const hasMethod = chartData.by_method.length > 0;
      const anyDetail = hasOccasion || hasMethod;
      body.innerHTML = `
        <div class="section-title">${commTitle}</div>
        <div class="cards-grid">
          ${this.card(occasionLabel, c.total_communication_occasions, '🎊')}
          ${this.card(methodLabel, c.total_communication_methods, commIcon)}
        </div>
        ${anyDetail ? `
        <div class="section-title">التوزيع التفصيلي</div>
        <div class="charts-grid">
          ${hasOccasion ? this.chartCard(occasionLabel + ' — التوزيع', 'chartOccasion') : ''}
          ${hasMethod ? this.chartCard(methodLabel + ' — التوزيع', 'chartMethod', true) : ''}
        </div>` : `
        <p style="color:var(--text-muted);font-size:12.5px;margin-top:10px">لا توجد بيانات كافية بعد لعرض التوزيع التفصيلي.</p>`}
      `;
      if (hasOccasion) chartsToBuild.push(['chartOccasion', { type: 'doughnut', labels: chartData.by_occasion_type.map(x => x.name), data: chartData.by_occasion_type.map(x => x.total), colors: ['#0E4B3D','#146B54','#B8902F','#1E8A5F','#7C8B82','#C98A1D'] }]);
      if (hasMethod) chartsToBuild.push(['chartMethod', { type: 'doughnut', labels: chartData.by_method.map(x => x.name), data: chartData.by_method.map(x => x.total), colors: ['#B8902F','#0E4B3D','#146B54','#1E8A5F','#7C8B82','#C98A1D'] }]);

    } else if (cat === 'weekly_sessions') {
      body.innerHTML = `
        <div class="section-title">${sessionsTitle}</div>
        <div class="cards-grid">
          ${this.card(sessionsLabel, c.total_sessions, sessionsIcon)}
          ${this.card(sessionAttendeesLabel, c.total_session_attendees, '👥')}
        </div>
        <div class="kpi-grid" style="margin-top:12px">
          ${this.kpiItem('متوسط ' + sessionsLabel + ' الشهري', fmtNum(kpis.avg_sessions_month), avgIcon)}
        </div>
        <div class="section-title">الرسوم البيانية</div>
        <div class="charts-grid">
          ${this.chartCard(sessionsLabel + ' حسب الأشهر', 'chartSessions', true)}
        </div>
      `;
      chartsToBuild.push(
        ['chartSessions', { type: 'bar', labels: chartData.monthNames, datasets: [{ label: sessionsLabel, data: chartData.sessions, color: '#C98A1D' }] }]
      );

    } else if (cat === 'performance') {
      const py = this._ctx.year, ppy = py - 1;
      body.innerHTML = `
        <div class="section-title">الأداء العام</div>
        <div class="cards-grid">
          ${this.card('نسبة الإنجاز', { value: c.completion_rate.value + '%', changePoints: c.completion_rate.changePoints }, rateIcon)}
          ${this.card(sessionsLabel, c.total_sessions, sessionsIcon)}
        </div>
        <div class="section-title">مؤشرات الأداء الشاملة (KPIs)</div>
        <div class="kpi-grid">
          ${this.kpiItem('متوسط ' + reqTitle + ' الشهري', fmtNum(kpis.avg_requests_month), avgIcon)}
          ${this.kpiItem('متوسط ' + visitsLabel + ' الشهري', fmtNum(kpis.avg_visits_month), avgIcon)}
          ${this.kpiItem('أكثر ' + referralDestLabel + ' لـ' + reqTitle, kpis.top_referral, trophyIcon)}
          ${this.kpiItem('أكثر شهر نشاطًا', kpis.top_month, trophyIcon)}
        </div>
        <div class="section-title">مقارنة ${py} بالعام السابق (${ppy})</div>
        <div class="charts-grid">
          ${this.chartCard(reqTotalLabel + ': ' + py + ' مقابل ' + ppy, 'chartYoY')}
          ${this.chartCard('تطور ' + reqTitle + ' حسب الأشهر', 'chartPerfTrend')}
        </div>
      `;
      const prevYearData = Analytics.dashboard(ppy);
      chartsToBuild.push(
        ['chartYoY', { type: 'bar', labels: [String(ppy), String(py)], datasets: [{ label: reqTotalLabel, data: [prevYearData.cards.total_requests.value, c.total_requests.value], color: '#0E4B3D' }] }],
        ['chartPerfTrend', { type: 'line', labels: chartData.monthNames, datasets: [{ label: reqTotalLabel, data: chartData.requests_total, color: '#0E4B3D' }] }]
      );
    } else if (cat === 'custom') {
      body.innerHTML = `
        <div class="section-title">مؤشرات إضافية</div>
        <div class="cards-grid">
          ${customTotals.map(cc => cc.fields.map(f =>
            this.card(`${cc.title} — ${f.label}`, { value: cc.totals[f.key] }, '📌')
          )).reduce((a,b)=>a.concat(b),[]).join('')}
        </div>
        <p style="color:var(--text-muted);font-size:12.5px;margin-top:10px">
          يمكنك إضافة أو إعادة تسمية المحاور المخصّصة من الإعدادات ← الحقول والمؤشرات.
        </p>
      `;
    }

    chartsToBuild.forEach(([id, cfg]) => {
      const canvas = document.getElementById(this._idPrefix + id);
      if (canvas) new MiniChart(canvas, cfg);
    });

    // نفس حركة الأرقام الحيّة وانتقال الدخول المستخدمَين في العرض التقديمي، هنا أيضًا
    // في الصفحة الرئيسية — بلا أي تكرار للكود لأنهما يستخدمان نفس الدوال المشتركة.
    body.classList.remove('slide-in');
    void body.offsetWidth;
    body.classList.add('slide-in');
    animateCountUp('#' + bodyId);
  }
};


/* ===== pages/presentation.js ===== */
/**
 * ===== عرض تقديمي (وضع ملء الشاشة) =====
 * مبني على قائمة "شرائح" عامة {officeKey, officeTitle, categoryKey, categoryTitle, ctx}،
/**
 * ===== أدوات قراءة ملفات إكسل (.xlsx) داخل المتصفح، بلا اتصال إنترنت =====
 * تعتمد على JSZip المُضمَّنة أصلًا ضمن حزمة PptxGenJS (ملف .xlsx هو أرشيف ZIP
 * يحوي XML لكل ورقة عمل)، وعلى DOMParser المتوفر أصلًا في كل متصفح لقراءة ذلك الـXML
 * — فلا حاجة لتضمين مكتبة قراءة إكسل منفصلة بالكامل لمجرّد استخراج قيم الخلايا.
 */
async function parseXlsxFile(file) {
  if (typeof JSZip === 'undefined') throw new Error('تعذّر تحميل أداة قراءة ملفات إكسل');
  // يجب تحويل كائن File إلى ArrayBuffer صراحةً — عنصر File في المتصفح الحقيقي لا
  // يحمل خاصية length (بل size)، فتمريره مباشرةً لـ JSZip يفشل بخطأ غامض لاحقًا.
  const arrayBuffer = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(arrayBuffer);

  let sharedStrings = [];
  const sharedStringsFile = zip.file('xl/sharedStrings.xml');
  if (sharedStringsFile) {
    const xml = await sharedStringsFile.async('text');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    sharedStrings = Array.from(doc.getElementsByTagName('si')).map(si => si.textContent);
  }

  // حدّد مسار أول ورقة عمل فعليًا من علاقات المصنّف بدل افتراض "sheet1.xml" دائمًا
  let sheetPath = 'xl/worksheets/sheet1.xml';
  try {
    const workbookFile = zip.file('xl/workbook.xml');
    const relsFile = zip.file('xl/_rels/workbook.xml.rels');
    if (workbookFile && relsFile) {
      const wbXml = await workbookFile.async('text');
      const m = wbXml.match(/<sheet[^>]*r:id="(rId\d+)"[^>]*\/>/);
      if (m) {
        const relsXml = await relsFile.async('text');
        const relMatch = relsXml.match(new RegExp(`<Relationship[^>]*Id="${m[1]}"[^>]*Target="([^"]+)"`));
        if (relMatch) sheetPath = 'xl/' + relMatch[1].replace(/^\/?(xl\/)?/, '');
      }
    }
  } catch (e) { /* تجاهل، سنعتمد المسار الافتراضي sheet1.xml */ }

  const sheetFile = zip.file(sheetPath) || zip.file('xl/worksheets/sheet1.xml');
  if (!sheetFile) throw new Error('تعذّر العثور على ورقة عمل داخل الملف. تأكد أنه ملف Excel صالح (.xlsx).');
  const sheetXml = await sheetFile.async('text');
  const doc = new DOMParser().parseFromString(sheetXml, 'application/xml');

  const colToIndex = (letters) => {
    let idx = 0;
    for (let i = 0; i < letters.length; i++) idx = idx * 26 + (letters.charCodeAt(i) - 64);
    return idx - 1;
  };

  const rows = Array.from(doc.getElementsByTagName('row')).map(rowEl => {
    const rowData = [];
    Array.from(rowEl.getElementsByTagName('c')).forEach(c => {
      const ref = c.getAttribute('r') || '';
      const colLetters = ref.replace(/[0-9]/g, '');
      const colIndex = colLetters ? colToIndex(colLetters) : rowData.length;
      const type = c.getAttribute('t');
      let value = '';
      if (type === 'inlineStr') {
        const isEl = c.getElementsByTagName('is')[0];
        value = isEl ? isEl.textContent : '';
      } else {
        const vEl = c.getElementsByTagName('v')[0];
        value = vEl ? vEl.textContent : '';
        if (type === 's') value = sharedStrings[parseInt(value, 10)] || '';
      }
      rowData[colIndex] = value;
    });
    return rowData;
  });
  return rows.filter(r => r.some(v => v !== undefined && String(v).trim() !== ''));
}

/** يستخرج رقم الشهر (١-١٢) من قيمة عمود "الشهر" أو "تاريخ الطلب" أيًّا كانت صيغتها:
 *  رقم شهر مباشر، اسم شهر عربي، رقم تسلسلي لتاريخ إكسل (الشائع فعليًا عندما يكون
 *  العمود "تاريخ الطلب" كتاريخ فعلي لا شهرًا مُجزَّأ مسبقًا)، أو نص تاريخ بصيغة
 *  سنة-شهر-يوم (ISO) أو يوم/شهر/سنة (الأكثر شيوعًا محليًا). */
/** يطبّع نص العنوان: يزيل المسافات الزائدة وعلامات الاتجاه غير المرئية (شائعة في
 *  ملفات إكسل المُصدَّرة من بعض الأنظمة) دون تغيير الحروف نفسها. */
function normalizeHeader(h) {
  return String(h || '')
    .replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

/** يوحّد الفوارق الإملائية العربية الشائعة (أ/إ/آ→ا، ى→ي، ة→ه، وإزالة التشكيل) حتى
 *  تتطابق عناوين من قبيل "حالة" و"حاله"، أو "الإدارة" و"الادارة"، بلا الحاجة لسرد كل
 *  الاختلافات الممكنة يدويًا. */
function arabicFold(s) {
  return normalizeHeader(s)
    .replace(/[أإآا]/g, 'ا')
    .replace(/[ىي]/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/[ًٌٍَُِّْ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

/** يطابق عمودًا من قائمة أسماء بديلة، بثلاث مراحل متدرجة الصرامة: تطابق حرفي تام،
 *  فتطابق بعد توحيد الفوارق الإملائية، فاحتواء جزئي كملاذ أخير — بحيث يُختار أدق
 *  تطابق ممكن أولًا بدل الاستقرار على أول عمود يحتوي كلمة عامة. */
function matchColumn(headers, aliases) {
  for (const a of aliases) {
    const idx = headers.findIndex(h => normalizeHeader(h) === a);
    if (idx > -1) return idx;
  }
  for (const a of aliases) {
    const foldedA = arabicFold(a);
    const idx = headers.findIndex(h => arabicFold(h) === foldedA);
    if (idx > -1) return idx;
  }
  for (const a of aliases) {
    const foldedA = arabicFold(a);
    const idx = headers.findIndex(h => arabicFold(h).includes(foldedA) || foldedA.includes(arabicFold(h)));
    if (idx > -1) return idx;
  }
  return -1;
}

const DAILY_MEETING_COLUMN_ALIASES = {
  date: ['تاريخ الطلب', 'التاريخ', 'تاريخ'],
  recipient: ['متلقي الطلب', 'متلقى الطلب', 'المتلقي'],
  category: ['التصنيف الأساسي', 'التصنيف'],
  status: ['حالة الطلب', 'حاله الطلب', 'الحالة', 'حالة'],
  department: ['الإدارة المعنية داخل الإمارة', 'الإدارة المعنية', 'الإدارة'],
};

/** يستخرج تاريخًا فعليًا من قيمة الخلية أيًّا كانت صيغتها: رقم تسلسلي لتاريخ إكسل،
 *  نص بصيغة سنة-شهر-يوم (ISO)، أو يوم/شهر/سنة (الصيغة المحلية الشائعة). */
function parseDateValue(v) {
  if (v === undefined || v === null) return null;
  const str = String(v).trim();
  if (!str) return null;
  if (/^\d+(\.\d+)?$/.test(str)) {
    const n = parseFloat(str);
    if (n > 1000) {
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
      if (!isNaN(d.getTime())) return d;
    }
  }
  let m = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m) { const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); if (!isNaN(d.getTime())) return d; }
  m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) { const d = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1])); if (!isNaN(d.getTime())) return d; }
  return null;
}

/** يوحّد قيم حالة الطلب المتفرقة (منجز/تم/منتهٍ...) إلى قيمتين قياسيتين فقط، عبر
 *  مطابقة أنماط شائعة بدل اشتراط نص مطابق حرفيًا. */
function normStatus(v) {
  const s = String(v || '').trim();
  if (/مكتمل|منج|منته|تم/.test(s)) return 'مكتمل';
  if (/إجراء|اجراء|جاري|قيد|معلق/.test(s)) return 'تحت الإجراء';
  return s || 'غير محدد';
}

/** يوحّد قيم متلقي الطلب إلى فئتين محدَّدتين (أمير المنطقة / نائبه) وفق السياق
 *  التنظيمي الفعلي لهذا النظام — أي قيمة أخرى تُصنَّف "غير محدد" بدل اختراع فئات
 *  إضافية غير معتمدة. */
function normRecipient(v) {
  const s = String(v || '').trim();
  if (!s) return 'غير محدد';
  if (/نائب/.test(s)) return 'نائب أمير المنطقة';
  if (/أمير|امير/.test(s)) return 'أمير المنطقة';
  return 'غير محدد';
}

/** يحوّل صفوف الملف الخام إلى سجلات "لقاء يومي" فردية (تاريخ، متلقي، تصنيف، حالة،
 *  إدارة معنية) — سجل واحد لكل صف، بلا تجميع مسبق، مطابقةً تمامًا لبنية نظام "لوحة
 *  معلومات طلبات إمارة المنطقة" المرجعي. الصفوف الفارغة أو بلا تاريخ صالح تُستبعَد
 *  ويُحصى عددها بدل إسقاط الاستيراد بالكامل بسببها. */
function parseDailyMeetingsRows(rawRows) {
  if (!rawRows.length) throw new Error('الملف فارغ.');
  const header = rawRows[0].map(h => String(h || ''));
  const dateCol = matchColumn(header, DAILY_MEETING_COLUMN_ALIASES.date);
  const recipientCol = matchColumn(header, DAILY_MEETING_COLUMN_ALIASES.recipient);
  const categoryCol = matchColumn(header, DAILY_MEETING_COLUMN_ALIASES.category);
  const statusCol = matchColumn(header, DAILY_MEETING_COLUMN_ALIASES.status);
  const deptCol = matchColumn(header, DAILY_MEETING_COLUMN_ALIASES.department);

  const missing = [];
  if (dateCol === -1) missing.push('تاريخ الطلب');
  if (recipientCol === -1) missing.push('متلقي الطلب');
  if (categoryCol === -1) missing.push('التصنيف الأساسي');
  if (statusCol === -1) missing.push('حالة الطلب');
  if (deptCol === -1) missing.push('الإدارة المعنية داخل الإمارة');
  if (missing.length) throw new Error('أعمدة مفقودة في الملف: ' + missing.join('، '));

  const parsed = [];
  let skipped = 0;
  for (let i = 1; i < rawRows.length; i++) {
    const r = rawRows[i];
    const isEmpty = !r || r.every(v => v === undefined || v === null || String(v).trim() === '');
    if (isEmpty) continue;
    const date = parseDateValue(r[dateCol]);
    if (!date) { skipped++; continue; }
    parsed.push({
      id: 'imp_' + i + '_' + Math.random().toString(36).slice(2, 8),
      date: date.toISOString(),
      recipient: normRecipient(r[recipientCol]),
      category: String(r[categoryCol] || '').trim() || 'غير مصنّف',
      status: normStatus(r[statusCol]),
      department: String(r[deptCol] || '').trim() || 'غير محددة',
    });
  }
  if (!parsed.length) throw new Error('لم يتم العثور على صفوف صالحة بعد التنظيف (تحقّق من عمود التاريخ تحديدًا).');
  return { parsed, skipped };
}


const PresentationPage = {
  active: false,
  currentIndex: 0,
  intervalId: null,
  intervalSeconds: 10,
  _keyHandler: null,
  multiOffice: false,
  slides: [],

  /** وضع مكتب واحد: شرائح تصنيفات الصفحة الرئيسية الحالية فقط، كما كانت من قبل. */
  /** يوسّع قائمة المحاور إلى قائمة شرائح فعلية — يقسّم "اللقاءات اليومية" إلى شريحتين
   *  متتاليتين (مؤشرات ثم رسوم بيانية) لأن محتواه يفيض عن حدود شريحة واحدة بلا تمرير،
   *  بخلاف المحاور الأخرى الأخف التي تبقى شريحة واحدة كما هي. */
  _expandCategoriesToSlides(cats, extra) {
    const out = [];
    cats.forEach(c => {
      if (c.key === 'requests') {
        out.push({ ...extra, categoryKey: 'requests', categoryTitle: c.title + ' — المؤشرات', part: 'metrics' });
        out.push({ ...extra, categoryKey: 'requests', categoryTitle: c.title + ' — الرسوم البيانية', part: 'charts' });
      } else {
        out.push({ ...extra, categoryKey: c.key, categoryTitle: c.title });
      }
    });
    return out;
  },

  buildSingleOfficeSlides() {
    const cats = (DashboardPage.categories && DashboardPage.categories.length) ? DashboardPage.categories : DashboardPage.buildBaseCategories();
    return this._expandCategoriesToSlides(cats, { officeKey: null, officeTitle: null, ctx: DashboardPage._ctx });
  },

  /** وضع كل المكاتب: يمرّ على كل مكتب ظاهر، يحسب بياناته مؤقتًا، ويبني شرائحه مع عنوان
   *  المكتب. لا يؤثر على أي جلسة عمل حالية لأن هذا يُستدعى من شاشة الدخول قبل اختيار
   *  مكتب أصلًا — وإن اختار المستخدم مكتبًا بعدها، Workspace.enter() يضبط كل شيء
   *  بشكل صريح بصرف النظر عمّا تركه هذا الاستعراض المؤقت. */
  buildMultiOfficeSlides(year) {
    const slides = [];
    Workspace.visibleOffices().forEach(office => {
      StorageEngine.setWorkspace(office.key);
      DataLayer.init();
      const branchName = DataLayer.getSettings().branchName || office.defaultName;
      const ctx = {
        dash: Analytics.dashboard(year),
        chartData: Analytics.chartsData(year),
        kpis: Analytics.kpis(year),
        year,
        customTotals: Analytics.customCategoryTotals(year)
      };
      const base = DashboardPage.buildBaseCategories();
      const cats = ctx.customTotals.length ? [...base, { key: 'custom', title: 'مؤشرات إضافية' }] : base;
      slides.push(...this._expandCategoriesToSlides(cats, { officeKey: office.key, officeTitle: branchName, ctx }));
    });
    return slides;
  },

  startForOffice() {
    if (!DashboardPage._ctx) return; // لم تُحسَب بيانات لوحة التحكم بعد
    this.multiOffice = false;
    this.slides = this.buildSingleOfficeSlides();
    this._open();
  },

  startForAllOffices(year) {
    this.multiOffice = true;
    this.slides = this.buildMultiOfficeSlides(year || new Date().getFullYear());
    this._open();
  },

  _open() {
    if (!this.slides.length) return;
    this.active = true;
    this.currentIndex = 0;
    document.getElementById('presentationOverlay').classList.remove('hidden');

    // محاولة ملء شاشة حقيقي إن كان مدعومًا — الطبقة المُغطّاة عبر CSS تعمل بصريًا
    // بنفس الشكل حتى لو فشلت هذه المحاولة أو لم تكن مدعومة في متصفحك.
    try {
      const el = document.getElementById('presentationOverlay');
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } catch (e) { /* تجاهل */ }

    this.renderSlide();
    this.play();

    this._keyHandler = (e) => {
      if (e.key === 'ArrowLeft') this.next();
      else if (e.key === 'ArrowRight') this.prev();
      else if (e.key === 'Escape') this.stop();
    };
    document.addEventListener('keydown', this._keyHandler);
  },

  stop() {
    this.active = false;
    this.pause();
    document.getElementById('presentationOverlay').classList.add('hidden');
    if (this._keyHandler) { document.removeEventListener('keydown', this._keyHandler); this._keyHandler = null; }
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* تجاهل */ }
  },

  play() {
    this.pause();
    this.intervalId = setInterval(() => this.next(), this.intervalSeconds * 1000);
    const btn = document.getElementById('presPlayPauseBtn');
    if (btn) btn.textContent = '⏸ إيقاف مؤقت';
  },
  pause() {
    if (this.intervalId) { clearInterval(this.intervalId); this.intervalId = null; }
    const btn = document.getElementById('presPlayPauseBtn');
    if (btn) btn.textContent = '▶ تشغيل';
  },
  togglePlay() { this.intervalId ? this.pause() : this.play(); },

  next() { this.currentIndex = (this.currentIndex + 1) % this.slides.length; this.renderSlide(); },
  prev() { this.currentIndex = (this.currentIndex - 1 + this.slides.length) % this.slides.length; this.renderSlide(); },
  goTo(i) { this.currentIndex = i; this.renderSlide(); },

  changeSpeed(seconds) {
    this.intervalSeconds = seconds;
    if (this.intervalId) this.play(); // إعادة تشغيل المؤقت بالسرعة الجديدة فورًا
  },

  renderSlide() {
    const slide = this.slides[this.currentIndex];
    document.getElementById('presentationSlideTitle').textContent =
      slide.officeTitle ? `${slide.officeTitle} — ${slide.categoryTitle}` : slide.categoryTitle;

    if (this.multiOffice) {
      // تفعيل مكتب هذه الشريحة تحديدًا في DataLayer قبل الرسم، لأن renderCategory
      // يقرأ تسميات المحاور المخصّصة من DataLayer.getTableConfig() مباشرة، ويجب أن
      // تعكس مكتب الشريحة الحالية بالذات لا أي مكتب آخر.
      StorageEngine.setWorkspace(slide.officeKey);
      DataLayer.init();
    }
    DashboardPage._ctx = slide.ctx;
    DashboardPage.renderCategory('presentationSlideBody', slide.categoryKey, slide.part);

    const dots = document.getElementById('presentationDots');
    dots.innerHTML = this.slides.map((s, i) =>
      `<span class="pres-dot ${i === this.currentIndex ? 'active' : ''}" data-i="${i}" title="${s.officeTitle ? s.officeTitle + ' — ' : ''}${s.categoryTitle}"></span>`
    ).join('');
    dots.querySelectorAll('.pres-dot').forEach(d => {
      d.addEventListener('click', () => { this.pause(); this.goTo(+d.dataset.i); });
    });

    this._playSlideTransition();
    this._animateCountUp();
  },

  /** إعادة تشغيل حركة الدخول لكل شريحة جديدة — إزالة الصنف وإعادة إضافته بعد فرض
   *  إعادة رسم (reflow) هي الطريقة القياسية لتكرار نفس حركة CSS من الصفر في كل مرة،
   *  لأن مجرد إبقاء الصنف موجودًا لا يُعيد تشغيل حركة مُشغَّلة أصلًا. */
  _playSlideTransition() {
    const body = document.getElementById('presentationSlideBody');
    body.classList.remove('slide-in');
    void body.offsetWidth;
    body.classList.add('slide-in');
  },

  _animateCountUp() {
    animateCountUp('#presentationSlideBody');
  }
};


/* ===== pages/entry.js ===== */
/**
 * ===== صفحة إدخال البيانات =====
 * لا تحتوي على أي منطق خاص بجدول معيّن — كل شيء مبني على DataLayer.getTableConfig()،
 * لذلك إضافة محور إحصائي جديد مستقبلًا يتم فقط بإضافة إعداده في DataLayer دون
 * لمس هذا الملف إطلاقًا.
 */
const EntryPage = {
  activeTab: 'requests',

  render(container, year) {
    const cfg = DataLayer.getTableConfig();
    const visibleEntries = Object.entries(cfg).filter(([, c]) => !c.hidden);

    if (!visibleEntries.length) {
      container.innerHTML = `<div class="card">جميع محاور الإدخال مخفية حاليًا. أظهر محورًا واحدًا على الأقل من الإعدادات ← الحقول والمؤشرات.</div>`;
      return;
    }
    if (!cfg[this.activeTab] || cfg[this.activeTab].hidden) {
      this.activeTab = visibleEntries.some(([k]) => k === 'requests') ? 'requests' : visibleEntries[0][0];
    }

    container.innerHTML = `<div class="tabs" id="entryTabs"></div><div class="card" id="entryCard"></div>`;
    const tabsEl = document.getElementById('entryTabs');
    tabsEl.innerHTML = visibleEntries.map(([key, m]) =>
      `<button class="tab-btn ${key === this.activeTab ? 'active' : ''}" data-tab="${key}">${m.title}</button>`
    ).join('');
    tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        this.activeTab = btn.dataset.tab;
        tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        this.renderActiveModule(year);
      });
    });
    this.renderActiveModule(year);
  },

  /** يوجّه لمنطق الرسم المناسب — النمط العام لمعظم المحاور، أو منطق مخصّص للمحاور
   *  ذات البنية الغنية (مثل "الطلبات" التي لها حقول متغيّرة العدد لا تناسب النمط
   *  المسطّح العام). */
  renderActiveModule(year) {
    const cfg = DataLayer.getTableConfig()[this.activeTab];
    if (cfg.structured && this.activeTab === 'requests') this.renderRequestsModule(year);
    else this.renderModule(year);
  },

  renderModule(year) {
    const mod = DataLayer.getTableConfig()[this.activeTab];
    const card = document.getElementById('entryCard');
    const depts = DataLayer.listDepartments(true);
    const rows = DataLayer.listRecords(this.activeTab, { year });

    const deptField = mod.hasDept ? `
      <div class="field"><label>الإدارة</label>
        <select id="f_department_id">${depts.map(d => `<option value="${d.id}">${d.name}</option>`).join('') || '<option value="">لا توجد إدارات — أضِف إدارة أولًا</option>'}</select>
      </div>` : '';

    const now = new Date();
    const todayMonth = now.getMonth() + 1, todayYear = now.getFullYear(), todayDay = now.getDate();
    const quickAddDeptField = mod.hasDept ? `
      <div class="field"><label>الإدارة</label>
        <select id="qa_department_id">${depts.map(d => `<option value="${d.id}">${d.name}</option>`).join('') || '<option value="">لا توجد إدارات — أضِف إدارة أولًا</option>'}</select>
      </div>` : '';

    const numberFields = mod.valueFields.filter(f => !mod.fieldTypes[f] || mod.fieldTypes[f] === 'number');
    const textFields = mod.valueFields.filter(f => mod.fieldTypes[f] === 'text');
    // حقول "label" نص بسيط ثابت لكل شهر (لا تجميع تكراري) — مثل "موضوع الجلسة"، الذي
    // يختلف كل مرة لكنه قيمة واحدة توصف ذلك الشهر بالذات، لا قائمة تراكمية. تظهر في
    // نموذج الحفظ الكامل مع الحقول الرقمية (لا في الإضافة السريعة، لأنه لا معنى
    // "لزيادة" نص وصفي تدريجيًا كما تُزاد الأرقام).
    const labelFields = mod.valueFields.filter(f => mod.fieldTypes[f] === 'label');

    // الحقول النصية (مثل "المناسبة": تعزية، عزاء...) تُبنى بمنطق تجميع تكراري، لا رقم
    // واحد يُكتب كل مرة — لذلك تظهر فقط في قسم الإضافة السريعة (تسجيل تكرار واحد في
    // كل مرة)، ولا تظهر في نموذج "كتابة المجموع الشهري كاملًا" لأن لا مجموع واحد لها.
    const textFieldsHtml = textFields.map(f => {
      const existingValues = [...new Set(rows.map(r => (Array.isArray(r[f]) ? r[f] : []).map(t => t.value)).reduce((a,b)=>a.concat(b),[]))];
      return `
        <div class="field">
          <label>${mod.labels[f]}</label>
          <input type="text" id="qa_${f}" list="qa_${f}_list" placeholder="اكتب القيمة، مثل: تعزية">
          <datalist id="qa_${f}_list">${existingValues.map(v => `<option value="${v}">`).join('')}</datalist>
        </div>`;
    }).join('');

    card.innerHTML = `
      <h3 style="margin-top:0">إدخال بيانات: ${mod.title}</h3>

      <div class="card" style="margin-bottom:16px;border:1px solid var(--gold-600)">
        <h3 style="margin-top:0;font-size:14px">➕ إضافة سريعة</h3>
        <p style="color:var(--text-muted);font-size:11.5px;margin-top:0">
          افتراضيًا لليوم الحالي (${todayDay} ${MONTHS[todayMonth - 1]} ${todayYear})، ويمكنك تغيير الشهر/السنة أدناه
          لإضافة بيانات شهر سابق. الحقول الرقمية: أدخل العدد فقط، يُضاف تلقائيًا لمجموع ذلك الشهر.
          ${textFields.length ? ' الحقول النصية: اكتب القيمة (مثل "تعزية")، وتُسجَّل كتكرار واحد يُضاف لعدّاد تلك القيمة ضمن الشهر المختار.' : ''}
        </p>
        <div class="form-grid">
          <div class="field"><label>الشهر</label>
            <select id="qa_month">${MONTHS.map((m, i) => `<option value="${i + 1}" ${i + 1 === todayMonth ? 'selected' : ''}>${m}</option>`).join('')}</select>
          </div>
          <div class="field"><label>السنة</label><input type="number" id="qa_year" value="${todayYear}"></div>
        </div>
        <p style="color:var(--text-muted);font-size:11px;margin-top:-6px">≈ ${hijriLabel(todayYear, todayMonth)} (تقريبي)</p>
        ${quickAddDeptField}
        <div class="form-grid">
          ${numberFields.map(f => `<div class="field"><label>${mod.labels[f]}</label><input type="number" min="0" id="qa_${f}" value="0"></div>`).join('')}
          ${textFieldsHtml}
        </div>
        <button class="btn btn-gold btn-small" id="quickAddBtn" style="margin-top:8px">إضافة لمجموع الشهر المختار</button>
      </div>

      ${(numberFields.length || labelFields.length) ? `
      <div class="form-grid">
        <div class="field"><label>الشهر</label><select id="f_month">${MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('')}</select></div>
        <div class="field"><label>السنة</label><input type="number" id="f_year" value="${year}"></div>
        ${deptField}
        ${labelFields.map(f => `<div class="field"><label>${mod.labels[f]}</label><input type="text" id="f_${f}" placeholder="مثال: التطورات التنموية بالمنطقة"></div>`).join('')}
        ${numberFields.map(f => `<div class="field"><label>${mod.labels[f]}</label><input type="number" min="0" id="f_${f}" value="0"></div>`).join('')}
      </div>
      <button class="btn btn-primary" id="saveEntryBtn">حفظ البيانات</button>
      ` : `<p style="color:var(--text-muted);font-size:12.5px">كل حقول هذا المحور نصية تراكمية — الإدخال يتم فقط عبر "الإضافة السريعة" أعلاه.</p>`}

      <div class="table-wrap" style="margin-top:20px">
        <table>
          <thead><tr>
            <th>الشهر</th><th>السنة</th>${mod.hasDept ? '<th>الإدارة</th>' : ''}
            ${mod.valueFields.map(f => `<th>${mod.labels[f]}</th>`).join('')}<th>إجراءات</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td>${MONTHS[r.month - 1]}</td><td>${r.year}</td>
              ${mod.hasDept ? `<td>${depts.find(d => d.id === r.department_id)?.name || '—'}</td>` : ''}
              ${mod.valueFields.map(f => `<td>${
                mod.fieldTypes[f] === 'text'
                  ? ((Array.isArray(r[f]) ? r[f] : []).map(t => `${t.value} ×${t.count}`).join('، ') || '—')
                  : mod.fieldTypes[f] === 'label'
                    ? (r[f] || '—')
                    : fmtNum(r[f])
              }</td>`).join('')}
              <td><button class="btn btn-ghost btn-small" data-del="${r.id}">حذف</button></td>
            </tr>`).join('') || `<tr><td colspan="10" style="text-align:center;color:var(--text-muted)">لا توجد بيانات مُدخلة بعد لهذا العام</td></tr>`}
          </tbody>
        </table>
      </div>
    `;

    document.getElementById('quickAddBtn').addEventListener('click', () => {
      const keys = { month: +document.getElementById('qa_month').value, year: +document.getElementById('qa_year').value };
      if (mod.hasDept) {
        const depVal = document.getElementById('qa_department_id').value;
        if (!depVal) return toast('يرجى إضافة إدارة أولًا من شاشة الإدارات', true);
        keys.department_id = +depVal;
      }
      const increments = {};
      let hasAny = false;
      numberFields.forEach(f => {
        const v = +document.getElementById(`qa_${f}`).value || 0;
        increments[f] = v;
        if (v > 0) hasAny = true;
      });
