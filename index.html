      </div>

      <div class="card" style="margin-top:16px">
        <h3 style="margin-top:0">اسم هذا المكتب</h3>
        <div class="form-grid">
          <div class="field" style="grid-column:1/-1">
            <label>اسم هذا المكتب تحديدًا</label>
            <input type="text" id="s_branchName" value="${s.branchName || ''}">
          </div>
        </div>
        <p style="color:var(--text-muted);font-size:12.5px;line-height:1.8">
          هذا الاسم خاص بهذا المكتب فقط (لا يؤثر على المكتب الآخر)، ويظهر في الشريط الجانبي وعنوان
          التقارير وبطاقته في شاشة اختيار المكتب.
        </p>
      </div>

      <div class="card" style="margin-top:16px">
        <h3 style="margin-top:0">السنوات</h3>
        <div class="form-grid">
          <div class="field">
            <label>سنة تأسيس هذا المكتب</label>
            <input type="number" id="s_foundingYear" value="${s.foundingYear}">
          </div>
          <div class="field">
            <label>بداية نطاق سنوات التقارير</label>
            <input type="number" id="s_reportYearFrom" value="${s.reportYearFrom}">
          </div>
          <div class="field">
            <label>نهاية نطاق سنوات التقارير</label>
            <input type="number" id="s_reportYearTo" value="${s.reportYearTo}">
          </div>
        </div>
        <p style="color:var(--text-muted);font-size:12.5px;line-height:1.8">
          يُستخدم هذا النطاق في تعبئة قوائم اختيار السنة في الصفحة الرئيسية والتقارير لهذا المكتب تحديدًا.
          "التقرير التراكمي" يستخدم دائمًا أقدم تاريخ فعلي للبيانات أو سنة التأسيس (الأسبق) بغض النظر عن هذا النطاق.
        </p>
      </div>

      <button class="btn btn-primary" id="saveSettingsBtn" style="margin-top:16px">حفظ إعدادات المكتب</button>
    `;

    const orgLogoInput = document.getElementById('s_orgLogoFile');
    if (orgLogoInput) orgLogoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 800 * 1024) toast('حجم الصورة كبير، يُفضّل شعار أصغر من 800 كيلوبايت', true);
      const reader = new FileReader();
      reader.onload = () => {
        const current = StorageEngine.readGlobal() || {};
        StorageEngine.writeGlobal({ ...current, organizationLogo: reader.result });
        toast('تم حفظ الشعار');
        App.refreshBranding();
        App.renderRoute();
      };
      reader.readAsDataURL(file);
    });

    const removeLogoBtn = document.getElementById('removeOrgLogoBtn');
    if (removeLogoBtn) removeLogoBtn.addEventListener('click', () => {
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, organizationLogo: '' });
      toast('تمت إزالة الشعار');
      App.refreshBranding();
      App.renderRoute();
    });

    const saveOrgBtn = document.getElementById('saveOrgBtn');
    if (saveOrgBtn) saveOrgBtn.addEventListener('click', () => {
      const name = document.getElementById('s_orgName').value.trim();
      if (!name) return toast('يرجى إدخال اسم الجهة', true);
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, organizationName: name });
      toast('تم حفظ اسم الجهة');
      App.refreshBranding();
      App.renderRoute();
    });

    const saveNavIconsBtn = document.getElementById('saveNavIconsBtn');
    if (saveNavIconsBtn) saveNavIconsBtn.addEventListener('click', () => {
      const navIcons = {};
      Object.keys(this.navIconLabels).forEach(key => {
        navIcons[key] = document.getElementById(`navicon_${key}`).value.trim() || App.defaultNavIcons[key];
      });
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, navIcons });
      toast('تم حفظ الأيقونات');
      App.refreshBranding();
    });

    document.getElementById('saveVisibilityBtn').addEventListener('click', () => {
      const hidden = Workspace.OFFICES.filter(o => !document.getElementById(`vis_${o.key}`).checked).map(o => o.key);
      if (hidden.length === Workspace.OFFICES.length) {
        return toast('يجب إظهار مكتب واحد على الأقل', true);
      }
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, hiddenOffices: hidden });
      toast('تم حفظ وضع العرض');
      App.refreshBranding();
    });

    const bgUpload = (inputId, field, warnMB) => {
      document.getElementById(inputId).addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > warnMB * 1024 * 1024) toast(`حجم الصورة كبير، يُفضّل أصغر من ${warnMB} ميجابايت`, true);
        const reader = new FileReader();
        reader.onload = () => {
          const current = StorageEngine.readGlobal() || {};
          StorageEngine.writeGlobal({ ...current, [field]: reader.result });
          toast('تم حفظ الخلفية');
          App.renderRoute();
        };
        reader.readAsDataURL(file);
      });
    };
    bgUpload('s_bgPortraitFile', 'reportBackgroundPortrait', 1.5);
    bgUpload('s_bgLandscapeFile', 'reportBackgroundLandscape', 1.5);
    bgUpload('s_cardBgFile', 'landingCardBackground', 1.5);
    bgUpload('s_coverBackgroundFile', 'coverBackground', 2);

    const removePortraitBtn = document.getElementById('removeBgPortraitBtn');
    if (removePortraitBtn) removePortraitBtn.addEventListener('click', () => {
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, reportBackgroundPortrait: '' });
      toast('تمت إزالة الخلفية العمودية');
      App.renderRoute();
    });
    const removeLandscapeBtn = document.getElementById('removeBgLandscapeBtn');
    if (removeLandscapeBtn) removeLandscapeBtn.addEventListener('click', () => {
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, reportBackgroundLandscape: '' });
      toast('تمت إزالة الخلفية الأفقية');
      App.renderRoute();
    });
    const removeCardBgBtn = document.getElementById('removeCardBgBtn');
    if (removeCardBgBtn) removeCardBgBtn.addEventListener('click', () => {
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, landingCardBackground: '' });
      toast('تمت إزالة خلفية البطاقات');
      App.renderRoute();
    });

    const removeCoverBackgroundBtn = document.getElementById('removeCoverBackgroundBtn');
    if (removeCoverBackgroundBtn) removeCoverBackgroundBtn.addEventListener('click', () => {
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, coverBackground: '' });
      toast('تمت إزالة خلفية الغلاف');
      App.renderRoute();
    });

    const coverFontSizeInput = document.getElementById('s_coverTitleFontSize');
    if (coverFontSizeInput) coverFontSizeInput.addEventListener('change', () => {
      const size = Math.max(20, Math.min(120, +coverFontSizeInput.value || 64));
      const current = StorageEngine.readGlobal() || {};
      StorageEngine.writeGlobal({ ...current, coverTitleFontSize: size });
      toast('تم حفظ حجم خط العنوان');
    });

    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
      const patch = {
        branchName: document.getElementById('s_branchName').value.trim() || 'مكتب بلا اسم',
        foundingYear: +document.getElementById('s_foundingYear').value,
        reportYearFrom: +document.getElementById('s_reportYearFrom').value,
        reportYearTo: +document.getElementById('s_reportYearTo').value
      };
      if (patch.reportYearFrom > patch.reportYearTo) {
        return toast('بداية نطاق السنوات يجب أن تكون قبل نهايته', true);
      }
      DataLayer.updateSettings(patch);
      toast('تم حفظ الإعدادات');
      App.refreshBranding();
      App.setupYearSelect();
      App.renderRoute();
    });
  },

  renderFields(container) {
    const cfg = DataLayer.getTableConfig();
    const coreEntries = Object.entries(cfg).filter(([, c]) => c.isCore);
    const customCats = DataLayer.listCustomCategories();

    const coreRow = ([key, c]) => `
      <div class="card" style="margin-bottom:12px">
        <div class="form-grid">
          <div class="field"><label>اسم المحور (${key === 'requests' ? 'أساسي — الطلبات' : 'أساسي'})</label>
            <input type="text" id="cat_title_${key}" value="${c.title}">
          </div>
          ${c.valueFields.map(f => `
            <div class="field"><label>تسمية حقل: ${c.labels[f]}</label>
              <input type="text" id="cat_field_${key}_${f}" value="${c.labels[f]}">
            </div>`).join('')}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-small" data-save-core="${key}">حفظ تسميات هذا المحور</button>
          <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted)">
            <input type="checkbox" data-visibility="${key}" ${c.hidden ? '' : 'checked'}> إظهار في إدخال البيانات
          </label>
        </div>
        ${Workspace.otherOfficeCheckbox('core_' + key)}
      </div>
    `;

    const customRow = (c) => `
      <div class="card" style="margin-bottom:12px">
        <div class="form-grid">
          <div class="field"><label>اسم المحور (مخصّص)</label>
            <input type="text" id="cat_title_${c.key}" value="${c.title}">
          </div>
          ${c.valueFields.map(f => `
            <div class="field"><label>تسمية حقل: ${f.label}</label>
              <input type="text" id="cat_field_${c.key}_${f.key}" value="${f.label}">
            </div>`).join('')}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-small" data-save-custom="${c.key}">حفظ التعديلات</button>
            <button class="btn btn-danger btn-small" data-delete-custom="${c.key}">حذف المحور نهائيًا</button>
          </div>
          <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted)">
            <input type="checkbox" data-visibility="${c.key}" ${c.hidden ? '' : 'checked'}> إظهار في إدخال البيانات
          </label>
        </div>
      </div>
    `;

    container.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0">المحاور الأساسية</h3>
        <p style="color:var(--text-muted);font-size:12.5px;line-height:1.8">
          يمكنك تغيير الاسم الظاهر لأي محور من هذه المحاور الستة وتسميات حقوله، دون أي تأثير
          على البيانات المُدخلة سابقًا. هذه المحاور لا يمكن حذفها لأن لوحة التحكم والتقارير
          مبنية عليها بنيويًا (خصوصًا "الطلبات" المرتبطة بالإدارات ونسبة الإنجاز).
        </p>
      </div>
      ${coreEntries.map(coreRow).join('')}

      <div class="card" style="margin-top:8px">
        <h3 style="margin-top:0">المحاور المخصّصة</h3>
        <p style="color:var(--text-muted);font-size:12.5px;line-height:1.8">
          محاور تُضيفها بنفسك بالكامل — تظهر تلقائيًا كتبويب في "إدخال البيانات"، وكبطاقات
          ضمن "مؤشرات إضافية" في الصفحة الرئيسية والتقارير.
        </p>
      </div>
      ${customCats.map(customRow).join('') || '<p style="color:var(--text-muted)">لا توجد محاور مخصّصة بعد.</p>'}

      <div class="card" style="margin-top:8px">
        <h3 style="margin-top:0">إضافة محور جديد</h3>
        <div class="form-grid">
          <div class="field"><label>اسم المحور</label><input type="text" id="newCatTitle" placeholder="مثال: الشكاوى"></div>
          <div class="field">
            <label>اسم الحقل الأول</label>
            <input type="text" id="newCatField1" placeholder="مثال: عدد الشكاوى">
            <select id="newCatField1Type" style="margin-top:6px">
              <option value="number">رقم (يُجمع كإجمالي شهري)</option>
              <option value="text">نص متكرر (يُحصى كل قيمة على حدة، مثل "المناسبة")</option>
            </select>
          </div>
          <div class="field">
            <label>اسم الحقل الثاني (اختياري)</label>
            <input type="text" id="newCatField2" placeholder="اتركه فارغًا إذا لم تحتجه">
            <select id="newCatField2Type" style="margin-top:6px">
              <option value="number">رقم (يُجمع كإجمالي شهري)</option>
              <option value="text">نص متكرر (يُحصى كل قيمة على حدة)</option>
            </select>
          </div>
        </div>
        ${Workspace.otherOfficeCheckbox('newCat')}
        <button class="btn btn-primary" id="addCategoryBtn" style="margin-top:8px">إضافة المحور</button>
      </div>
    `;

    container.querySelectorAll('[data-save-core]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.saveCore;
        const c = cfg[key];
        const title = document.getElementById(`cat_title_${key}`).value.trim();
        const fieldLabels = {};
        c.valueFields.forEach(f => { fieldLabels[f] = document.getElementById(`cat_field_${key}_${f}`).value.trim(); });
        DataLayer.renameCoreCategory(key, { title, fieldLabels });
        const applyBoth = document.getElementById(`other_office_core_${key}`)?.checked;
        if (applyBoth) Workspace.applyToOtherOffice(() => DataLayer.renameCoreCategory(key, { title, fieldLabels }));
        toast('تم حفظ التسميات' + (applyBoth ? ' في المكتبين' : ''));
        App.renderRoute();
      });
    });

    container.querySelectorAll('[data-save-custom]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.saveCustom;
        const c = cfg[key];
        const title = document.getElementById(`cat_title_${key}`).value.trim();
        const fieldLabels = {};
        c.valueFields.forEach(f => { fieldLabels[f] = document.getElementById(`cat_field_${key}_${f}`).value.trim(); });
        try {
          DataLayer.updateCustomCategory(key, { title, fieldLabels });
          toast('تم حفظ التعديلات');
          App.renderRoute();
        } catch (e) { toast(e.message, true); }
      });
    });

    container.querySelectorAll('[data-delete-custom]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('سيتم حذف هذا المحور وكل بياناته المُدخلة نهائيًا. هل أنت متأكد؟')) return;
        try {
          DataLayer.deleteCustomCategory(btn.dataset.deleteCustom);
          toast('تم حذف المحور');
          App.renderRoute();
        } catch (e) { toast(e.message, true); }
      });
    });

    container.querySelectorAll('[data-visibility]').forEach(cb => {
      cb.addEventListener('change', () => {
        try {
          DataLayer.setCategoryVisibility(cb.dataset.visibility, !cb.checked);
          toast(cb.checked ? 'أصبح المحور ظاهرًا في إدخال البيانات' : 'أصبح المحور مخفيًا في إدخال البيانات');
        } catch (e) { toast(e.message, true); }
      });
    });

    document.getElementById('addCategoryBtn').addEventListener('click', () => {
      const title = document.getElementById('newCatTitle').value;
      const f1 = document.getElementById('newCatField1').value;
      const f1Type = document.getElementById('newCatField1Type').value;
      const f2 = document.getElementById('newCatField2').value;
      const f2Type = document.getElementById('newCatField2Type').value;
      const fields = [{ label: f1, type: f1Type }, { label: f2, type: f2Type }];
      try {
        DataLayer.addCustomCategory(title, fields);
        const applyBoth = document.getElementById('other_office_newCat')?.checked;
        if (applyBoth) Workspace.applyToOtherOffice(() => DataLayer.addCustomCategory(title, fields));
        toast('تمت إضافة المحور' + (applyBoth ? ' في المكتبين' : '') + ' — يظهر الآن كتبويب في إدخال البيانات');
        App.renderRoute();
      } catch (e) { toast(e.message, true); }
    });
  },

  permissionDefs: [
    { key: 'settings_general', label: 'الإعدادات العامة (اسم المكتب، السنوات، الظهور)' },
    { key: 'settings_fields', label: 'الحقول والمؤشرات' },
    { key: 'settings_departments', label: 'إدارة الإدارات' },
    { key: 'settings_health', label: 'سلامة البيانات' },
    { key: 'settings_backup', label: 'النسخ الاحتياطي' },
    { key: 'about_edit', label: 'تعديل صفحة "عن المكتب"' }
  ],

  renderUsers(container) {
    const auth = Auth.getAuth();
    const roleCard = (role, title, note) => {
      const acc = auth[role];
      const permsHtml = role === 'admin' ? `<p style="color:var(--text-muted);font-size:12.5px">صلاحيات كاملة دائمًا — لا يمكن تقييدها.</p>` : `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0">
          ${this.permissionDefs.map(p => `
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px">
              <input type="checkbox" data-perm="${role}:${p.key}" ${acc.permissions && acc.permissions[p.key] ? 'checked' : ''}> ${p.label}
            </label>
          `).join('')}
        </div>
        <p style="color:var(--text-muted);font-size:11.5px">صلاحيتا "إدخال البيانات" و"التقارير" متاحتان دائمًا لهذا المستوى، وهوية الجهة (الاسم والشعار) تبقى حكرًا على مسؤول النظام دائمًا.</p>
      `;

      const expiryHtml = role === 'admin' ? '' : (() => {
        const isExpired = Auth.isExpired(acc);
        const isDisabled = acc.enabled === false;
        let statusBadge = '';
        if (isDisabled) statusBadge = '<span style="background:var(--danger);color:#fff;padding:2px 8px;border-radius:20px;font-size:11px">معطَّل حاليًا</span>';
        else if (isExpired) statusBadge = '<span style="background:var(--danger);color:#fff;padding:2px 8px;border-radius:20px;font-size:11px">منتهي الصلاحية</span>';
        else if (acc.expiresAt) statusBadge = `<span style="background:var(--green-100);color:var(--green-800);padding:2px 8px;border-radius:20px;font-size:11px">فعّال حتى ${acc.expiresAt}</span>`;
        else statusBadge = '<span style="background:var(--green-100);color:var(--green-800);padding:2px 8px;border-radius:20px;font-size:11px">فعّال دائم</span>';
        return `
          <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
              <strong style="font-size:12.5px">حالة الحساب:</strong> ${statusBadge}
            </div>
            <div class="form-grid">
              <div class="field">
                <label style="display:flex;align-items:center;gap:6px">
                  <input type="checkbox" id="u_${role}_enabled" ${acc.enabled === false ? '' : 'checked'}> الحساب مفعّل
                </label>
              </div>
              <div class="field">
                <label>تاريخ انتهاء الصلاحية (اختياري — لحساب مؤقت)</label>
                <input type="date" id="u_${role}_expiresAt" value="${acc.expiresAt || ''}">
              </div>
            </div>
            <p style="color:var(--text-muted);font-size:11px;margin-top:6px">
              اترك التاريخ فارغًا لحساب دائم بلا انتهاء. بعد هذا التاريخ لن يتمكن هذا الحساب من تسجيل الدخول
              حتى تُمدِّد التاريخ أو تحذفه من هنا. يمكنك أيضًا تعطيله فورًا يدويًا بإلغاء "الحساب مفعّل" أعلاه.
            </p>
          </div>
        `;
      })();

      return `
        <div class="card" style="margin-bottom:16px">
          <h3 style="margin-top:0">${title}</h3>
          <p style="color:var(--text-muted);font-size:12.5px">${note}</p>
          <div class="form-grid">
            <div class="field"><label>اسم المستخدم</label><input type="text" id="u_${role}_username" value="${acc.username}"></div>
            <div class="field"><label>كلمة مرور جديدة (اتركها فارغة للإبقاء على الحالية)</label><input type="password" id="u_${role}_password" placeholder="••••••••"></div>
          </div>
          ${permsHtml}
          ${expiryHtml}
          <button class="btn btn-primary btn-small" data-save-role="${role}" style="margin-top:12px">حفظ ${title}</button>
        </div>
      `;
    };

    container.innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <p style="color:var(--text-muted);font-size:12.5px;line-height:1.9;margin:0">
          ⚠️ تنبيه: هذا فصل استخدام بسيط بين ثلاثة مستويات لمنع التعديل العرضي بين من يشاركون
          هذا الجهاز — وليس حماية أمنية حقيقية، لأن النظام يعمل بالكامل محليًا دون خادم.
          لا تعتمد عليه لحماية معلومات حساسة فعليًا.
        </p>
      </div>
      ${roleCard('admin', 'مسؤول النظام', 'تحكم كامل بلا استثناء.')}
      ${roleCard('supervisor', 'مشرف', 'إدخال بيانات وتقارير، مع صلاحيات إعدادات محدودة قابلة للتعديل أدناه (باستثناء هوية الجهة دائمًا).')}
      ${roleCard('employee', 'موظف', 'إدخال بيانات وطباعة تقارير كحد أساسي، ويمكن منحه صلاحيات إضافية أدناه.')}
    `;

    container.querySelectorAll('[data-save-role]').forEach(btn => {
      btn.addEventListener('click', () => {
        const role = btn.dataset.saveRole;
        const username = document.getElementById(`u_${role}_username`).value;
        const password = document.getElementById(`u_${role}_password`).value;
        try {
          Auth.updateRoleCredentials(role, { username, password });
          if (role !== 'admin') {
            const perms = {};
            this.permissionDefs.forEach(p => {
              const cb = container.querySelector(`[data-perm="${role}:${p.key}"]`);
              perms[p.key] = !!cb.checked;
            });
            Auth.updateRolePermissions(role, perms);
            const enabled = document.getElementById(`u_${role}_enabled`).checked;

        } catch (e) { toast(e.message, true); }
      });

  },

  renderAbout(container) {

        <p style="color:var(--text-muted);font-size:12.5px;margin-top:0">
          هذا المحتوى يظهر في صفحة "عن المكتب" التي يراها الجميع للعرض فقط — التعديل من هنا حصرًا.
          <strong>محتوى مشترك بين المكتبين</strong> (وليس خاصًا بكل مكتب على حدة).
        </p>
        <div class="field">
          <label>نبذة تعريفية</label>
          ${RTE.toolbarHtml('about_intro')}
          <div id="about_intro" class="rte-box" contenteditable="true">${g.aboutIntro || ''}</div>
        </div>
        <button class="btn btn-primary" id="saveAboutBtn" style="margin-top:16px">حفظ</button>

    `;
    let draftIntro = g.aboutIntro || '';
    RTE.wire('about_intro', (html) => { draftIntro = html; });
    document.getElementById('saveAboutBtn').addEventListener('click', () => {
      const current = StorageEngine.readGlobal() || {};

  },

  renderProcGuide(container) {
    const g = StorageEngine.readGlobal() || {};
    const titles = g.procGuideFieldTitles || {};
    container.innerHTML = `
      <div class="card">
        <p style="color:var(--text-muted);font-size:12.5px;margin-top:0">
          <strong>محتوى مشترك بين المكتبين</strong> (وليس خاصًا بكل مكتب على حدة).
          خلفية الغلاف الخارجي أصبحت مشتركة أيضًا مع التقارير — تُدار من الإعدادات ← عام.
        </p>
        <h3 style="margin-top:0">محتوى دليل الإجراءات</h3>
        <p style="color:var(--text-muted);font-size:12.5px;line-height:1.8">
          هذا المحتوى يظهر في صفحة "دليل الإجراءات" المستقلة في القائمة الجانبية. يمكنك إعادة
          تسمية عنوان أي حقل ليناسب احتياجك (تمامًا كتسميات حقول إدخال البيانات)، والمستخدم
          يختار بنفسه أي الحقول يطبعها عند التصدير.
        </p>
        ${ProceduresPage.fields.map(f => `
          <div class="field" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border)">
            <label>عنوان الحقل</label>
            <input type="text" id="procTitle_${f.key}" value="${titles[f.key] || f.defaultTitle}">
            <label style="margin-top:10px;display:block">المحتوى</label>
            ${RTE.toolbarHtml('procContent_' + f.key, { table: f.key === 'content' })}
            <div id="procContent_${f.key}" class="rte-box" contenteditable="true">${g['procGuide_' + f.key] || ''}</div>
          </div>
        `).join('')}
        <button class="btn btn-primary" id="saveProcBtn" style="margin-top:18px">حفظ دليل الإجراءات</button>
      </div>

    const draft = {};
    ProceduresPage.fields.forEach(f => {

/* ===== pages/backup.js ===== */
/**
 * ===== صفحة النسخ الاحتياطي والاستعادة =====
 */
const BackupPage = {
  _inspected: null, // نتيجة فحص آخر ملف اختير، قبل التنفيذ الفعلي

  render(container) {
    const s = DataLayer.getSettings();
    const history = DataLayer.listBackupHistory();
    container.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0">تنبيه هام حول التخزين</h3>
        <p style="color:var(--text-muted);line-height:1.9">
          يحفظ النظام بياناتك تلقائيًا داخل هذا المتصفح على هذا الجهاز فقط (لا يُرسل أي شيء إلى الإنترنت).
          يُنصح بشدة بأخذ نسخة احتياطية بشكل دوري — أسبوعيًا على الأقل — وحفظها في مكان آمن خارج الجهاز.
          آخر نسخة احتياطية: <strong>${fmtDateTime(s.lastBackupAt)}</strong>
        </p>
      </div>

      <div class="card" style="margin-top:16px">
        <h3 style="margin-top:0">إنشاء نسخة احتياطية</h3>
        <p style="color:var(--text-muted);font-size:12.5px">اختر نوع النسخة المناسب لحاجتك.</p>
        <div class="form-grid">
          <button class="btn btn-primary" id="backupFullBtn">نسخة كاملة (كل شيء)</button>
          <button class="btn btn-ghost" id="backupStatsBtn">الإحصاءات فقط</button>
          <button class="btn btn-ghost" id="backupSettingsBtn">الإعدادات فقط</button>
          <button class="btn btn-ghost" id="backupMediaBtn">الوسائط فقط (الشعار والخلفيات)</button>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <h3 style="margin-top:0">استيراد نسخة احتياطية</h3>
        <input type="file" id="importFile" accept=".json">
        <div id="inspectResult" style="margin-top:14px"></div>
      </div>

      ${history.length ? `
      <div class="card" style="margin-top:16px">
        <h3 style="margin-top:0">سجل النسخ الاحتياطية (آخر ١٠)</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>التاريخ</th><th>النوع</th><th>السجلات</th><th>الحجم</th><th>إجراءات</th></tr></thead>
            <tbody>
              ${history.map(b => `<tr>
                <td>${fmtDateTime(b.createdAt)}</td>
                <td>${{ full: 'كاملة', stats: 'إحصاءات', settings: 'إعدادات', media: 'وسائط' }[b.backupType] || b.backupType}</td>
                <td>${(b.recordCount === undefined || b.recordCount === null) ? '—' : b.recordCount}</td>
                <td>${b.sizeKB} كيلوبايت</td>
                <td>
                  <button class="btn btn-ghost btn-small" data-redownload="${b.id}">تنزيل</button>
                  <button class="btn btn-ghost btn-small" data-delhist="${b.id}">حذف</button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>` : ''}

      ${Auth.isAdmin() ? `
      <div class="card" style="margin-top:16px">
        <h3 style="margin-top:0">إعادة تعيين النظام بالكامل</h3>
        <p style="color:var(--text-muted)">يحذف كل البيانات المحلية ويعيد النظام إلى حالته الافتراضية. متاح لمسؤول النظام فقط.</p>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px">
          <input type="checkbox" id="backupBeforeReset" checked>
          تنزيل نسخة احتياطية تلقائيًا قبل الحذف (موصى به)
        </label>
        <button class="btn btn-danger" id="resetBtn">تصفير جميع البيانات</button>
      </div>
      ` : ''}
    `;

    document.getElementById('backupFullBtn').addEventListener('click', () => this.downloadBackup('full'));
    document.getElementById('backupStatsBtn').addEventListener('click', () => this.downloadBackup('stats'));
    document.getElementById('backupSettingsBtn').addEventListener('click', () => this.downloadBackup('settings'));
    document.getElementById('backupMediaBtn').addEventListener('click', () => this.downloadBackup('media'));

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const box = document.getElementById('inspectResult');
      if (!file) { box.innerHTML = ''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          this._inspected = DataLayer.inspectBackupFile(reader.result);
          this._inspectedText = reader.result;
          this.renderInspectSummary(box);
        } catch (err) {
          this._inspected = null;
          box.innerHTML = `<p style="color:var(--danger)">تعذّر قبول الملف: ${err.message}</p>`;
        }
      };
      reader.onerror = () => { box.innerHTML = '<p style="color:var(--danger)">تعذّرت قراءة الملف</p>'; };
      reader.readAsText(file, 'utf-8');
    });

    container.querySelectorAll('[data-redownload]').forEach(btn => {
      btn.addEventListener('click', () => {
        const entry = history.find(b => b.id === btn.dataset.redownload);
        if (entry) this._triggerDownload(entry.content, entry.filename);
      });
    });
    container.querySelectorAll('[data-delhist]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('حذف هذه النسخة من السجل؟ (هذا لا يحذف أي نسخة نزّلتها بالفعل لجهازك)')) return;
        DataLayer.deleteBackupHistoryEntry(btn.dataset.delhist);
        this.render(container);
      });
    });

    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) resetBtn.addEventListener('click', () => {
      if (!confirm('سيتم حذف جميع البيانات نهائيًا من هذا المتصفح. هل أنت متأكد؟')) return;
      if (!confirm('تأكيد أخير: لا يمكن التراجع عن هذا الإجراء إلا باستيراد نسخة احتياطية سابقة. متابعة؟')) return;
      if (document.getElementById('backupBeforeReset').checked) this.downloadBackup('full');
      DataLayer.resetAll();
      toast('تمت إعادة تعيين النظام');
      App.refreshBranding();
      App.setupYearSelect();
      App.renderRoute();
    });
  },

  /** يعرض ملخص الملف المُختار (تاريخ الإنشاء، النوع، عدد السجلات، الحجم) مع خيارات
   *  وضع الاستيراد الثلاثة — قبل أي تنفيذ فعلي على البيانات. */
  // مسميات "متلقي الطلب" في نظام تسجيل الطلبات تختلف عن أسماء المكاتب هنا رغم أنها
  // تشير لنفس الجهة فعليًا — هذا الجدول يربط بينهما حتى لا يُعتبَر التطابق الصحيح
  // "عدم تطابق" خطأً بسبب اختلاف التسمية فقط لا المضمون.
  RECEIVER_TO_OFFICE_SYNONYMS: {
    'أمير المنطقة': 'مكتب سمو الأمير',
    'نائب أمير المنطقة': 'مكتب سمو النائب'
  },

  renderInspectSummary(box) {
    const i = this._inspected;
    const receiverLabel = i.parsed && i.parsed.receiverLabel ? i.parsed.receiverLabel : null;
    const currentBranchName = (DataLayer.getSettings().branchName || '').trim();
    let officeMatchHtml = '';
    if (receiverLabel) {
      const norm = s => (s || '').replace(/\s+/g, ' ').trim();
      const equivalentName = this.RECEIVER_TO_OFFICE_SYNONYMS[receiverLabel] || receiverLabel;
      const matches = currentBranchName && (norm(currentBranchName) === norm(receiverLabel) || norm(currentBranchName) === norm(equivalentName));
      if (!currentBranchName) {
        officeMatchHtml = `<div class="card" style="background:#FFF7E6;border:1px solid var(--gold-600);margin-bottom:12px">
          <p style="margin:0;font-size:13px">⚠ هذا الملف مُصدَّر خصيصًا لمكتب <strong>"${equivalentName}"</strong> (متلقي الطلب "${receiverLabel}" في نظام تسجيل الطلبات)، لكن المكتب المفتوح حاليًا هنا <strong>بلا اسم مُحدَّد</strong>. تأكد أنك في المكتب الصحيح قبل المتابعة، أو سمِّ هذا المكتب من الإعدادات ← عام أولًا.</p>
        </div>`;
      } else if (!matches) {
        officeMatchHtml = `<div class="card" style="background:#FDECEC;border:1px solid var(--danger);margin-bottom:12px">
          <p style="margin:0;font-size:13px">⛔ <strong>تنبيه عدم تطابق:</strong> هذا الملف مُصدَّر خصيصًا لمكتب <strong>"${equivalentName}"</strong> (متلقي الطلب "${receiverLabel}")، بينما المكتب المفتوح حاليًا هو <strong>"${currentBranchName}"</strong>. استيراده هنا سيخلط بيانات مكتبين مختلفين. تأكد أنك اخترت المكتب الصحيح من الصفحة الرئيسية قبل الاستيراد.</p>
        </div>`;
      } else {
        officeMatchHtml = `<div class="card" style="background:#EAF6EE;border:1px solid var(--success);margin-bottom:12px">
          <p style="margin:0;font-size:13px">✅ هذا الملف مُصدَّر خصيصًا لمكتب <strong>"${equivalentName}"</strong> (متلقي الطلب "${receiverLabel}")، ويطابق المكتب المفتوح حاليًا. آمن للاستيراد.</p>
        </div>`;
      }
    }
    box.innerHTML = `
      ${officeMatchHtml}
      <div class="card" style="background:var(--surface-2);margin-top:0">
        <div class="kpi-grid">
          <div class="kpi-item"><div class="kv">${{ full: 'كاملة', stats: 'إحصاءات', settings: 'إعدادات', media: 'وسائط' }[i.backupType] || i.backupType}</div><div class="kl">نوع النسخة</div></div>
          <div class="kpi-item"><div class="kv">${i.createdAt ? fmtDateTime(i.createdAt) : '—'}</div><div class="kl">تاريخ الإنشاء</div></div>
          <div class="kpi-item"><div class="kv">${i.recordCount}</div><div class="kl">عدد السجلات</div></div>
          <div class="kpi-item"><div class="kv">${i.sizeKB} ك.ب</div><div class="kl">حجم الملف</div></div>
        </div>
        ${i.isLegacy ? `<p style="color:var(--gold-600);font-size:12px;margin-top:10px">⚠ ملف من إصدار قديم للنظام — سيُقبل، لكن بعض البيانات الوصفية غير متوفرة فيه.</p>` : ''}

        <div style="margin-top:16px">
          <label style="display:block;margin-bottom:8px">طريقة الاستيراد</label>
          <label style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:13px">
            <input type="radio" name="importMode" value="merge" checked style="margin-top:3px">
            <span><strong>دمج (الافتراضي الآمن)</strong> — يضيف السجلات غير الموجودة فقط، لا يمسّ أي سجل حالي إطلاقًا.</span>
          </label>
          <label style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:13px">
            <input type="radio" name="importMode" value="update" style="margin-top:3px">
            <span><strong>تحديث</strong> — يستبدل قيمة أي شهر مشترك بمحتوى النسخة، ويضيف الأشهر الجديدة، دون حذف أي شيء آخر.</span>
          </label>
          <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px">
            <input type="radio" name="importMode" value="replace" style="margin-top:3px">
            <span><strong>استبدال كامل</strong> — يحذف كل البيانات الحالية ويستبدلها بمحتوى النسخة بلا استثناء.</span>
          </label>
        </div>
        <button class="btn btn-primary" id="confirmImportBtn" style="margin-top:14px">تنفيذ الاستيراد</button>
      </div>
    `;
    document.getElementById('confirmImportBtn').addEventListener('click', () => this.executeImport());
  },

  executeImport() {
    const mode = document.querySelector('input[name="importMode"]:checked').value;
    if (mode === 'replace') {
      if (!confirm('سيتم حذف جميع البيانات الحالية واستبدالها بمحتويات النسخة الاحتياطية. لا يمكن التراجع عن هذه العملية. هل تريد المتابعة؟')) return;
      this.downloadBackup('full');
    }
    try {
      const report = DataLayer.importBackup(this._inspectedText, mode);
      this.renderImportReport(report);
      App.refreshBranding();
      App.setupYearSelect();
      App.renderRoute();
    } catch (err) {
      toast('فشل الاستيراد: ' + err.message, true);
    }
  },

  renderImportReport(report) {
    const modeLabel = { merge: 'دمج', update: 'تحديث', replace: 'استبدال كامل' }[report.mode];
    const lines = [
      `تم الاستيراد بنجاح (${modeLabel})`,
      `أُضيف: ${report.added} سجلًا جديدًا`,
      `حُدِّث: ${report.updated} سجلًا`,
      `تُجوهل: ${report.skipped} سجلًا (موجود مسبقًا)`,
      report.errors ? `أخطاء: ${report.errors}` : null,
      `المدة: ${report.durationMs} مللي ثانية`
    ].filter(Boolean);
    toast(lines.join(' — '));
  },

  _triggerDownload(content, filename) {
    const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  },

  downloadBackup(type = 'full') {
    const json = DataLayer.exportBackup(type);
    const stamp = new Date().toISOString().slice(0, 10);
    const label = { full: 'كاملة', stats: 'إحصاءات', settings: 'إعدادات', media: 'وسائط' }[type];
    this._triggerDownload(json, `نسخة-احتياطية-${label}_${stamp}.json`);
    toast('تم تنزيل النسخة الاحتياطية');
  }
};

        <div class="table-wrap"><table>

            ${log.map(l => `<tr><td>${fmtDateTime(l.ts)}</td><td>${ACTION_LABELS[l.action] || l.action}</td><td>${l.description}</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">لا يوجد نشاط مسجّل بعد</td></tr>'}
          </tbody>
        </table></div>
      </div>
    `;
  }

/* ===== pages/about.js ===== */
/**
 * ===== صفحة عن المكتب =====
 * صفحة عرض فقط بحقل واحد ("نبذة تعريفية"). التعديل حصرًا من الإعدادات ← عن المكتب.
 * قابلة للطباعة/التصدير PDF بنفس آلية التقارير (الترويسة، القالب، الهوامش).
 * محتواها مشترك بين المكتبين (مخزَّن في الإعدادات العامة)، وليس خاصًا بكل مكتب على حدة.
 */
const AboutPage = {
  includeCover: false,

  render(container) {
    const g = StorageEngine.readGlobal() || {};
    ReportsPage.includeCover = this.includeCover;
    container.innerHTML = `
      ${ReportsPage.coverHtml('aboutCover', 'عن المكتب', '', '')}
      <div id="printArea">
        ${ReportsPage.reportHeader('عن المكتب', false)}
        <div class="card">
          <h3 style="margin-top:0">نبذة تعريفية</h3>
          <div>${g.aboutIntro || `<span style="color:var(--text-muted)">لم يُضَف محتوى بعد.</span>`}</div>
        </div>
      </div>
      <div class="no-print card" style="margin-top:18px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px">
          <input type="checkbox" id="aboutIncludeCover" ${this.includeCover ? 'checked' : ''}> إرفاق غلاف خارجي
        </label>
        <div id="aboutCoverOptions" style="display:${this.includeCover ? 'grid' : 'none'};margin-top:10px" class="form-grid">
          ${this.includeCover ? ReportsPage.coverOptionsHtml('aboutCover', 'عن المكتب', '', '') : ''}
        </div>
      </div>
      <div class="no-print" style="margin-top:18px">
        <button class="btn btn-gold" id="printAboutBtn">تصدير PDF (طباعة)</button>
      </div>
    `;
    document.getElementById('aboutIncludeCover').addEventListener('change', (e) => {
      this.includeCover = e.target.checked;

    });
    document.getElementById('printAboutBtn').addEventListener('click', () => {
      this.render(container); // يضمن أن الغلاف يعكس آخر عنوان/فترة كتبها المستخدم قبل الطباعة مباشرة
      ReportsPage.printToPdf('عن المكتب');
    });
  }
};

/**
 * ===== صفحة دليل الإجراءات =====
 * صفحة مستقلة بستة حقول (المقدمة/الرؤية/الرسالة/الأهداف/المحتوى/الخاتمة)، عناوينها
 * قابلة لإعادة التسمية من الإعدادات (نفس أسلوب تسميات حقول محاور إدخال البيانات).
 * الطباعة انتقائية بالكامل: يختار المستخدم أي الحقول يريد تضمينها في النسخة المطبوعة،
 * من حقل واحد فقط إلى الستة كاملة — بنفس أسلوب اختيار المؤشرات في التقارير تمامًا.
 */
const ProceduresPage = {
  fields: [
    { key: 'intro', defaultTitle: 'المقدمة' },
    { key: 'vision', defaultTitle: 'الرؤية' },
    { key: 'mission', defaultTitle: 'الرسالة' },
    { key: 'goals', defaultTitle: 'الأهداف' },
    { key: 'content', defaultTitle: 'المحتوى' },
    { key: 'conclusion', defaultTitle: 'الخاتمة' }
  ],
  // اختيار الطباعة مؤقت لجلسة العمل الحالية (لا يُحفظ) — كل الحقول مختارة افتراضيًا
  selectedFields: new Set(['intro', 'vision', 'mission', 'goals', 'content', 'conclusion']),
  includeCover: false,

  fieldTitle(key) {
    const g = StorageEngine.readGlobal() || {};
    const titles = g.procGuideFieldTitles || {};
    return titles[key] || this.fields.find(f => f.key === key).defaultTitle;
  },
  fieldContent(key) {
    const g = StorageEngine.readGlobal() || {};
    return g['procGuide_' + key] || '';
  },

  render(container) {
    const chosen = this.fields.filter(f => this.selectedFields.has(f.key));
    ReportsPage.includeCover = this.includeCover;
    container.innerHTML = `
      ${ReportsPage.coverHtml('procCover', 'دليل الإجراءات', '', '')}
      <div id="printArea">
        ${ReportsPage.reportHeader('دليل الإجراءات', false)}
        ${chosen.length ? chosen.map(f => `
          <div class="card" style="margin-bottom:16px">
            <h3 style="margin-top:0">${this.fieldTitle(f.key)}</h3>
            <div>${this.fieldContent(f.key) || `<span style="color:var(--text-muted)">لم يُضَف محتوى بعد.</span>`}</div>
          </div>
        `).join('') : '<p style="color:var(--text-muted)">لم يُختر أي حقل للعرض — اختر حقلًا واحدًا على الأقل أدناه.</p>'}
      </div>
      <div class="no-print" style="margin-top:18px;display:flex;align-items:end;gap:10px;flex-wrap:wrap">
        <div class="field" style="margin:0">
          <label>اتجاه الصفحة عند الطباعة</label>
          <select id="procPageOrientation">
            <option value="portrait" ${ReportsPage.pageOrientation === 'portrait' ? 'selected' : ''}>عمودي</option>
            <option value="landscape" ${ReportsPage.pageOrientation === 'landscape' ? 'selected' : ''}>أفقي</option>
          </select>
        </div>
        <button class="btn btn-gold" id="printProcBtn">تصدير PDF (طباعة)</button>
      </div>

      <div class="card no-print" style="margin-top:24px">
        <h3 style="margin-top:0">الحقول المُضمَّنة عند الطباعة</h3>
        <p style="color:var(--text-muted);font-size:12.5px;margin-top:0">
          اختر أي الحقول تريد تضمينها في النسخة المطبوعة — من حقل واحد فقط إلى الستة كاملة.
        </p>
        <div class="indicator-grid-3">
          ${this.fields.map(f => `
            <label class="indicator-check">
              <input type="checkbox" data-field="${f.key}" ${this.selectedFields.has(f.key) ? 'checked' : ''}> ${this.fieldTitle(f.key)}
            </label>
          `).join('')}
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
          <input type="checkbox" id="procIncludeCover" ${this.includeCover ? 'checked' : ''}> إرفاق غلاف خارجي (خلفيته تُضبط من الإعدادات ← عام)
        </label>
        <div id="procCoverOptions" style="display:${this.includeCover ? 'grid' : 'none'};margin-top:10px" class="form-grid">
          ${this.includeCover ? ReportsPage.coverOptionsHtml('procCover', 'دليل الإجراءات', '', '') : ''}
        </div>
      </div>
    `;

    container.querySelectorAll('[data-field]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) this.selectedFields.add(cb.dataset.field);
        else this.selectedFields.delete(cb.dataset.field);
        this.render(container); // تحديث فوري لمعاينة الطباعة
      });
    });
    document.getElementById('procIncludeCover').addEventListener('change', (e) => {
      this.includeCover = e.target.checked;
      this.render(container); // إعادة رسم كاملة حتى يُبنى/يُزال الغلاف كجزء طبيعي من الصفحة فورًا
    });
    document.getElementById('procPageOrientation').addEventListener('change', (e) => {
      ReportsPage.pageOrientation = e.target.value;
      this.render(container); // إعادة رسم لتحديث خيار الخلفية المطابقة للاتجاه الجديد إن وُجدت
    });
    document.getElementById('printProcBtn').addEventListener('click', () => {
      this.render(container); // يضمن أن الغلاف يعكس آخر عنوان/فترة كتبها المستخدم قبل الطباعة مباشرة
      ReportsPage.printToPdf('دليل الإجراءات');
    });
  }
};


/* ===== app.js ===== */
/**
 * ===== المتحكم الرئيسي (SPA Router) =====
 * يربط الصفحات ببعضها، ولا يحتوي على أي منطق بيانات — فقط توجيه وعرض.
 */
const App = {
  currentRoute: 'dashboard',
  _wired: false,

  defaultNavIcons: { dashboard: '🏠', entry: '📝', reports: '📊', about: 'ℹ️', procedures: '📋', settings: '⚙️' },

  /** يُستدعى مرة واحدة فقط عند تحميل الصفحة، بصرف النظر عن عدد مرات الدخول/الخروج
   *  من المكاتب لاحقًا — يربط أزرارًا ثابتة في الواجهة لا تتغير بتغيّر المكتب. */
  wireOnce() {
    if (this._wired) return;
    this._wired = true;

    const savedTheme = localStorage.getItem('officeStatsTheme');
    if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());
    window.addEventListener('hashchange', () => this.renderRoute());

    const sidebar = document.querySelector('.sidebar');
    const toggleMenu = () => sidebar.classList.toggle('mobile-open');
    const closeMenu = () => sidebar.classList.remove('mobile-open');
    document.getElementById('mobileMenuBtn').addEventListener('click', toggleMenu);
    document.querySelectorAll('.nav-link').forEach(l => l.addEventListener('click', closeMenu));

    document.getElementById('presExitBtn').addEventListener('click', () => PresentationPage.stop());
    document.getElementById('presPrevBtn').addEventListener('click', () => { PresentationPage.pause(); PresentationPage.prev(); });
    document.getElementById('presNextBtn').addEventListener('click', () => { PresentationPage.pause(); PresentationPage.next(); });
    document.getElementById('presPlayPauseBtn').addEventListener('click', () => PresentationPage.togglePlay());
    document.getElementById('presSpeedSelect').addEventListener('change', (e) => PresentationPage.changeSpeed(+e.target.value));
  },

  /** يُستدعى في كل مرة يُختار فيها مكتب (من Workspace.enter) — يحمّل هوية وبيانات
   *  ذلك المكتب تحديدًا ويعرض الصفحة الرئيسية. */
  start() {
    this.wireOnce();
    this.refreshBranding();
    this.setupYearSelect();
    this.renderRoute();
  },

  refreshBranding() {
    const g = StorageEngine.readGlobal() || { organizationName: 'مكتب التواصل والعلاقات العامة', organizationLogo: '' };
    const s = DataLayer.getSettings();
    document.getElementById('branchNameLabel').textContent = s.branchName || '—';
    document.getElementById('officeNameLabel').textContent = g.organizationName;
    const badge = document.getElementById('brandBadge');
    badge.innerHTML = g.organizationLogo ? `<img src="${g.organizationLogo}" alt="الشعار">` : 'إح';

    const switchBtn = document.getElementById('switchOfficeBtn');
    switchBtn.style.display = Workspace.visibleOffices().length > 1 ? '' : 'none';

    // إخفاء تبويب الإعدادات كليًا من القائمة إن لم تتوفر أي صلاحية إعدادات أصلًا
    document.getElementById('settingsNavLink').style.display = Auth.hasAnySettingsAccess() ? '' : 'none';

    // أيقونات القائمة الرئيسية — مشتركة بين المكتبين، وتُعدَّل من الإعدادات ← عام
    const navIcons = { ...this.defaultNavIcons, ...(g.navIcons || {}) };
    Object.entries(navIcons).forEach(([key, icon]) => {
      const el = document.getElementById(`navIcon_${key}`);
      if (el) el.textContent = icon;
    });
  },

  setupYearSelect() {
    const s = DataLayer.getSettings();
    const sel = document.getElementById('yearSelect');
    const currentSelection = sel.value ? parseInt(sel.value) : new Date().getFullYear();
    const years = yearRange(Math.min(s.reportYearFrom, currentSelection), Math.max(s.reportYearTo, currentSelection));
    sel.innerHTML = years.map(y => `<option value="${y}" ${y === currentSelection ? 'selected' : ''}>${y}</option>`).join('');
    sel.onchange = () => this.renderRoute();
  },

  toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('officeStatsTheme', 'light'); }
    else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('officeStatsTheme', 'dark'); }
    this.renderRoute();
  },

  getYear() {
    const sel = document.getElementById('yearSelect');
    return sel ? parseInt(sel.value) : new Date().getFullYear();
  },

  titles: {
    dashboard: 'الصفحة الرئيسية', entry: 'إدخال البيانات',
    reports: 'التقارير', settings: 'الإعدادات', about: 'عن المكتب', procedures: 'دليل الإجراءات'
  },

  // مسارات قديمة (روابط سابقة) أصبحت تبويبات فرعية داخل الإعدادات — نحافظ عليها متاحة
  // حتى لا تنكسر أي روابط محفوظة لدى المستخدم، فقط نوجّهها للتبويب الصحيح.
  legacyRouteToSettingsTab: { departments: 'departments', health: 'health', backup: 'backup' },

  renderRoute() {
    let route = (location.hash || '#dashboard').replace('#', '');

    if (this.legacyRouteToSettingsTab[route]) {
      SettingsPage.activeTab = this.legacyRouteToSettingsTab[route];
      route = 'settings';
    }

    this.currentRoute = route;
    document.getElementById('pageTitle').textContent = this.titles[route] || '';
    document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.route === route));

    const content = document.getElementById('content');
    const year = this.getYear();

    try {
      if (route === 'dashboard') DashboardPage.render(content, year);
      else if (route === 'entry') EntryPage.render(content, year);
      else if (route === 'reports') ReportsPage.render(content, year);
      else if (route === 'about') AboutPage.render(content);
      else if (route === 'procedures') ProceduresPage.render(content);
      else if (route === 'settings') {
        if (!Auth.hasAnySettingsAccess()) { content.innerHTML = '<div class="card">لا تملك صلاحية الوصول لهذه الصفحة.</div>'; return; }
        SettingsPage.render(content, year);
      }
      else content.innerHTML = '<div class="card">الصفحة غير موجودة</div>';
    } catch (e) {
      content.innerHTML = `<div class="card" style="color:var(--danger)">تعذر تحميل الصفحة: ${e.message}</div>`;
      console.error(e);
    }
  }
};


/* ===== workspace.js ===== */
/**
 * ===== شاشة اختيار المكتب (Workspace Switcher) =====
 * نقطة الدخول الأولى للنظام. كل مكتب له تخزين مستقل بالكامل عبر StorageEngine،
 * فبمجرد اختيار مكتب تُحمَّل بياناته فقط، ولا تختلط بالمكتب الآخر إطلاقًا.
 *
 * هذه الشاشة تبقى مخصّصة لاختيار المكتب فقط دون أي عناصر إدارية — تعديل هوية
 * الجهة المشتركة (الاسم والشعار) متاح من داخل الإعدادات ← عام، في أي مكتب.
 */
const Workspace = {
  OFFICES: [
    { key: 'office1', defaultName: 'المكتب الأول' },
    { key: 'office2', defaultName: 'المكتب الثاني' }
  ],

  REMEMBER_KEY: 'officeStatsRememberedRole_v1',

  init() {
    StorageEngine.migrateLegacyIfNeeded();
    StorageEngine.ensureGlobalSettings();
    Auth.ensureDefaults();

    document.getElementById('switchOfficeBtn').addEventListener('click', () => this.exitToLanding());
    document.getElementById('logoutBtn').addEventListener('click', () => this.logout());
    document.getElementById('loginBtn').addEventListener('click', () => this.attemptLogin());
    document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') this.attemptLogin(); });

    // "تذكرني": إن وُجدت جلسة محفوظة على هذا الجهاز، نتخطى شاشة الدخول — لكن بعد
    // إعادة التحقق أن هذا الحساب لا يزال مفعّلًا وغير منتهي الصلاحية، وإلا فحساب
    // مؤقت أو مُعطَّل يبقى يتجاوز القيد طالما "تذكرني" محفوظة على هذا الجهاز.
    const remembered = localStorage.getItem(this.REMEMBER_KEY);
    if (remembered && ['admin', 'supervisor', 'employee'].includes(remembered)) {
      const acc = Auth.getAuth()[remembered];
      const stillValid = remembered === 'admin' || (acc && acc.enabled !== false && !Auth.isExpired(acc));
      if (stillValid) {
        Auth.currentRole = remembered;
        const visible = this.visibleOffices();
        if (visible.length === 1) this.enter(visible[0].key);
        else this.renderLanding();
        return;
      }
      localStorage.removeItem(this.REMEMBER_KEY); // لم يعد صالحًا — امسح الجلسة المحفوظة
    }

    this.showLogin();
  },

  /** المكاتب غير المخفية من إعدادات "وضع العرض". حماية إضافية: لو أُخفي كل شيء
   *  بالخطأ (حالة غير متوقعة)، نتجاهل الإخفاء ونعرض الكل بدل شاشة فارغة. */
  visibleOffices() {
    const g = StorageEngine.readGlobal() || {};
    const hidden = g.hiddenOffices || [];
    const visible = this.OFFICES.filter(o => !hidden.includes(o.key));
    return visible.length ? visible : this.OFFICES;
  },

  /** قراءة اسم المكتب المحفوظ دون تفعيله كمكتب حالي — لعرضه على البطاقة فقط.
   *  يدعم التوافق مع النسخ القديمة (officeName) إن لم يوجد branchName بعد. */
  peekBranchName(key) {
    const raw = localStorage.getItem(StorageEngine.keyFor(key));
    if (!raw) return null;
    try {
      const s = JSON.parse(raw).settings || {};
      return s.branchName || s.officeName || null;
    } catch (e) { return null; }
  },

  showLogin() {
    const g = StorageEngine.readGlobal() || {};
    document.getElementById('loginBranchName').textContent = g.organizationName || 'تسجيل الدخول';
    const logoEl = document.getElementById('loginLogo');
    logoEl.innerHTML = g.organizationLogo ? `<img src="${g.organizationLogo}" alt="الشعار">` : 'إح';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').textContent = '';
    document.getElementById('app').classList.add('hidden');
    document.getElementById('landingScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('loginUsername').focus();
  },

  attemptLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    const result = Auth.login(username, password);
    if (result.success) {
      errEl.textContent = '';
      if (document.getElementById('rememberMeCheckbox').checked) {
        localStorage.setItem(this.REMEMBER_KEY, Auth.currentRole);
      }
      document.getElementById('loginScreen').classList.add('hidden');
      // بعد الدخول: مكتب واحد ظاهر فقط → ادخله مباشرة، وإلا اعرض شاشة الاختيار
      const visible = this.visibleOffices();
      if (visible.length === 1) this.enter(visible[0].key);
      else this.renderLanding();
    } else if (result.reason === 'expired') {
      errEl.textContent = 'انتهت صلاحية هذا الحساب المؤقت. تواصل مع مسؤول النظام لتجديده.';
    } else if (result.reason === 'disabled') {
      errEl.textContent = 'هذا الحساب معطَّل حاليًا. تواصل مع مسؤول النظام.';
    } else {
      // رسالة عامة لا تكشف أي تفاصيل عن مستويات الصلاحيات المتاحة
      errEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    }
  },

  /** تسجيل الخروج الكامل: يُنهي الجلسة، يمسح "تذكرني" إن وُجدت، ويعيد لشاشة الدخول. */
  logout() {
    Auth.logout();
    localStorage.removeItem(this.REMEMBER_KEY);
    document.getElementById('app').classList.add('hidden');
    document.getElementById('landingScreen').classList.add('hidden');
    this.showLogin();
  },

  renderLanding() {
    const g = StorageEngine.readGlobal() || { organizationName: 'مكتب التواصل والعلاقات العامة', organizationLogo: '' };

    document.getElementById('landingOrgName').textContent = g.organizationName;
    const logoEl = document.getElementById('landingLogo');
    logoEl.innerHTML = g.organizationLogo ? `<img src="${g.organizationLogo}" alt="الشعار">` : 'إح';

    document.getElementById('landingScreen').classList.remove('hidden');

    const container = document.getElementById('landingCards');
    const cardBg = g.landingCardBackground ? ` style="background-image:url('${g.landingCardBackground}')"` : '';
    container.innerHTML = this.visibleOffices().map(o => {
      const name = this.peekBranchName(o.key) || o.defaultName;
      return `
        <button type="button" class="landing-card"${cardBg} data-office="${o.key}">
          <div class="landing-card-name">${name}</div>
        </button>
      `;
    }).join('');
    container.querySelectorAll('.landing-card').forEach(btn => {
      btn.addEventListener('click', () => this.enter(btn.dataset.office));
    });

    // الزر يظهر فقط عند وجود أكثر من مكتب فعليًا (لا معنى لعرض "شامل" لمكتب واحد) —
    // ونستخدم .onclick بدل addEventListener لأن هذا عنصر ثابت قد تُستدعى renderLanding
    // من أجله أكثر من مرة في الجلسة، وaddEventListener كان سيراكم معالجات مكررة.
    const presBtn = document.getElementById('landingPresentationBtn');
    presBtn.style.display = this.visibleOffices().length > 1 ? '' : 'none';
    presBtn.onclick = () => PresentationPage.startForAllOffices();
  },

  /** يُختار مكتب بعد تسجيل الدخول بالفعل — لا حاجة لتسجيل دخول إضافي هنا. */
  enter(officeKey) {
    const isFresh = !StorageEngine.hasData(officeKey);
    StorageEngine.setWorkspace(officeKey);
    DataLayer.init();
    if (isFresh) {
      const def = this.OFFICES.find(o => o.key === officeKey);
      DataLayer.updateSettings({ branchName: def.defaultName });
    }
    document.getElementById('landingScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    location.hash = '#dashboard';
    App.start();
    if (typeof initFirebaseSync === 'function') initFirebaseSync(officeKey);
  },

  /** "تبديل المكتب": يبقي المستخدم مسجّلًا للدخول، فقط يعيده لشاشة اختيار المكتب. */
  /** عنصر واجهة صغير قابل لإعادة الاستخدام: خانة اختيار "تطبيق على المكتب الآخر أيضًا" —
   *  يظهر فقط إن كان هناك أكثر من مكتب واحد أصلًا. */
  otherOfficeCheckbox(idSuffix) {
    if (this.OFFICES.length < 2) return '';
    return `
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);margin-top:8px">
        <input type="checkbox" id="other_office_${idSuffix}"> تطبيق نفس التغيير على المكتب الآخر أيضًا
      </label>
    `;
  },

  /** ينفّذ عملية معيّنة على بيانات المكتب الآخر مؤقتًا، ثم يعيد الحالة لمكتب العمل
   *  الحالي فور الانتهاء — يُستخدم لمزامنة إضافة/إعادة تسمية محور أو إدارة بين
   *  المكتبين، دون الحاجة لخروج المستخدم من المكتب الذي يعمل عليه فعليًا. */
  applyToOtherOffice(action) {
    const current = StorageEngine.currentWorkspace;
    const other = this.OFFICES.map(o => o.key).find(k => k !== current);
    if (!other) return;
    StorageEngine.setWorkspace(other);
    DataLayer.init();
    try { action(); }
    finally {
      StorageEngine.setWorkspace(current);
      DataLayer.init();
    }
  },

  exitToLanding() {
    document.getElementById('app').classList.add('hidden');
    if (typeof syncPollTimer !== 'undefined' && syncPollTimer) { clearInterval(syncPollTimer); syncPollTimer = null; }
    if (typeof currentSyncOfficeKey !== 'undefined') currentSyncOfficeKey = null;
    this.renderLanding();
  }
};

/* ================================================================
   المزامنة السحابية عبر Firestore REST مباشرة (نفس مشروع نظام تسجيل الطلبات،
   بمسارات منفصلة تمامًا: offices/{officeKey}/{table}/{id})
   تُزامَن بيانات "المكتب المفتوح حاليًا فقط" — وليس كل المكاتب معًا.
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAaRXeO3xCttPnOjc_eC17buuJzzJKAPv8",
  authDomain: "ihsaa-jazan.firebaseapp.com",
  projectId: "ihsaa-jazan",
  storageBucket: "ihsaa-jazan.firebasestorage.app",
  messagingSenderId: "788851689685",
  appId: "1:788851689685:web:58a9333a77657d2f83ba5c"
};
const SYNC_TABLES = ['requests', 'activities', 'communication', 'weekly_sessions'];
const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents`;

let authIdToken = null, authRefreshToken = null, authExpiresAt = 0;
let syncPollTimer = null;
let currentSyncOfficeKey = null;

function updateSyncStatusUI(text) {
  const btn = document.getElementById('syncStatusBadge');
  const dot = document.getElementById('syncDot');
  if (!btn || !dot) return;
  btn.title = text + ' — اضغط لعرض التفاصيل';
  let cls = 'sync-dot-gray';
  if (text.includes('🟢')) cls = 'sync-dot-green';
  else if (text.includes('🔄') || text.includes('⏳')) cls = 'sync-dot-yellow';
  else if (text.includes('🟠') || text.includes('⚠️') || text.includes('⛔')) cls = 'sync-dot-red';
  dot.className = 'sync-dot ' + cls;
}

let syncDiag = { steps: [] };
function diagStep(label, status, detail) {
  syncDiag.steps.push({ label, status, detail: detail || '', time: new Date().toLocaleTimeString('ar-SA') });
  const modal = document.getElementById('syncDiagModal');
  if (modal && !modal.classList.contains('hidden')) renderSyncDiagBody();
}
function renderSyncDiagBody() {
  const box = document.getElementById('syncDiagBody');
  if (!box) return;
  const rows = syncDiag.steps.map(s => {
    const cls = s.status === 'ok' ? 'diag-ok' : (s.status === 'fail' ? 'diag-fail' : 'diag-pending');
    const icon = s.status === 'ok' ? '✅' : (s.status === 'fail' ? '❌' : '⏳');
    return `<div class="diag-row"><div class="dk">${icon} ${s.label} <span style="color:var(--text-muted);font-size:11px">(${s.time})</span></div><div class="dv ${cls}">${s.detail}</div></div>`;
  }).join('');
  box.innerHTML = rows || '<p style="color:var(--text-muted)">لم تبدأ أي محاولة اتصال بعد.</p>';
}
document.getElementById('syncStatusBadge').addEventListener('click', () => {
  renderSyncDiagBody();
  document.getElementById('syncDiagModal').classList.remove('hidden');
});
document.getElementById('closeSyncDiag').addEventListener('click', () => document.getElementById('syncDiagModal').classList.add('hidden'));
document.getElementById('closeSyncDiagBtn').addEventListener('click', () => document.getElementById('syncDiagModal').classList.add('hidden'));
document.getElementById('btnSyncDiagRetry').addEventListener('click', () => {
  syncDiag = { steps: [] };
  renderSyncDiagBody();
  if (currentSyncOfficeKey) initFirebaseSync(currentSyncOfficeKey);
});

/* ---- المصادقة عبر REST خام ---- */
async function authSignInAnonymousRest() {
  const t0 = Date.now();
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true })
  });
  const ms = Date.now() - t0;
  if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`HTTP ${res.status} خلال ${ms}ms: ${t.slice(0, 150)}`); }
  const data = await res.json();
  authIdToken = data.idToken; authRefreshToken = data.refreshToken;
  authExpiresAt = Date.now() + (parseInt(data.expiresIn || '3600', 10) * 1000);
  return ms;
}
async function authRefreshIfNeeded() {
  if (authIdToken && Date.now() < authExpiresAt - 5 * 60 * 1000) return;
  if (!authRefreshToken) { await authSignInAnonymousRest(); return; }
  const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_CONFIG.apiKey}`, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(authRefreshToken)}`
  });
  if (!res.ok) { await authSignInAnonymousRest(); return; }
  const data = await res.json();
  authIdToken = data.id_token; authRefreshToken = data.refresh_token;
  authExpiresAt = Date.now() + (parseInt(data.expires_in || '3600', 10) * 1000);
}

/* ---- تحويل بين كائنات JS وتنسيق حقول Firestore REST المُصنَّف ---- */
function toFirestoreFields(obj) {
  const fields = {};
  Object.keys(obj || {}).forEach(k => {
    const v = obj[k];
    if (v === null || v === undefined || v === '') { fields[k] = { nullValue: null }; return; }
    if (typeof v === 'number') { fields[k] = { doubleValue: v }; return; }
    if (typeof v === 'boolean') { fields[k] = { booleanValue: v }; return; }
    // المصفوفات/الكائنات المتداخلة (كالإحالات وعناصر الإجراء) تُخزَّن كنص JSON لتفادي
    // تعقيد بناء قيم Firestore المتداخلة يدويًا؛ تُفكَّك تلقائيًا عند القراءة.
    if (typeof v === 'object') { fields[k] = { stringValue: JSON.stringify(v) }; return; }
    fields[k] = { stringValue: String(v) };
  });
  return fields;
}
function fromFirestoreFields(fields) {
  const obj = {};
  Object.keys(fields || {}).forEach(k => {
    const v = fields[k];
    if (v.nullValue !== undefined) { obj[k] = ''; return; }
    if (v.doubleValue !== undefined) { obj[k] = v.doubleValue; return; }
    if (v.integerValue !== undefined) { obj[k] = parseInt(v.integerValue, 10); return; }
    if (v.booleanValue !== undefined) { obj[k] = v.booleanValue; return; }
    if (v.stringValue !== undefined) {
      const s = v.stringValue;
      if (s && (s[0] === '[' || s[0] === '{')) { try { obj[k] = JSON.parse(s); return; } catch (e) {} }
      obj[k] = s;
      return;
    }
    obj[k] = '';
  });
  return obj;
}

/* ---- عمليات Firestore عبر REST، لكل جدول ضمن مسار المكتب الحالي ---- */
function tablePath(officeKey, table) { return `offices/${officeKey}/${table}`; }

/* إعادة محاولة تلقائية مع تأخير تصاعدي (Exponential Backoff) عند أخطاء 429 (Too Many
   Requests) أو 503 (Service Unavailable) — شائعة جدًا كأخطاء مؤقتة عند أول استخدام
   لمجموعة/مسار جديد تمامًا في Firestore لم "يتوسّع" بعد تلقائيًا لاستيعاب الحمل،
   وتُحل غالبًا خلال محاولات قليلة بفارق ثوانٍ. */
async function fetchWithRetry(input, init, maxRetries) {
  maxRetries = maxRetries === undefined ? 3 : maxRetries;
  let lastErr = null;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    const res = await fetch(input, init);
    if (res.status !== 429 && res.status !== 503) return res;
    lastErr = res;
    if (attempt < maxRetries) {
      const delayMs = 1000 * Math.pow(2, attempt); // 1s ثم 2s ثم 4s ثم 8s
      diagStep('إعادة محاولة تلقائية (HTTP ' + res.status + ')', 'pending', `سيُعاد الطلب خلال ${delayMs / 1000} ثانية (محاولة ${attempt + 2} من ${maxRetries + 1})`);
      await new Promise(r => setTimeout(r, delayMs));
    }
  }
  return lastErr;
}

async function firestoreListAll(officeKey, table) {
  await authRefreshIfNeeded();
  let all = [], pageToken = null;
  do {
    const url = new URL(`${FIRESTORE_BASE}/${tablePath(officeKey, table)}`);
    url.searchParams.set('pageSize', '300');
    if (pageToken) url.searchParams.set('pageToken', pageToken);
    const res = await fetchWithRetry(url.toString(), { headers: { 'Authorization': `Bearer ${authIdToken}` } });
    if (!res.ok) {
      if (res.status === 404 || res.status === 400) return []; // المجموعة غير موجودة بعد (لا بيانات سابقة)، ليس خطأ حقيقيًا
      throw new Error('فشل جلب ' + table + ': HTTP ' + res.status);
    }
    const data = await res.json();
    (data.documents || []).forEach(doc => {
      const id = doc.name.split('/').pop();
      all.push({ id, ...fromFirestoreFields(doc.fields) });
    });
    pageToken = data.nextPageToken || null;
  } while (pageToken);
  return all;
}
async function firestoreCommit(officeKey, table, writes) {
  if (!writes.length) return;
  await authRefreshIfNeeded();
  const body = { writes: writes.map(w => {
    const name = `projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/${tablePath(officeKey, table)}/${w.id}`;
    return w.type === 'delete' ? { delete: name } : { update: { name, fields: toFirestoreFields(w.data) } };
  })};
  const res = await fetchWithRetry(`${FIRESTORE_BASE}:commit`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authIdToken}` }, body: JSON.stringify(body)
  });
  if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error('فشل الحفظ: HTTP ' + res.status + ' ' + t.slice(0, 150)); }
}

/* المقارنة بين حالة كل جدول قبل وبعد أي تعديل محلي، ورفع الفرق فقط دفعيًا */
function syncReconcileAndPush(prevState, newState) {
  if (!authIdToken || !currentSyncOfficeKey) return;
  const officeKey = currentSyncOfficeKey;
  SYNC_TABLES.forEach(table => {
    const prevRows = (prevState && prevState[table]) || [];
    const newRows = (newState && newState[table]) || [];
    const prevMap = new Map(prevRows.map(r => [String(r.id), r]));
    const newMap = new Map(newRows.map(r => [String(r.id), r]));
    const toSet = [];
    const toDelete = [];
    newMap.forEach((rec, id) => {
      const prev = prevMap.get(id);
      if (!prev || JSON.stringify(prev) !== JSON.stringify(rec)) toSet.push({ id, data: rec });
    });
    prevMap.forEach((rec, id) => { if (!newMap.has(id)) toDelete.push(id); });
    if (!toSet.length && !toDelete.length) return;

    const ops = toSet.map(o => ({ type: 'set', id: o.id, data: o.data })).concat(toDelete.map(id => ({ type: 'delete', id })));
    const CHUNK = 400;
    const chunks = [];
    for (let i = 0; i < ops.length; i += CHUNK) chunks.push(ops.slice(i, i + CHUNK));

    updateSyncStatusUI('🔄 جارٍ المزامنة...');
    (async () => {
      try {
        for (const chunk of chunks) await firestoreCommit(officeKey, table, chunk);
        updateSyncStatusUI('🟢 متصل ومتزامن');
      } catch (err) {
        console.warn('فشلت مزامنة ' + table + ':', err);
        updateSyncStatusUI('🟠 تعذّر رفع آخر تعديل - سيُعاد المحاولة لاحقًا');
      }
    })();
  });
}

/* يُطبَّق عند كل فحص دوري: يقارن قائمة السحابة الكاملة لكل جدول بالسجلات المحلية،
   ويدمج بأولوية الأحدث تعديلًا (updated_at)، ويعيد رفع أي سجل محلي أحدث من نسخة السحابة. */
function applyRemoteTableList(table, remoteList) {
  const officeKey = currentSyncOfficeKey;
  if (!officeKey || StorageEngine.currentWorkspace !== officeKey) return; // تغيّر المكتب المفتوح أثناء الفحص، تجاهل
  const state = DataLayer._syncGetState();
  const localRows = (state[table] || []);
  const idsLocalWins = [];
  window.__applyingRemoteSnapshot = true;
  const byId = new Map(localRows.map(r => [String(r.id), r]));
  const remoteIds = new Set(remoteList.map(r => String(r.id)));
  byId.forEach((rec, id) => { if (rec.__cloudSynced && !remoteIds.has(id)) byId.delete(id); });

  remoteList.forEach(remoteRec => {
    const idStr = String(remoteRec.id);
    remoteRec.id = isNaN(+remoteRec.id) ? remoteRec.id : +remoteRec.id;
    remoteRec.__cloudSynced = true;
    const local = byId.get(idStr);
    if (!local) { byId.set(idStr, remoteRec); return; }
    const localTime = new Date(local.updated_at || 0).getTime();
    const remoteTime = new Date(remoteRec.updated_at || 0).getTime();
    if (remoteTime > localTime) byId.set(idStr, remoteRec);
    else if (localTime > remoteTime) idsLocalWins.push(idStr);
  });

  const newRows = Array.from(byId.values());
  const changed = JSON.stringify(localRows) !== JSON.stringify(newRows);
  if (changed) {
    state[table] = newRows;
    StorageEngine.write(state);
    if (typeof App !== 'undefined' && App.renderRoute) App.renderRoute();
  }
  window.__applyingRemoteSnapshot = false;

  if (idsLocalWins.length) {
    const rowsToRepush = idsLocalWins.map(id => state[table].find(r => String(r.id) === id)).filter(Boolean);
    if (rowsToRepush.length) {
      updateSyncStatusUI('🔄 جارٍ المزامنة...');
      (async () => {
        try { await firestoreCommit(officeKey, table, rowsToRepush.map(r => ({ type: 'set', id: String(r.id), data: r }))); updateSyncStatusUI('🟢 متصل ومتزامن'); }
        catch (e) { console.warn(e); }
      })();
    }
  }
}

function startSyncPolling(officeKey) {
  if (syncPollTimer) clearInterval(syncPollTimer);
  syncPollTimer = setInterval(async () => {
    if (StorageEngine.currentWorkspace !== officeKey) return; // بدّل المستخدم المكتب، نتوقف بصمت
    try {
      for (const table of SYNC_TABLES) {
        const remoteList = await firestoreListAll(officeKey, table);
        applyRemoteTableList(table, remoteList);
      }
      updateSyncStatusUI('🟢 متصل ومتزامن');
    } catch (err) {
      console.warn('فشل الفحص الدوري:', err);
      updateSyncStatusUI('🟠 تعذّر التحديث الدوري');
    }
  }, 20000);
}

async function initFirebaseSync(officeKey) {
  if (syncPollTimer) { clearInterval(syncPollTimer); syncPollTimer = null; }
  currentSyncOfficeKey = officeKey;
  syncDiag = { steps: [] };
  try {
    updateSyncStatusUI('🔄 جارٍ الاتصال...');
    diagStep('تسجيل الدخول المجهول (REST مباشر)', 'pending', 'جارٍ الانتظار...');
    const ms = await authSignInAnonymousRest();
    diagStep('تسجيل الدخول المجهول (REST مباشر)', 'ok', `تم بنجاح خلال ${ms} مللي ثانية`);

    for (const table of SYNC_TABLES) {
      diagStep('جلب ودمج جدول: ' + table, 'pending', 'جارٍ الجلب...');
      const remoteList = await firestoreListAll(officeKey, table);
      applyRemoteTableList(table, remoteList);
      diagStep('جلب ودمج جدول: ' + table, 'ok', `${remoteList.length} سجل من السحابة`);
      // بذر السجلات المحلية غير الموجودة بعد في السحابة لهذا الجدول
      const localRows = (DataLayer._syncGetState()[table] || []);
      syncReconcileAndPushSingleTable(officeKey, table, [], localRows);
    }

    startSyncPolling(officeKey);
    diagStep('بدء الفحص الدوري (كل 20 ثانية)', 'ok', 'يعمل الآن');
    updateSyncStatusUI('🟢 متصل ومتزامن');
  } catch (err) {
    console.warn('فشلت المزامنة السحابية:', err);
    diagStep('خطأ', 'fail', (err && err.message) || String(err));
    updateSyncStatusUI('⚠️ تعذّر الاتصال بالسحابة — يعمل النظام محليًا فقط');
  }
}
/* نسخة مساعدة من syncReconcileAndPush لجدول واحد فقط (تُستخدم للبذر الأولي بمعزل عن بقية الجداول) */
function syncReconcileAndPushSingleTable(officeKey, table, prevRows, newRows) {
  syncReconcileAndPush({ [table]: prevRows }, { [table]: newRows });
}


Workspace.init();
